/* ---------- 位置の読み取り ---------- */
// 空欄を 0 と読み替えないための変換。空なら null を返す
// （`+''` は 0 になるため、そのまま使うと未入力が「緯度0・経度0」として地図に出てしまう）
// 位置の入力チェック。ok=false なら why に理由が入る
// 全体が数のときだけ受ける（parseFloat は '43abc' を 43 にしてしまう）。
// 片方だけ入っているのは位置にならないので受けない
function parsePos(lat, lon){
  const sl=String(lat??'').trim(), so=String(lon??'').trim();
  if(sl==='' && so==='') return {ok:true, empty:true, lat:'', lon:''};
  if(sl==='' || so==='') return {ok:false, why:'緯度と経度は両方入れてください'};
  const a=numOf(sl), b=numOf(so);
  if(a==='' || Math.abs(a)>90)  return {ok:false, why:'緯度の値を確かめてください'};
  if(b==='' || Math.abs(b)>180) return {ok:false, why:'経度の値を確かめてください'};
  return {ok:true, empty:false, lat:a, lon:b};
}
function ptOf(lat, lon){
  const pos = parsePos(lat, lon);
  return (pos.ok && !pos.empty) ? [pos.lat, pos.lon] : null;
}

/* ============================================================
   物理環境の計算（魚類調査アプリから移植）
   取り方は 点／ライン／メッシュ の3通り。どれも記録1件（rd_units）で、
   ちがうのは位置の持ち方だけ（点＝latitude/longitude、
   線＝始点・曲がり・終点、メッシュ＝四隅＋間隔）。

   単位は産卵床のまま（水深 cm・流速 m/s）。
   魚類側は流速が cm/s なので、写すときに velocity_cms → velocity_ms と読み替えてある。
   ここには数え方・測り方だけを置く。画面は Phase 2 以降で入れ替える。
   ============================================================ */
const MESH_MAX_CELLS = 2000;      // これを超える格子は作らない
const MESH_MIN_EDGE_M = 0.5;      // これより短い辺は、押し間違いとみなす
const MESH_MAX_SPAN_DEG = 1;      // 1つの範囲が緯度経度で1度を超えることはない
const ENV_AUTO_MS = 600;          // 打ちかけを自動で保存するまでの待ち時間

/* 古い測位を使わない。前の測点の場所が付くのを防ぐ */
function freshFix(maxAgeMs){
  if(!lastFix) return null;
  return (Date.now()-lastFix.t) <= (maxAgeMs||30000) ? lastFix : null;
}

/* ---------- 取り方（点／ライン／メッシュ） ---------- */
// 未設定は「点」（いままでの取り方）
function envMethod(u){
  const m = u && u.env_method;
  return (m==='ライン' || m==='メッシュ') ? m : '点';
}
function isLine(u){ return envMethod(u)==='ライン'; }
function isMesh(u){ return envMethod(u)==='メッシュ'; }
function methodWord(m){ return m==='ライン' ? '区間' : (m==='メッシュ' ? '範囲' : '地点'); }
// 名前の頭文字。点=P／ライン=L／メッシュ=M
function envKindOf(u){ const m=envMethod(u); return m==='ライン'?'L':(m==='メッシュ'?'M':'P'); }
/* P1 / L1 / M1 の採番。取り方ごとに数える。
   消したものも数える。消した番号を使い回すと、先に書き出したCSVの P2 と、
   あとから作った P2 が別物になる */
function envAutoName(svUuid, kind){
  const used = DB.load(DB.key.un).filter(x=>x.survey_uuid===svUuid)
    .map(x=>{ const m=String(x.name||'').match(new RegExp('^'+kind+'(\\d+)$')); return m ? +m[1] : 0; });
  const max = used.length ? Math.max.apply(null, used) : 0;
  return kind + (max + 1);
}

/* ---------- 環境区分（複数選べる） ---------- */
// 「早瀬・淵」のように複数入っていても、1つずつ略す
function habitatShort(v){
  return String(v||'').split('・').map(x=>HABITAT_SHORT[x] || x).filter(Boolean).join('・');
}
function habitatLong(short){
  const hit = Object.keys(HABITAT_SHORT).find(k=>HABITAT_SHORT[k]===short);
  return hit || (short==='なし' ? '' : short);
}
// 記録には「早瀬・淵」のように「・」でつないだ1つの文字として入れる
function habitatList(v){ return String(v||'').split('・').filter(Boolean); }

/* ---------- 測点から出す代表値 ---------- */
/* 最小・最大・平均を出す。代表値は手入力があればそちら。
   0 を落とさないよう nums() を通す（淀みの流速0・干出の水深0は測った値） */
function pointStats(u, field, manualField){
  const v = nums(envPoints(u||{}).map(p=>p[field]));
  const manual = numOf((u||{})[manualField]);
  const avg = v.length ? v.reduce((a,b)=>a+b,0)/v.length : '';
  return {
    n: v.length,
    min: v.length ? Math.min.apply(null,v) : '',
    max: v.length ? Math.max.apply(null,v) : '',
    avg, manual,
    rep: manual!=='' ? manual : avg,
  };
}
function depthStats(u){ return pointStats(u, 'depth_cm', 'depth_rep_cm'); }
function velocityStats(u){ return pointStats(u, 'velocity_ms', 'velocity_rep_ms'); }

/* ---------- 河床材料の割合（7区分） ---------- */
function substratePct(u){
  const o = u && u.substrate_pct;
  return (o && typeof o === 'object') ? o : {};
}
function substratePctSum(u){
  const p = substratePct(u);
  return OPT.substrate.reduce((a,k)=>{ const v=numOf(p[k]); return a + (v===''?0:v); }, 0);
}
/* 割合の多い順。いちばん多い区分と次に多い区分を出すのに使う */
function substrateRank(u){
  const p = substratePct(u);
  return OPT.substrate
    .map(k=>({name:k, pct: numOf(p[k])===''?0:numOf(p[k])}))
    .filter(x=>x.pct>0)
    .sort((a,b)=>b.pct-a.pct);
}
/* 割合の合計。100%からずれていたら、打つたびに赤字で知らせる（保存は止めない）。
   空欄は数えない（空欄と0は別）。全部空なら「まだ入れていない」なので知らせない。
   3つの画面（物理環境・川の環境・メッシュ）で同じ文言を出すため、ここ1か所で作る */
function substrateSumNote(vals){
  let sum = 0, any = false;
  (vals||[]).forEach(v=>{ const n = numOf(v); if(n==='') return; any = true; sum += n; });
  if(!any) return {sum:0, any:false, state:'none'};
  sum = Math.round(sum*100)/100;          // 33.3+33.3+33.4 のような小数のごみを落とす
  // ちょうど 100 のときだけ正常。99.6 や 100.4 も「100%でない」ので知らせる
  const state = sum === 100 ? 'ok' : (sum > 100 ? 'over' : 'under');
  return {sum, any:true, state};
}
function substrateSumText(note){
  if(note.state==='none') return '合計100%が目安です（合わなくても保存できます）。';
  // 判定に使った値をそのまま出す（丸めると「100.0% なのに足りません」が起きる）
  const s = 'いまの合計 ' + String(note.sum) + '%';
  if(note.state==='ok') return s;
  return s + '　100%' + (note.state==='over' ? 'を超えています' : 'に足りません')
    + '（このままでも保存できます）';
}
function substrateSumClass(note){
  return (note.state==='over' || note.state==='under') ? 'tiny pctwarn' : 'tiny muted';
}
/* 合計の行。prefix は入力欄の id の頭（evp / sp / mxp） */
function substrateSumHtml(prefix, vals){
  const note = substrateSumNote(vals);
  return `<div id="${prefix}_sum" class="${substrateSumClass(note)}" style="margin-top:6px">${esc(substrateSumText(note))}</div>`;
}
/* 画面の入力欄（#prefix_1〜7）を読み直して、合計の行だけ書き替える（画面は作り直さない） */
function substrateSumVals(prefix){
  return OPT.substrate.map(k=>{ const el = $('#'+prefix+'_'+SUBSTRATE_NO[k]); return el ? el.value : ''; });
}
function substrateSumLive(prefix){
  const el = $('#'+prefix+'_sum'); if(!el) return;
  const note = substrateSumNote(substrateSumVals(prefix));
  el.className = substrateSumClass(note);
  el.textContent = substrateSumText(note);
}

/* ---------- 岸のカバー。side は 'left' か 'right' ---------- */
function coverList(u, side){
  const a = u && u['cover_'+side];
  return Array.isArray(a) ? a.filter(x=>x && x.type) : [];
}
function coverPctSum(u, side){
  return coverList(u, side).reduce((a,c)=>{ const v=numOf(c.pct); return a+(v===''?0:v); }, 0);
}
/* カバーがあるか。「なし」だけならカバー無し */
function coverPresent(u, side){
  const list = coverList(u, side);
  if(!list.length) return '';
  return list.some(c=>c.type && c.type!=='なし') ? 'あり' : 'なし';
}

/* ---------- ライン（始点・曲がり・終点） ---------- */
function linePt(u, which){
  const la = numOf(u && u['line_'+which+'_lat']);
  const lo = numOf(u && u['line_'+which+'_lon']);
  if(la==='' || lo==='') return null;
  const pt = [la, lo];
  return validPt(pt) ? pt : null;
}
/* 途中の曲がり。川の形に沿わせるために置く */
function lineVias(u){
  return ((u && u.line_vias) || []).map(v=>{
    const la = numOf(v && v.lat), lo = numOf(v && v.lon);
    if(la==='' || lo==='') return null;
    const pt = [la, lo];
    return validPt(pt) ? pt : null;
  }).filter(Boolean);
}
/* 始点 → 曲がり… → 終点。終点がまだなら、そこまでの形を返す */
function linePath(u){
  const a = linePt(u,'start');
  if(!a) return [];
  const b = linePt(u,'end');
  return [a].concat(lineVias(u), b ? [b] : []);
}
/* 始点から終点までの直線。曲がりを置いても、この値は変わらない */
function lineStraight(u){
  const a = linePt(u,'start'), b = linePt(u,'end');
  return (a && b) ? distMeters(a, b) : '';
}
/* 区間の長さ。曲がりを置いてあれば、その折れ線に沿って測る。
   歩いた向きは距離に関係しない */
function lineDist(u){
  const b = linePt(u,'end');
  if(!b) return '';
  const path = linePath(u);
  return path.length >= 2 ? pathLength(path) : '';
}
/* 使う長さの決め方。手入力 ＞ 押さえた始終点 ＞ 軌跡の直線 ＞ 軌跡の総延長。
   1つも測っていなければ 0 ではなく空欄にする。
   0 にすると「調べたが0m」が書き出しに出てしまう */
function unitLengths(u){
  const track = ((u&&u.track)||[]).filter(validPt);
  const has = track.length >= 2;
  const trackLen = has ? pathLength(track) : '';
  const straight = has ? distMeters(track[0], track[track.length-1]) : '';
  const manual = numOf(u && u.length_m_manual);
  const line = lineDist(u);
  const used = manual!=='' ? manual
             : (line!=='' ? line
             : (straight!=='' && straight>0 ? straight
             : (trackLen!=='' ? trackLen : '')));
  return {track:trackLen, straight, line, manual, used};
}
function unitAreas(u){
  const L = unitLengths(u).used;
  const w = numOf(u && u.width_m);
  const calc = (w==='' || L==='' || !isFinite(L)) ? '' : L * w;
  const manual = numOf(u && u.area_m2_manual);
  const used = manual!=='' ? manual : calc;
  return {calc, manual, used};
}

/* ---------- メッシュ ----------
   四隅を押さえて、縦と横の間隔（m）からマスを作る。
   マスの位置は四隅から計算で出す（1マスずつGPSを取ると、誤差で格子から外れる）。
   四隅の順番は 上流左岸 → 上流右岸 → 下流右岸 → 下流左岸 */
/* 四隅の形を確かめる。おかしければ理由を返す（正しければ空文字）。
   validPt は isFinite で見るので、数字の文字列も通ってしまう。ここでは本物の数だけ受ける */
function meshCornerError(c){
  if(!Array.isArray(c) || c.length!==4) return '四隅を4つとも押さえてください';
  for(const p of c){
    if(!Array.isArray(p) || p.length!==2) return '四隅の形がおかしいです';
    if(typeof p[0]!=='number' || typeof p[1]!=='number'
       || !isFinite(p[0]) || !isFinite(p[1])) return '四隅に数でないものが入っています';
    if(Math.abs(p[0])>90 || Math.abs(p[1])>180) return '四隅の位置が地球の外にあります';
  }
  const lats = c.map(p=>p[0]), lons = c.map(p=>p[1]);
  const span = Math.max(Math.max.apply(null,lats)-Math.min.apply(null,lats),
                        Math.max.apply(null,lons)-Math.min.apply(null,lons));
  // ここが広すぎるときは、押し間違いか、日付変更線をまたいでいる。どちらも受けない
  if(span > MESH_MAX_SPAN_DEG) return '四隅が離れすぎています。押し間違いかもしれません';
  // 辺の長さ。同じ点を2回押した・一直線に並んだ、を弾く
  for(let i=0;i<4;i++){
    const d = distMeters(c[i], c[(i+1)%4]);
    if(!(d >= MESH_MIN_EDGE_M)) return '四隅のうち2つが近すぎます（同じ場所を押していませんか）';
  }
  // 平らな面として見たときの向き。4つとも同じ向きに曲がっていれば、
  // ねじれても凹んでもいない（＝ふつうの四角）
  const x = c.map(p=>p[1]*Math.cos(c[0][0]*Math.PI/180)), y = c.map(p=>p[0]);
  let plus=0, minus=0, area=0;
  for(let i=0;i<4;i++){
    const a=i, b=(i+1)%4, d=(i+2)%4;
    const cr = (x[b]-x[a])*(y[d]-y[b]) - (y[b]-y[a])*(x[d]-x[b]);
    if(cr > 0) plus++; else if(cr < 0) minus++;
    area += x[a]*y[b] - x[b]*y[a];
  }
  if(plus && minus) return '四隅がねじれています。押した順番をご確認ください';
  if(Math.abs(area)/2 < 1e-12) return '四隅が一直線に並んでいます';
  return '';
}
function meshCorners(u){
  const c = u && u.mesh_corners;
  return meshCornerError(c) ? null : c;
}
/* 縦の長さ（上流の辺の中点から、下流の辺の中点まで）。
   左岸側と右岸側で長さが違うので、真ん中で測る */
function meshLength(u){
  const c = meshCorners(u); if(!c) return '';
  const up = [(c[0][0]+c[1][0])/2, (c[0][1]+c[1][1])/2];
  const dn = [(c[3][0]+c[2][0])/2, (c[3][1]+c[2][1])/2];
  return distMeters(up, dn);
}
/* 横の幅（上流の辺と下流の辺の平均） */
function meshWidth(u){
  const c = meshCorners(u); if(!c) return '';
  return (distMeters(c[0], c[1]) + distMeters(c[3], c[2])) / 2;
}
/* 縦に何行できるか。間隔で割って、1行未満なら1行 */
function meshRowsOf(u){
  const manual = countOf(u && u.mesh_rows);
  if(manual!==null && manual!=='' && manual>0) return manual;
  const L = meshLength(u), gap = numOf(u && u.mesh_row_m);
  if(L==='' || gap==='' || !(gap>0)) return 0;
  return Math.max(1, Math.round(L/gap));
}
/* 横に何列できるか。幅を間隔で割って丸めるので、全マスが同じ幅に少しずつ伸び縮みする
   （端に半端なマスを作らない。指定と多少ずれるのは承知のうえ） */
function meshColsOf(u){
  const W = meshWidth(u), gap = numOf(u && u.mesh_col_m);
  if(W==='' || gap==='' || !(gap>0)) return 0;
  return Math.max(1, Math.round(W/gap));
}
/* 四隅の中を、行と列で分けたときのマスの中心。
   4つの角を「上下」「左右」で混ぜる（双線形内挿）。
   狭い範囲なので、緯度経度をそのまま混ぜてよい */
function meshCellCenter(c, rows, cols, row, col){
  const u = (col + 0.5) / cols;         // 左岸から右岸へ
  const v = (row + 0.5) / rows;         // 上流から下流へ
  const up = [c[0][0] + (c[1][0]-c[0][0])*u, c[0][1] + (c[1][1]-c[0][1])*u];
  const dn = [c[3][0] + (c[2][0]-c[3][0])*u, c[3][1] + (c[2][1]-c[3][1])*u];
  return [up[0] + (dn[0]-up[0])*v, up[1] + (dn[1]-up[1])*v];
}
/* 1マスの四隅（地図に描くため） */
function meshCellPoly(c, rows, cols, row, col){
  const at = (uu,vv)=>{
    const up = [c[0][0] + (c[1][0]-c[0][0])*uu, c[0][1] + (c[1][1]-c[0][1])*uu];
    const dn = [c[3][0] + (c[2][0]-c[3][0])*uu, c[3][1] + (c[2][1]-c[3][1])*uu];
    return [up[0] + (dn[0]-up[0])*vv, up[1] + (dn[1]-up[1])*vv];
  };
  const u0=col/cols, u1=(col+1)/cols, v0=row/rows, v1=(row+1)/rows;
  return [at(u0,v0), at(u1,v0), at(u1,v1), at(u0,v1)];
}
/* 格子の見積り。決める前に「何マスになるか」を見せるためのもの。
   上限を超えていても、超えた数のまま返す */
function meshPlan(u){
  const c = meshCorners(u);
  if(!c) return null;
  const rows = meshRowsOf(u), cols = meshColsOf(u);
  if(!(rows>0) || !(cols>0)) return null;
  return {corners:c, rows, cols, n: rows*cols, length: meshLength(u), width: meshWidth(u)};
}
/* 実際に使う格子。上限を超えていたら作らない。
   保存のときだけ止めていると、壊れた記録で画面が固まる */
function meshGeom(u){
  const g = meshPlan(u);
  if(!g) return null;
  if(!Number.isInteger(g.rows) || !Number.isInteger(g.cols)) return null;
  if(g.n > MESH_MAX_CELLS) return null;
  return g;
}
/* マスの位置。格子が決まっていなければ空 */
function meshCellPos(u, row, col){
  const g = meshGeom(u);
  if(!g || row<0 || col<0 || row>=g.rows || col>=g.cols) return null;
  return meshCellCenter(g.corners, g.rows, g.cols, row, col);
}
function meshCellsOf(unitUuid){ return DB.meshCellsOf(unitUuid); }
/* 格子には版がある。四隅や細かさを変えると、同じ「3行2列」でも
   川の別の場所を指すことになる。版を持たないと、古いマスが
   新しい格子のマスとして表示され、位置と集計が静かに壊れる */
function meshGridId(u){ return String((u && u.mesh_grid_id) || ''); }
/* その格子の定義を、文字にしたもの。同じなら版を変えない */
function meshGridSig(u){
  const c = (u && u.mesh_corners) || [];
  return JSON.stringify([c, numOf(u && u.mesh_row_m), numOf(u && u.mesh_col_m)]);
}
function meshIsCurrent(u, cell){
  return String((cell && cell.grid_id) || '') === meshGridId(u);
}
/* いまの格子のマスだけ */
function meshCurrentCells(u, cells){
  return (cells || meshCellsOf(u.uuid)).filter(c=>meshIsCurrent(u, c));
}
/* 前の格子で入れたマス。記録としては残すが、一覧や集計には混ぜない */
function meshOldCells(u, cells){
  return (cells || meshCellsOf(u.uuid)).filter(c=>!meshIsCurrent(u, c));
}
/* 入力済みのマスを、行×列で引けるようにする */
function meshCellMap(cells){
  const m = {};
  (cells||[]).forEach(x=>{ m[x.row+'_'+x.col] = x; });
  return m;
}
/* マスから水深・流速の最小・最大・代表を出す。0を落とさない */
function meshStats(cells, field, manual){
  const v = nums((cells||[]).map(x=>x[field]));
  const man = numOf(manual);
  if(!v.length) return {n:0, min:'', max:'', avg:'', manual:man, rep:man};
  const avg = v.reduce((a,b)=>a+b, 0)/v.length;
  return {n:v.length, min:Math.min.apply(null,v), max:Math.max.apply(null,v),
          avg, manual:man, rep: man!=='' ? man : avg};
}
/* 書き出しの控えがあればそこから、無ければ保存から読む */
function snapCells(u, snap){
  if(snap && Array.isArray(snap.mc)) return snap.mc.filter(x=>x.unit_uuid===u.uuid);
  return meshCellsOf(u.uuid);
}
/* その記録の水深・流速。メッシュならマスから、それ以外は測点から。
   どちらも「手で入れた代表値があればそちらを使う」は同じ */
function unitDepth(u, snap){
  if(!isMesh(u)) return depthStats(u);
  return meshStats(meshCurrentCells(u, snapCells(u, snap)), 'depth_cm', u.depth_rep_cm);
}
function unitVelocity(u, snap){
  if(!isMesh(u)) return velocityStats(u);
  return meshStats(meshCurrentCells(u, snapCells(u, snap)), 'velocity_ms', u.velocity_rep_ms);
}

/* ---------- 地図の色分け ---------- */
const ENV_COLOR_BY = ['なし','環境区分','河床材料','礫の状況','流速','水深'];
function envColorBy(){ return prefs().env_color_by || 'なし'; }
function envSetColorBy(v){ if(!envFlushOk()) return; prefSet('env_color_by', v); render(); }
/* 区分ごとの色。数が多くないので、見分けやすい色を並べる */
const ENV_CAT_COLORS = ['#4aa3ff','#3fb950','#f0883e','#d29922','#a371f7',
                        '#f778ba','#56d4dd','#8b949e'];
function envCatColor(list, v){
  const i = list.indexOf(v);
  return i < 0 ? '#8b949e' : ENV_CAT_COLORS[i % ENV_CAT_COLORS.length];
}
/* 数の大小を色にする。青（小）→緑→黄→赤（大） */
function envRampColor(v, lo, hi){
  const n = numOf(v);
  if(n==='') return '#8b949e';          // 未記入だけを灰色にする
  // 値が1つだけ、または全部同じときは幅が無い。
  // ここで灰色を返すと、入れてあるのに「未記入」に見える
  if(!(hi > lo)) return 'rgb(63,185,80)';
  const t = Math.max(0, Math.min(1, (n - lo) / (hi - lo)));
  const stops = [[74,163,255],[63,185,80],[210,153,34],[240,136,62],[248,81,73]];
  const x = t * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  const c = [0,1,2].map(k => Math.round(stops[i][k] + (stops[i+1][k]-stops[i][k]) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
/* いまの基準で、その記録の色を決める。
   代表値は測点やマスから出したものを使う（手入力だけを見ると、
   測点を入れた記録が未記入の色になる） */
function envColorOf(u, range){
  const by = envColorBy();
  if(by === '環境区分') return envCatColor(OPT.habitat, habitatList(u.habitat_type)[0]);
  if(by === '河床材料') return envCatColor(OPT.substrate, u.substrate1);
  if(by === '礫の状況') return envCatColor(OPT.gravel, u.gravel_condition);
  if(by === '流速')     return envRampColor(unitVelocity(u).rep, range.vLo, range.vHi);
  if(by === '水深')     return envRampColor(unitDepth(u).rep, range.dLo, range.dHi);
  return null;             // 「なし」なら、これまでどおり河川形態で色を変える
}
/* 色の幅は、いま出している記録から作る */
function envColorRange(svUuid){
  const list = DB.unitsOf(svUuid);
  const v = nums(list.map(x=>unitVelocity(x).rep));
  const d = nums(list.map(x=>unitDepth(x).rep));
  return {vLo: v.length?Math.min.apply(null,v):0, vHi: v.length?Math.max.apply(null,v):0,
          dLo: d.length?Math.min.apply(null,d):0, dHi: d.length?Math.max.apply(null,d):0,
          vN: v.length, dN: d.length};
}
/* 何色が何を指すか。地図の下に出す */
function envLegendHtml(svUuid){
  const by = envColorBy();
  if(by === 'なし') return '';
  const wrap = (inner)=>`<div id="envLegend">${inner}</div>`;
  const chip = (col, label)=>`<span style="display:inline-flex;align-items:center;
    gap:4px;margin:0 8px 4px 0"><span style="width:12px;height:12px;border-radius:6px;
    background:${col};display:inline-block"></span>${esc(label)}</span>`;
  if(by === '流速' || by === '水深'){
    const r = envColorRange(svUuid);
    const lo = by==='流速' ? r.vLo : r.dLo, hi = by==='流速' ? r.vHi : r.dHi;
    const n  = by==='流速' ? r.vN : r.dN;
    const unit = by==='流速' ? ' m/s' : ' cm';
    const dg   = by==='流速' ? 2 : 0;
    if(!(hi > lo)){
      const why = n===0 ? 'まだ入っていないので、色は分かれません'
                : n===1 ? '値が1つだけなので、色は分かれません'
                        : 'どれも同じ値なので、色は分かれません';
      // 入っている分は同じ色で出る。その色も凡例に出さないと、
      // 地図の色が何を指すのか分からない
      const same = n===0 ? '' : chip(envRampColor(lo, lo, hi), fmtNum(lo, dg)+unit);
      return wrap(`<div class="tiny muted">${esc(by)}：${why}　${same}`
        + chip('#8b949e','未記入') + '</div>');
    }
    return wrap(`<div class="tiny muted">${esc(by)}　`
      + [0,0.25,0.5,0.75,1].map(t=>{
          const v = lo + (hi-lo)*t;
          return chip(envRampColor(v, lo, hi), fmtNum(v, dg)+unit);
        }).join('') + '</div>');
  }
  const list = by==='環境区分' ? OPT.habitat : (by==='河床材料' ? OPT.substrate : OPT.gravel);
  return wrap(`<div class="tiny muted">${esc(by)}　`
    + list.map(o=>chip(envCatColor(list, o), o)).join('')
    + chip('#8b949e','未記入') + '</div>');
}

/* ============================================================
   物理環境の記録（地図の上で、その場で入れる）
   点を置いた時点で記録ができ、打った内容は少し待ってから自動で保存される。
   保存ボタンだけに頼ると、打ったのに書き出しに出ない、が起きる。
   ============================================================ */
function fixCoord(v){ const n=numOf(v); return n==='' ? '' : n.toFixed(6); }
function timeValue(d){ d=d||new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
/* 現在地を1回だけ取る。画面が変わっていたら書き込まない */
function getFixOnce(cb){
  if(!navigator.geolocation){ cb(null); return; }
  const gen = screenGen();
  navigator.geolocation.getCurrentPosition(p=>{
    if(screenStale(gen)) return;
    lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
    cb({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy});
  }, ()=>{ if(!screenStale(gen)) cb(null); },
     {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
}
function gpsHint(){
  const f = freshFix(20000);
  if(!f) return '位置：まだ取れていません（空の見えるところでお待ちください）';
  if(f.acc > GPS_MAX_ACC) return `位置：±${Math.round(f.acc)}m（粗いので位置は付けません）`;
  return `位置：±${Math.round(f.acc)}m で受かっています`;
}

/* ---------- 環境区分（いくつでも選べる） ---------- */
function pickHabMulti(btn){
  const all = btn.parentElement.querySelectorAll('button');
  if(btn.textContent === 'なし'){
    all.forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }else{
    btn.classList.toggle('on');
    all.forEach(b=>{ if(b.textContent==='なし') b.classList.remove('on'); });
    if(!Array.from(all).some(b=>b.classList.contains('on'))){
      all.forEach(b=>{ if(b.textContent==='なし') b.classList.add('on'); });
    }
  }
}
/* いま押されている環境区分（正式な名前で）。順番は選択肢の並びにそろえる */
function habMultiVal(){
  const on = $$(`[data-segmulti="envhab"] button.on`)
    .map(b=>b.textContent).filter(x=>x!=='なし').map(habitatLong);
  return OPT.habitat.filter(h=>on.indexOf(h)>=0).join('・');
}

/* ---------- 記録のひな形 ---------- */
// 初期値をここ1か所に決める。地図からもメッシュからも作るので、散らかさない
function newUnit(sv, method, reachUuid){
  const kind = method==='ライン' ? 'L' : (method==='メッシュ' ? 'M' : 'P');
  return {
    uuid: uuid(), survey_uuid: sv,
    reach_uuid: reachUuid!==undefined ? reachUuid : ((activeReach(sv)||{}).uuid || ''),
    name: envAutoName(sv, kind),
    env_method: method || '点',
    habitat_type:'', started_at: nowISO(), ended_at:'',
    survey_time_start: timeValue(), survey_time_end:'',
    // 点のとき
    latitude:'', longitude:'', gps_accuracy:'', position_source:'',
    // ラインのとき
    line_start_lat:'', line_start_lon:'', line_start_acc:'',
    line_end_lat:'', line_end_lon:'', line_end_acc:'',
    line_vias:[], line_direction:'上流→下流', chained_from:'',
    // 長さ・面積
    length_m_manual:'', width_m:'', area_m2_manual:'', track:[],
    // 代表値と測点
    depth_rep_cm:'', velocity_rep_ms:'', env_points:[],
    // 河床材料・カバー
    substrate1:'', substrate2:'', substrate_pct:{}, gravel_condition:'',
    cover_left:[], cover_right:[], cover_left_length_m:'', cover_right_length_m:'',
    water_temp_c:'',
    // メッシュのとき
    mesh_corners:[], mesh_row_m:'', mesh_col_m:'', mesh_grid_id:'',
    memo:'', photos:[],
  };
}

/* ---------- ライン（始まり・曲がり・終わり） ---------- */
/* つぎに足すもの。LS＝ラインの始まり／LE＝終わり／V＝曲がり */
let ENV_NEXT = {kind:'P', auto:false, line:'', survey:''};
function envKindWord(k){
  return k==='S' ? '産卵床' : k==='P' ? 'ポイント' : k==='LS' ? 'ラインの始まり'
       : k==='LE' ? 'ラインの終わり' : '曲がり';
}
function envUseSurvey(svUuid){
  if(ENV_NEXT.survey !== svUuid) ENV_NEXT = {kind:'P', auto:false, line:'', survey:svUuid};
}
function envSetKind(k){
  // 地図の上の印だけを書き替えるときは画面を作り直さないが、
  // 作り直しに落ちることもあるので、先に打ちかけを書いておく
  if(!envFlushOk()) return;
  const sv = ENV_NEXT.survey;
  // 同じものをもう一度押したら、入れ替えをやめる（同じものを続けて足したいとき）
  if(ENV_NEXT.kind === k) ENV_NEXT = {kind:k, auto:false, line:ENV_NEXT.line, survey:sv};
  // 産卵床は続けて置くもの。ラインの相手も持ち越さない
  else if(k === 'S')      ENV_NEXT = {kind:'S', auto:false, line:'', survey:sv};
  else if(k === 'P')      ENV_NEXT = {kind:'P', auto:false, line:'', survey:sv};
  // 曲がりは続けて置くもの。交互には入れない
  else if(k === 'V')      ENV_NEXT = {kind:'V', auto:false, line:ENV_NEXT.line, survey:sv};
  else                    ENV_NEXT = {kind:k, auto:true, line:ENV_NEXT.line, survey:sv};
  // 地図の上の印と案内だけを書き替える。画面ごと作り直すと地図がちらつく
  if(!envSyncNextUI()) render();
}
/* 足したあとに、つぎを決める */
function envAdvance(added, lineUuid){
  const sv = ENV_NEXT.survey;
  if(added === 'LS'){
    ENV_NEXT = {kind: ENV_NEXT.auto ? 'LE' : ENV_NEXT.kind, auto:ENV_NEXT.auto,
                line: lineUuid || '', survey:sv};
  }else if(added === 'LE'){
    ENV_NEXT = {kind: ENV_NEXT.auto ? 'LS' : ENV_NEXT.kind, auto:ENV_NEXT.auto,
                line:'', survey:sv};
  }
}
/* つなげる：ラインを閉じたら、その場所を次のラインの始まりにする。
   縦断で歩くとき、境目を1回たたくだけで次の区間が始まる */
function envChain(){ const v = prefs().env_chain; return v===undefined ? true : !!v; }
function envSetChain(on){
  prefSet('env_chain', !!on);
  toast(on ? 'ラインをつなげます（閉じた場所が、つぎの始まりになります）'
           : 'ラインをつなげません');
  if(!envSyncNextUI()) render();
}
/* 「選んだ」のと「置いた」のと、どちらが後かを覚える。
   つなげたときは、閉じたラインが選ばれたまま次のラインが始まるので、
   選ばれているほうを先に見ると、曲がりが前のラインに付く */
let ENV_SEQ = 0, ENV_SEL_SEQ = 0, ENV_PLACE_SEQ = 0;
function envMarkSelected(){ ENV_SEL_SEQ = ++ENV_SEQ; }
function envMarkPlaced(){ ENV_PLACE_SEQ = ++ENV_SEQ; }

/* いま記録を作るなら、どの区間にぶら下がるか */
function envReachOf(svUuid){ return (activeReach(svUuid)||{}).uuid || ''; }
/* 同じ区間の記録か。つなぎ先を同じ区間に限らないと、
   別の区間で押した「ラインの終わり」が、前の区間のラインを閉じてしまう */
function sameReach(u, reachUuid){ return (u && (u.reach_uuid||'')) === (reachUuid||''); }

/* LE でつなぐ相手を決める。
   末尾を機械的に閉じると、L1 を選んでいるのに L2 が閉じる */
function envLineTarget(svUuid){
  const reach = envReachOf(svUuid);
  const half = x => x && isLine(x) && linePt(x,'start') && !linePt(x,'end') && sameReach(x, reach);
  // 1) いま選んでいる記録。人が選んだものを、いちばん先に見る
  const sel = ENV_SEL ? DB.liveUnit(ENV_SEL) : null;
  if(half(sel) && sel.survey_uuid===svUuid) return sel;
  // 2) 直前に置いた始まり
  if(ENV_NEXT.line){
    const x = DB.liveUnit(ENV_NEXT.line);
    if(half(x) && x.survey_uuid===svUuid) return x;
  }
  // 3) 終わっていないものがちょうど1本ならそれ。2本以上なら決めない（当て推量で閉じない）
  const list = DB.unitsOf(svUuid).filter(half);
  return list.length===1 ? list[0] : null;
}
/* 終わっていないライン（案内に出す） */
function envPendingLine(svUuid){
  const reach = envReachOf(svUuid);
  const list = DB.unitsOf(svUuid).filter(x=>isLine(x) && linePt(x,'start')
    && !linePt(x,'end') && sameReach(x, reach));
  return list.length ? list[list.length-1] : null;
}
/* 曲がりを足す相手のライン。
   1) 人が選び直した直後なら、その記録
   2) いま引いている途中のライン
   3) 選んでいるライン（終わっていてもよい）
   4) 終わっていないラインがちょうど1本ならそれ
   5) ラインがちょうど1本ならそれ */
function envBendTarget(svUuid){
  const reach = envReachOf(svUuid);
  const isL = x => x && isLine(x) && linePt(x,'start') && sameReach(x, reach);
  const half = x => isL(x) && !linePt(x,'end');
  const mine = x => x && x.survey_uuid===svUuid;
  const sel = ENV_SEL ? DB.liveUnit(ENV_SEL) : null;
  if(ENV_SEL_SEQ > ENV_PLACE_SEQ && isL(sel) && mine(sel)) return sel;
  if(ENV_NEXT.line){
    const x = DB.liveUnit(ENV_NEXT.line);
    if(half(x) && mine(x)) return x;
  }
  if(isL(sel) && mine(sel)) return sel;
  const halves = DB.unitsOf(svUuid).filter(half);
  if(halves.length===1) return halves[0];
  const lines = DB.unitsOf(svUuid).filter(isL);
  return lines.length===1 ? lines[0] : null;
}
/* 曲がりを1つ足す */
function envAddBend(svUuid, la, lo, acc, targetUuid){
  let x;
  if(targetUuid){
    const t = DB.liveUnit(targetUuid);
    x = (t && t.survey_uuid===svUuid && isLine(t) && linePt(t,'start')) ? t : null;
    if(!x){ toast('現在地を取っている間に、曲げる相手のラインが変わったので置いていません'); return null; }
  }else{
    x = envBendTarget(svUuid);
  }
  if(!x){
    toast('どのラインを曲げるか決められません。先にラインを選ぶか、ラインの始まりを置いてください');
    return null;
  }
  const v = {lat: la, lon: lo};
  const a = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);
  if(a!=='') v.acc = a;
  x.line_vias = (x.line_vias||[]).concat([v]);
  if(!DB.put(DB.key.un, x)){
    toast('曲がりを置けませんでした（端末の空き容量をご確認ください）');
    return null;
  }
  ENV_SEL = x.uuid;
  envSetFocus('un');
  envHistPush({type:'曲がり', sv:svUuid, uuid:x.uuid, name:x.name});
  // 曲がりは「置いた」に数えない。数えると、ラインを選んで曲がりを1つ足しただけで、
  // つぎの曲がりが別のライン（引いている途中のもの）へ行ってしまう
  toast(`${x.name||''} に曲がりを置きました（${x.line_vias.length}個目）`);
  return x;
}
function envUndoBend(u){
  if(!envFlushOk()) return false;
  const x = DB.liveUnit(u); if(!x) return false;
  const via = (x.line_vias||[]).slice();
  if(!via.length){ toast('取り消す曲がりがありません'); return false; }
  via.pop();
  x.line_vias = via;
  if(!DB.put(DB.key.un, x)){ toast('取り消せませんでした（端末の空き容量をご確認ください）'); return false; }
  toast(`曲がりを1つ取り消しました（残り ${via.length}個）`);
  return true;
}
function envClearBends(u){
  if(!envFlushOk()) return false;
  const x = DB.liveUnit(u); if(!x) return false;
  const n = (x.line_vias||[]).length;
  if(!n){ toast('消す曲がりがありません'); return false; }
  if(!confirm(`${x.name||''} の曲がり ${n}個をすべて消します。よろしいですか？`)) return false;
  x.line_vias = [];
  if(!DB.put(DB.key.un, x)){ toast('消せませんでした（端末の空き容量をご確認ください）'); return false; }
  toast('曲がりをすべて消しました');
  return true;
}

/* 直前にしたことを控えておき、1つずつ戻せるようにする。
   置き間違いは現場で必ず起きる。アプリを閉じるまでの間だけ覚える */
let ENV_HIST = [];
const ENV_HIST_MAX = 30;
function envHistPush(item){
  if(!item) return;
  // どの区間で行った操作かも覚える。覚えないと、別の区間の操作を取り消してしまう
  item.reach = envReachOf(item.sv) || '';
  ENV_HIST.push(item);
  if(ENV_HIST.length > ENV_HIST_MAX) ENV_HIST.shift();
}
function envHistMine(x, svUuid){
  return !!x && x.sv === svUuid && (x.reach||'') === (envReachOf(svUuid)||'');
}
function envHistClear(svUuid){ ENV_HIST = ENV_HIST.filter(x=>x && x.sv === svUuid); }
function envCanUndo(svUuid){ return ENV_HIST.some(x=>envHistMine(x, svUuid)); }
/* 1つ戻す。戻せたら true */
function envUndo(svUuid){
  if(!envFlushOk()) return false;
  let i = ENV_HIST.length - 1;
  while(i >= 0 && !envHistMine(ENV_HIST[i], svUuid)) i--;
  if(i < 0){ toast('戻せるものがありません'); return false; }
  const h = ENV_HIST[i];
  ENV_HIST.splice(i, 1);

  if(h.type === '産卵床'){
    const x = DB.get(DB.key.rd, h.uuid);
    if(!x || x.deleted_at){ toast('その記録はもうありません'); return true; }
    if(!DB.softDelete(DB.key.rd, h.uuid)){
      toast('戻せませんでした（端末の空き容量をご確認ください）'); return false;
    }
    if(REDD_SEL === h.uuid) REDD_SEL = null;
    if(ENV_FORM === h.uuid){ ENV_FORM=''; ENV_FORM_KIND=''; ENV_DIRTY=false; }
    toast(`${h.name||''} を取り消しました`);
    return true;
  }
  if(h.type === '置いた'){
    if(!DB.liveUnit(h.uuid)){ toast('その記録はもうありません'); return true; }
    if(!DB.softDelete(DB.key.un, h.uuid)){
      toast('戻せませんでした（端末の空き容量をご確認ください）'); return false;
    }
    if(ENV_SEL === h.uuid) ENV_SEL = null;
    if(ENV_FORM === h.uuid){ ENV_FORM=''; ENV_DIRTY=false; }
    if(ENV_NEXT.line === h.uuid){
      ENV_NEXT = {kind:ENV_NEXT.kind, auto:ENV_NEXT.auto, line:'', survey:ENV_NEXT.survey};
    }
    toast(`${h.name||''} を取り消しました`);
    return true;
  }
  if(h.type === '終わり'){
    if(!DB.liveUnit(h.uuid)){ toast('その記録はもうありません'); return true; }
    let all;
    try{ all = DB.loadRaw(DB.key.un); }
    catch(e){ toast('保存された記録を読み取れないため、戻せませんでした'); return false; }
    const t = nowISO();
    all.forEach(x=>{
      if(!x) return;
      if(x.uuid === h.uuid){
        x.line_end_lat=''; x.line_end_lon=''; x.line_end_acc='';
        x.survey_time_end = h.prevTime || '';
        x.ended_at = h.prevEnded || '';
        x.updated_at = t;
      }
      // つなげるで自動的に始まったラインも、一緒に取り消す
      if(h.next && x.uuid === h.next && !x.deleted_at){ x.deleted_at = t; x.updated_at = t; }
    });
    if(!DB.save(DB.key.un, all)){
      toast('戻せませんでした（端末の空き容量をご確認ください）'); return false;
    }
    if(h.next && ENV_SEL === h.next) ENV_SEL = h.uuid;
    ENV_NEXT = {kind:'LE', auto:ENV_NEXT.auto, line:h.uuid, survey:svUuid};
    toast(`${h.name||''} の終わりを取り消しました`);
    return true;
  }
  if(h.type === '曲がり') return envUndoBend(h.uuid);
  if(h.type === '動かした'){
    if(!DB.liveUnit(h.uuid)){ toast('その記録はもうありません'); return true; }
    if(!envMoveTo(h.uuid, h.which, h.prev.lat, h.prev.lon, h.prev.acc, h.prev.src, true)) return false;
    toast(`${h.name||''} の${h.which}を元に戻しました`);
    return true;
  }
  return false;
}

   画面の世代（SCREEN_SEQ）は、地図はそのままで下の入力欄だけを差し替えるときは

   始めたときの持ち主・種類・世代を覚えておき、戻ってきたときに違っていたら捨てる */

/* 入力欄のつなぎ込み。触るたびに、少し待ってから保存する */
function reddItemFormWire(cur){

/* いま画面に入っている値が、おかしくないか。おかしければ理由を返す */
/* 値がおかしくないかを見る。おかしくても保存は止めない（v24）。
   止めると「まだ保存されていない入力」が生まれ、それを守るための控えが要り、
   控えを守るしかけが要り…と積み上がる。現場では
   「入れたのに残っていない」がいちばん困るので、まず残す。
   おかしい値には「要確認」の印を付けて、あとで見直せるようにする。
   測点（水深・流速）も見る。ここを見ないと 水深-10cm がそのまま通る */
function reddOddValues(f, points){
  const odd = rangeCheckAll(Object.keys(REDD_LABEL).map(k=>reddRangeItem(k, f[k])));
  (points||[]).forEach((pt,i)=>{
    rangeCheckAll([[`測点${i+1}の水深`, pt.depth_cm, ENV_RANGE.depth_cm[0], ENV_RANGE.depth_cm[1]],
                   [`測点${i+1}の流速`, pt.velocity_ms, ENV_RANGE.velocity_ms[0], ENV_RANGE.velocity_ms[1]]])
      .forEach(e=>odd.push(e));
  });
  return odd;
}
/* 要確認の理由を付け直して needs_review を出す。
   keep は入力の状況から分かる断り（種類が空・位置が読めない）。
   値の範囲は記録の中身から毎回計算し直す（直せば消える） */
function reddReviewApply(rec, keep){
  rec.review_reasons = (keep||[]).concat(reddOddValues(rec, envPoints(rec)));
  rec.needs_review = reviewManual(rec) || rec.review_reasons.length>0;
  return rec;
}
/* 位置や値の理由（毎回作り直すもの）を除いた、残す断り。
   値の理由は「〜入れてください」、位置の理由は「（前の位置のままにしました）」で終わる */
function reddReviewKeep(rec){
  return reviewReasons(rec).filter(x=>!/入れてください/.test(x) && !x.endsWith(POS_NOTE));
}
/* 画面に出す断り。「保存はした。ただし見直してほしい」と伝える */
function reddShowError(msg){
  const box = $('#rv_err'); if(!box) return;
  box.innerHTML = msg
    ? `<div class="warnbox">${esc(msg)}
        <div class="tiny">この記録は保存してありますが、「要確認」の印を付けました。
          打ち間違いなら直してください。</div></div>`
    : '';
}
/* 産卵床の入力欄を書き戻す。物理環境の saveEnvItem と同じ作り。
   取り出しは記録の画面と同じ collectReddForm()。欄が1か所なので、取り出しも1か所 */
function saveReddItem(u, opt){
  const quiet = !!(opt && opt.quiet);
  const rec = DB.get(DB.key.rd, u);
  if(!rec || rec.deleted_at || !DB.survey(rec.survey_uuid)) return false;
  if(!$('#fReach')) return false;          // その入力欄が画面に出ていない
  const f = collectReddForm();
  envSync();
  // 何も入っていない測点は保存しない
  f.env_points = (SCREENS._env||[]).filter(p=>p.depth_cm!=='' || p.velocity_ms!=='' || p.note);
  f.depth_cm = ''; f.velocity_ms = '';     // 旧形式の値は残さない（測点が正本）
  f.area_m2 = reddAreaNext(f, rec);

  // 差し戻しの断り（種類が空・位置が読めない）は、その欄を触るまで残す。
  // 消してしまうと、メモを直しただけで「位置を確かめて」が消える
  const prev = reviewReasons(rec);
  const notes = [];
  // 記録の種類が空になったら、前のものを残す（種類の無い記録にはしない）
  if(!f.record_targets.length){
    f.record_targets = recordTargets(rec);
    notes.push(TARGET_NOTE);
  }else if(!SCREENS._targetsTouched && prev.indexOf(TARGET_NOTE)>=0){
    notes.push(TARGET_NOTE);
  }
  // 位置が読めない文字なら、前の位置を残す（座標にならないものは入れられない）。
  // そのときは位置の決め方と誤差も前のまま。座標だけ戻して由来を「手入力」にすると、
  // GPSで測った位置が手入力だったことになる
  let acc = SCREENS._acc!=null    ? SCREENS._acc    : (rec.gps_accuracy??'');
  let src = SCREENS._posSrc!=null ? SCREENS._posSrc : (rec.position_source??'');
  const pos = parsePos(f.latitude, f.longitude);
  if(pos.ok){
    f.latitude = pos.lat; f.longitude = pos.lon;      // 文字ではなく数で持つ
    if(pos.empty){ acc = ''; src = ''; }              // 位置が無いなら、由来も誤差も無い
    // 座標の欄を触っていなければ（_posSrc が null）、前の差し戻しの断りは残す
    if(SCREENS._posSrc==null) prev.filter(x=>x.endsWith(POS_NOTE)).forEach(x=>notes.push(x));
  }else{
    f.latitude = rec.latitude; f.longitude = rec.longitude;
    acc = rec.gps_accuracy??''; src = rec.position_source??'';
    notes.push(pos.why + POS_NOTE);
  }
  // おかしい値は、そのまま保存して「要確認」を立てる。
  // 理由は毎回すべて出し直す（直せば消える）。人が付けた印とは別に持つ
  reddReviewApply(f, notes);
  const odd = f.review_reasons;
  // 読み出した写しに書き足す（丸ごと置き換えても、ほかの欄は消えない）
  const next = Object.assign({}, rec, f, {
    gps_accuracy: acc, position_source: src,
    photos: (SCREENS._photos||[]).slice(),
  });
  if(!DB.put(DB.key.rd, next)){ tellSaveFailed(); return false; }
  // 次に置く産卵床へ引き継ぐのは「場の条件」だけ。
  // 魚種は引き継がない。見ていない魚種が入ってしまううえ、
  // 置いた瞬間から「まだ入れていない」の印が消えて、入れ残しに気づけなくなる
  // 魚種と、その判断根拠は引き継がない。
  // 魚種が空なのに「親魚確認」だけ入った、ちぐはぐな記録ができてしまう
  SCREENS._carry = { survey_uuid:next.survey_uuid, river_form:f.river_form,
    substrate_main:f.substrate_main, substrate_sub:f.substrate_sub,
    embeddedness:f.embeddedness, cover:f.cover };
  reddShowError(odd.join(' ／ '));
  ENV_DIRTY = false;
  if(quiet){
    // 打っている最中なので、画面は作り直さない。地図と一覧だけ追いつかせる
    reddDrawAll(next.survey_uuid);
    reddChipSync(next.survey_uuid);
    const mark = $('#rv_saved');
    if(mark) mark.textContent = '保存しました（' + timeValue() + '）';
    return true;
  }
  toast('保存しました');
  render();
  return true;
}
function reddItemDelete(u){
  const rec = DB.get(DB.key.rd, u); if(!rec) return;
  if(!confirm(`${reddName(rec)} を消します。よろしいですか？`)) return;
  // 消す前に、打ちかけを先に書く。書けないなら消さない
  if(!envFlushOk()) return;
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  if(DB.softDelete(DB.key.rd, u)){
    if(REDD_SEL === u) REDD_SEL = null;
    ENV_FORM = ''; ENV_FORM_KIND = ''; ENV_DIRTY = false;
    toast('ゴミ箱へ入れました'); render();
  }
}

/* いま画面に入っている値が、おかしくないか。おかしければ理由を返す */
function envItemError(){
  const sv = sel => { const el=$(sel); return el ? String(el.value).trim() : ''; };
  return rangeCheck([['水深', sv('#ev_d'), 0, 2000], ['流速', sv('#ev_v'), 0, 10],
                     ['水温', sv('#ev_wt'), -5, 45],
                     ['区間長', sv('#ev_len'), 0, 100000], ['川幅', sv('#ev_wid'), 0, 2000]]
    .concat(OPT.substrate.map(k=>[k+'の割合', sv('#evp_'+SUBSTRATE_NO[k]), 0, 100]))
    .concat(['left','right'].map(side=>{
      const label = side==='left' ? '左岸' : '右岸';
      return [label+'のカバー長', sv('#evc_'+side+'_len'), 0, 100000];
    }))
    .concat(['left','right'].reduce((a,side)=>{
      const label = side==='left' ? '左岸' : '右岸';
      [0,1,2].forEach(i=>a.push([label+'のカバーの割合', sv('#evc_'+side+'_'+i), 0, 100]));
      return a;
    }, [])));
}
/* おかしい値の理由を、画面に出しつづける（消えるお知らせでは見落とす） */
function envShowError(err){
  const box = $('#ev_err'); if(!box) return;
  box.innerHTML = err
    ? `<div class="warnbox">${esc(err)}<br>直すまで、この記録は保存されません。
        打った内容は消えません。</div>`
    : '';
}
function envAutoSave(u){
  ENV_DIRTY = true;
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  ENV_AUTO_TIMER = setTimeout(()=>{ ENV_AUTO_TIMER = null; envAutoSaveNow(u); }, ENV_AUTO_MS);
}
/* すぐ保存する。記録を選び替える前や、画面を離れる前に使う */
function envAutoSaveNow(u){
  if(!u) return false;
  // 画面に出ている入力欄の持ち主だけに書く。
  // 選び替えた直後は ENV_SEL が先に変わるので、それで判断すると別の記録へ書いてしまう
  if(u !== ENV_FORM) return false;
  // 触っていない入力欄は書き戻さない
  if(!ENV_DIRTY) return false;
  // 産卵床の入力欄なら、そちらへ書く。
  // ここで振り分けないと、産卵床の入力が黙って保存されない
  if(ENV_FORM_KIND === 'rd'){
    if(!$('#fReach')) return false;         // その入力欄が画面に出ていない
    // 産卵床は必ず保存する（おかしい値は「要確認」で分かるようにしてある）
    return saveReddItem(u, {quiet:true});
  }
  if(!$('#ev_d')) return false;
  const err = envItemError();
  envShowError(err);
  if(err) return false;                     // おかしい値があるうちは保存しない
  return saveEnvItem(u, {quiet:true});
}
/* いま自動保存を待っている分があれば、先に書いてしまう。
   返り値は「先へ進んでよいか」。
   触っていない・書くものが無い → true（進んでよい）
   おかしい値がある・保存に失敗した → false（進むと打った内容が消える） */
function envFlush(){
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  // 付けられなかった写真があれば、もう一度試す。付くまでは先へ進めない
  if(ENV_PHOTO_PENDING && !envPhotoTouch(ENV_PHOTO_PENDING)) return false;
  if(!ENV_FORM || !ENV_DIRTY) return true;
  return envAutoSaveNow(ENV_FORM);
}
/* 書けなかったときは、そこで止めて理由を伝える。
   止めずに画面を作り直すと、「打った内容は消えません」と出したそばから消えてしまう */
function envFlushOk(){
  if(envFlush()) return true;
  toast('打った内容をまだ保存できていません。赤い断りを直すか、その欄を空にしてください');
  return false;
}
/* 写真だけを、待たずにその場で保存する。
   600ミリ秒待つ形だと、撮った直後にアプリを閉じたとき記録に付かない。
   owner は「この写真が誰のものか」。縮小に時間がかかっている間に別の記録へ移ると、
   そちらへ写真が混ざるので、始めたときの相手と同じでなければ書かない */
function envSavePhotosNow(owner){
  const target = owner || ENV_FORM;
  if(!target || target !== ENV_FORM) return false;
  // 産卵床の入力欄なら産卵床へ、物理環境なら物理環境へ書く
  const isRedd = ENV_FORM_KIND === 'rd';
  const u = isRedd ? DB.get(DB.key.rd, target) : DB.liveUnit(target);
  if(!u || u.deleted_at) return false;
  const now = (SCREENS._photos||[]).slice();
  const before = Array.isArray(u.photos) ? u.photos : [];
  // すでに保存されているものと同じなら、書かなくてよい。
  // ここで必ず書きに行くと、端末がいっぱいのときに
  // 「足した写真を外しても先へ進めない」行き止まりになる
  if(before.length === now.length
     && before.every((p,i)=> p && now[i] && p.id === now[i].id)) return true;
  u.photos = now;
  return !!DB.put(isRedd ? DB.key.rd : DB.key.un, u);
}

function saveEnvItem(u, opt){
  const quiet = !!(opt && opt.quiet);
  const rec = DB.liveUnit(u); if(!rec) return false;
  const err = envItemError();
  if(err){ envShowError(err); if(!quiet) toast(err); return false; }

  rec.habitat_type     = habMultiVal();
  rec.substrate1       = segVal('envsub');
  rec.gravel_condition = segVal('envgr');
  rec.depth_rep_cm     = numVal('#ev_d');
  rec.velocity_rep_ms  = numVal('#ev_v');
  rec.water_temp_c     = numVal('#ev_wt');
  rec.memo             = (($('#ev_memo')||{}).value||'').trim();
  rec.photos           = (SCREENS._photos||[]).slice();
  // 時刻の欄は、出ている画面から呼ばれたときだけ書く（消さないため）
  if($('#ev_t1')) rec.survey_time_start = (($('#ev_t1')||{}).value||'').trim();
  if($('#ev_t2')) rec.survey_time_end   = (($('#ev_t2')||{}).value||'').trim();
  if(isLine(rec)){
    const dir = segVal('envdir');
    if(dir) rec.line_direction = dir;
    rec.length_m_manual = numVal('#ev_len');
    rec.width_m         = numVal('#ev_wid');
  }

  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#evp_'+SUBSTRATE_NO[k]); });
  rec.substrate_pct = pct;
  // 割合を入れてあれば、多い順に代表と2番目を自動で入れる。
  // 先に空にしておく。残したままだと、割合を全部消しても古い2番目が書き出しに出る
  rec.substrate2 = '';
  const rank = substrateRank({substrate_pct:pct});
  if(rank.length){
    rec.substrate1 = rank[0].name;
    rec.substrate2 = rank[1] ? rank[1].name : '';
  }
  ['left','right'].forEach(side=>{
    const arr = [];
    [0,1,2].forEach(i=>{
      const type = (($('#evc_'+side+'_'+i+'_t')||{}).value||'').trim();
      const p = numVal('#evc_'+side+'_'+i);
      if(type) arr.push({type, pct:p});
    });
    rec['cover_'+side] = arr;
    rec['cover_'+side+'_length_m'] = numVal('#evc_'+side+'_len');
  });

  // 丸ごと置き換える。併合だとカバーを減らしたときに古い枠が残る
  if(!DB.put(DB.key.un, rec)) return false;
  envShowError('');
  ENV_DIRTY = false;
  if(quiet){
    // 打っている最中なので、画面は作り直さない。地図の色だけ追いつかせる
    envDrawAll(rec.survey_uuid);
    const mark = $('#ev_saved');
    if(mark) mark.textContent = '保存しました（' + timeValue() + '）';
    return true;
  }
  toast('保存しました');
  render();
  return true;
}

/* ---------- 地図の下に並べるもの ----------
   産卵床（S）と物理環境（P・L・M）は、2段に分けて「いつも両方」出す。
   混ぜて1列にすると、産卵床が100件を超えたときに物理環境が埋もれて探せない。
   切り替えのボタンは置かない。置くと、産卵床を入れている最中に
   ポイントを置いても出てこない（実際に不便だった）。
   入力欄は画面に1つだけなので、いま入れているのがどちらかだけを覚えておく。
   置いた・選んだときに、そのつど自動で切り替わる */
let ENV_FOCUS = 'rd';
function envFocus(){ return ENV_FOCUS === 'un' ? 'un' : 'rd'; }
function envSetFocus(k){ ENV_FOCUS = (k === 'un') ? 'un' : 'rd'; }

/* ---------- 地図（物理環境） ---------- */
let ENVMAP = null, ENVLAYER = [];
/* 見ていた場所を、調査ごとに覚える（開き直すたびに全体へ戻らないように） */
let ENV_VIEW = {}, ENV_MAP_SV = '';
function envRememberView(svUuid){
  if(!ENVMAP || !svUuid) return;
  try{
    const c = ENVMAP.getCenter();
    ENV_VIEW[svUuid] = {lat:c.lat, lon:c.lng, zoom:ENVMAP.getZoom(),
                        bearing: mapBearing(ENVMAP)};
  }catch(e){}
}
/* 地図の大きさ（小さいまま入力欄も見るか、大きくして地図に集中するか） */
function envMapBig(){ return !!prefs().env_map_big; }
// 描き直す前に打ちかけを書く。書かずに描き直すと、入力の直後に押した0.6秒ぶんが消える
function envToggleBig(){ if(!envFlushOk()) return; prefSet('env_map_big', !envMapBig()); render(); }
/* 地図を大きくしていると、入力欄は画面の外に出る。
   小さくし直さなくても行き来できるようにする（大きい地図のまま記入したい場面がある） */
function envScrollTo(sel){
  const el = $(sel); if(!el || !el.scrollIntoView) return false;
  try{ el.scrollIntoView({block:'start', behavior:'smooth'}); }
  catch(e){ try{ el.scrollIntoView(); }catch(e2){ return false; } }
  return true;
}
function envJumpToForm(){ return envScrollTo('#envFormTop'); }
function envJumpToMap(){ return envScrollTo('#envmap'); }

/* まとめて消すために選んでいる最中。{sv, set} を持つ */
let ENV_PICK = null;
function envPickOn(){ return !!(ENV_PICK && ENV_PICK.set); }
// 産卵床の入力欄を出したままでも押せる場所にあるので、
// 打ちかけを書いてから画面を作り直す（書かずに作り直すと、打った値が消える）
function envPickStart(svUuid){
  if(!envFlushOk()) return;
  ENV_PICK = {sv: svUuid, set: new Set()}; render();
}
function envPickCancel(){
  if(!envFlushOk()) return;
  ENV_PICK = null; render();
}
function envPickToggle(u){
  if(!envPickOn()) return;
  if(ENV_PICK.set.has(u)) ENV_PICK.set.delete(u); else ENV_PICK.set.add(u);
  envPickSync();
}
/* 選んだ数と印を、その場で書き替える（画面ごと作り直すと地図がちらつく） */
function envPickSync(){
  const n = envPickOn() ? ENV_PICK.set.size : 0;
  document.querySelectorAll('[data-seg="envsel"] button[data-u]').forEach(b=>{
    b.classList.toggle('on', !!(envPickOn() && ENV_PICK.set.has(b.dataset.u)));
  });
  const btn = $('#envPickDel');
  if(btn){
    btn.textContent = n ? `選んだ ${n}件を消す` : '消すものを押してください';
    btn.disabled = !n;
  }
}
/* まとめて消す。1回の保存で書く。
   1件ずつ書くと、途中で失敗したときに「消えたもの・残ったもの」が混ざる */
function envPickDelete(svUuid){
  if(!envPickOn() || !ENV_PICK.set.size) return;
  if(!envFlushOk()) return;
  const ids = Array.from(ENV_PICK.set);
  const names = ids.map(u=>(DB.get(DB.key.un, u)||{}).name||'').filter(Boolean);
  const list = names.slice(0,5).join('・') + (names.length>5 ? `ほか${names.length-5}件` : '');
  if(!confirm(`${list} の ${ids.length}件を消します。中の記録も一緒に見えなくなります。\nよろしいですか？`)) return;
  let all;
  try{ all = DB.loadRaw(DB.key.un); }
  catch(e){ toast('保存された記録を読み取れないため、消せませんでした'); return; }
  const t = nowISO();
  let n = 0;
  all.forEach(x=>{
    if(x && ENV_PICK.set.has(x.uuid) && x.survey_uuid===svUuid && !x.deleted_at){
      x.deleted_at = t; x.updated_at = t; n++;
    }
  });
  if(!n){ toast('消せるものがありませんでした'); ENV_PICK = null; render(); return; }
  if(!DB.save(DB.key.un, all)){
    toast('消せませんでした（端末の空き容量をご確認ください）');
    return;                      // 何も変えない
  }
  ENV_PICK = null;
  if(ENV_SEL && !DB.liveUnit(ENV_SEL)) ENV_SEL = null;
  if(ENV_NEXT.line && !DB.liveUnit(ENV_NEXT.line)){
    ENV_NEXT = {kind:ENV_NEXT.kind, auto:ENV_NEXT.auto, line:'', survey:ENV_NEXT.survey};
  }
  toast(`${n}件を消しました`);
  render();
}
/* いま選んでいるもの・つなげる・案内の一行を、その場で書き替える。
   画面ごと作り直すと地図がちらつくので、必要なところだけ直す */
function envSyncNextUI(){
  const bars = document.querySelectorAll('.mapicons a[data-k]');
  bars.forEach(a=>{
    const k = a.dataset.k;
    if(k === 'compass') return;         // 方位は別の印
    const on = (k==='chain') ? envChain() : (ENV_NEXT.kind === k);
    a.classList.toggle('on', !!on);
  });
  const hint = $('#envHint');
  if(hint){
    const w = envKindWord(ENV_NEXT.kind);
    let to = '';
    if(ENV_NEXT.kind === 'V'){
      // どのラインに付くのかを出す。つなげたときは、選ばれているものと違うことがある
      const t = envBendTarget(ENV_NEXT.survey);
      to = t ? `　<b>${esc(t.name||'')}</b> に足します`
             : '　<span class="badge">どのラインに足すか決められません</span>';
    }
    hint.innerHTML = `つぎ：<b>${esc(w)}</b>${to}　地図をタップ／狙いの印で置けます`
      + (ENV_NEXT.auto ? '（始まり→終わりで交互）' : '（同じものが続きます）');
  }
  const box = $('#envPending');
  if(box){
    const p = envPendingLine(ENV_NEXT.survey);
    box.innerHTML = p ? `<div class="warnbox">${esc(p.name)} は始まりだけです。`
      + `ラインの終わりを置いてください。</div>` : '';
  }
  // 地図のボタンが出ていなければ、押した印は付け替えられない。
  // 呼んだ側が画面を作り直せるよう、false を返す
  return !!bars.length;
}
/* 置いてあるものの点を全部集める（全体が入るように動かすため） */
function envAllPoints(svUuid){
  const pts = [];
  DB.unitsOf(svUuid).forEach(x=>{
    if(isMesh(x)){ const g = meshGeom(x); if(g) g.corners.forEach(p=>pts.push(p)); return; }
    const a = ptOf(x.latitude, x.longitude); if(a) pts.push(a);
    linePath(x).forEach(p=>pts.push(p));
  });
  // 産卵床も「全部入るように」の対象にする（同じ地図に出ているため）
  DB.reddsOf(svUuid).forEach(r=>{
    const p = ptOf(r.latitude, r.longitude); if(p) pts.push(p);
  });
  return pts;
}
/* 地図をはじめて開いたときの、まん中 */
function envMapCenter(sv, cur){
  if(cur){
    const p = isLine(cur) ? (linePt(cur,'start') || linePt(cur,'end'))
                          : ptOf(cur.latitude, cur.longitude);
    if(p) return p;
  }
  const list = DB.unitsOf(sv.uuid).filter(x=>!isMesh(x));
  for(let i=list.length-1;i>=0;i--){
    const x = list[i];
    const p = isLine(x) ? (linePt(x,'start') || linePt(x,'end'))
                        : ptOf(x.latitude, x.longitude);
    if(p) return p;
  }
  const r = DB.reddsOf(sv.uuid).map(x=>ptOf(x.latitude, x.longitude)).filter(Boolean)[0];
  if(r) return r;
  if(lastFix) return [lastFix.lat, lastFix.lon];
  return [43.5, 142.5];
}
function closeEnvMap(){
  // 片付ける前に、見ている場所を覚えておく
  if(ENV_MAP_SV && ENVMAP){ try{ envRememberView(ENV_MAP_SV); }catch(e){} }
  ENV_MAP_SV = '';
  if(ENVMAP){ try{ ENVMAP.remove(); }catch(e){} }
  ENVMAP = null; ENVLAYER = []; MESHLAYER = []; MEMARK = [];
  compassStop();          // 向きの追いかけを、地図と一緒に止める
  if(ENV_GPS_TIMER){ clearInterval(ENV_GPS_TIMER); ENV_GPS_TIMER = null; }
  // 入力欄の持ち主を手放す。手放さないと、産卵床やメモの画面で足した写真が
  // 直前に開いていた物理環境の記録へ書き込まれてしまう。
  // 画面を作り直したあと、物理環境の画面なら onMount で付け直される
  ENV_FORM = ''; ENV_FORM_KIND = ''; ENV_FORM_SEQ++; ENV_DIRTY = false;
  REDDGROUP = null;
}
// 地図に置く印。文字を入れた丸（画像を使わないので同梱ファイルが増えない）
function envBadge(txt, color, size, strong){
  const fs = size <= 24 ? 10 : 12;
  return L.divIcon({ className:'', iconSize:[size,size], iconAnchor:[size/2,size/2],
    html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};
      border:${strong?3:2}px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.4);color:#fff;
      font-size:${fs}px;font-weight:700;display:flex;align-items:center;
      justify-content:center;overflow:hidden">${esc(txt||'')}</div>` });
}
function envDrawAll(svUuid){
  if(!ENVMAP) return;
  ENVLAYER.forEach(l=>{ try{ ENVMAP.removeLayer(l); }catch(e){} });
  ENVLAYER = [];
  const range = envColorRange(svUuid);
  DB.unitsOf(svUuid).filter(x=>!isMesh(x)).forEach(x=>{
    const on = x.uuid === ENV_SEL;
    const byCol = envColorOf(x, range);
    const col = byCol || (on ? '#e0a030' : (isLine(x) ? '#4aa3dd' : '#4ec38a'));
    const put = (pt, txt)=>{
      ENVLAYER.push(L.marker(pt, {icon:envBadge(txt, col, on?30:24, on),
        zIndexOffset: on ? 1000 : 0})
        .on('click', e=>{ L.DomEvent.stop(e); envTapAt(svUuid, 'un', x.uuid, pt[0], pt[1]); }).addTo(ENVMAP));
    };
    if(isLine(x)){
      const a = linePt(x,'start'), b = linePt(x,'end');
      if(a) put(a, x.name||'');
      if(b) put(b, '終');
      lineVias(x).forEach(v=>{
        ENVLAYER.push(L.circleMarker(v, {radius:on?6:4, color:'#fff', weight:2,
          fillColor:col, fillOpacity:1, bubblingMouseEvents:false})
          .on('click', e=>{ L.DomEvent.stop(e); envSelect(x.uuid); }).addTo(ENVMAP));
      });
      const path = linePath(x);
      if(path.length >= 2) ENVLAYER.push(L.polyline(path,
        {color:col, weight:on?6:4, opacity:.9, bubblingMouseEvents:false})
        .on('click', e=>{ L.DomEvent.stop(e); envSelect(x.uuid); }).addTo(ENVMAP));
    }else{
      const pt = ptOf(x.latitude, x.longitude);
      if(pt) put(pt, x.name||'');
    }
  });
  // ここでは地図を動かさない。
  // 置くたびに全体表示へ戻ると、寄って作業しているときに邪魔になる
}

/* ---------- 産卵床（S）を地図に描く ---------- */
/* ふだん一覧に並べる数。これを超える分は「すべて表示」を押したときだけ出す */
const REDD_CHIP_MAX = 20;
/* これを超えたら、地図には見えている範囲のものだけを描く */
const REDD_DRAW_MAX = 300;
/* 置いただけで、まだ中身が入っていない産卵床。
   よく使う欄がぜんぶ空なら「まだ入れていない」とみなす */
function reddEmpty(r){
  if(!r) return false;
  const f = v => v!=='' && v!=null;
  return !(f(r.species) || f(r.age_class) || f(r.state) ||
           f(r.length_cm) || f(r.width_cm) || f(r.water_temp_c) ||
           f(r.female_n) || f(r.male_n) || f(r.carcass_n));
}
/* 番号の小さい順（S1・S2…と読める順）。DB.reddsOf は新しい順なので並べ直す */
function reddsSorted(svUuid){
  return DB.reddsOf(svUuid).slice()
    .sort((a,b)=>(parseInt(a.redd_no,10)||0)-(parseInt(b.redd_no,10)||0));
}
/* 地図に描く産卵床を選ぶ。300件を超えたら、いま見えている範囲だけにする。
   地図が無くても確かめられるよう、ただの計算にしておく */
function reddDrawList(svUuid, bounds){
  const all = reddsSorted(svUuid).filter(r=>ptOf(r.latitude, r.longitude));
  if(all.length <= REDD_DRAW_MAX || !bounds) return all;
  // 選んでいるものは、範囲の外でも必ず描く（選んでいるのに印が消えると事故に見える）
  return all.filter(r=> r.uuid===REDD_SEL || bounds.contains(ptOf(r.latitude, r.longitude)));
}
let REDDGROUP = null;
/* 産卵床だけを描き直す。物理環境（ENVLAYER）は巻き込まない */
function reddDrawAll(svUuid){
  if(!ENVMAP || typeof L==='undefined') return;
  if(!REDDGROUP) REDDGROUP = L.layerGroup().addTo(ENVMAP);
  REDDGROUP.clearLayers();      // 1つずつ消すより軽い
  let bounds = null;
  try{ bounds = ENVMAP.getBounds().pad(0.2); }catch(e){}
  reddDrawList(svUuid, bounds).forEach(r=>{
    const pt = ptOf(r.latitude, r.longitude); if(!pt) return;
    const on = r.uuid === REDD_SEL;
    // 色は魚種、濃さは新旧。産卵床の地図と同じ見方にそろえる。
    // まだ入れていないものは薄くして、入れ残しが一目で分かるようにする
    REDDGROUP.addLayer(L.circleMarker(pt, {
      radius: on ? 10 : 7, color:'#fff', weight:2,
      fillColor: speciesColor(r.species),
      fillOpacity: reddEmpty(r) ? .25 : ageOpacity(r.age_class),
      bubblingMouseEvents:false,
    }).on('click', e=>{ L.DomEvent.stop(e);
      // 同じ場所に重なっていれば小窓で選ぶ（打ちかけを書けないときは中で止まる）
      envTapAt(svUuid, 'rd', r.uuid, pt[0], pt[1]);
    }));
    // 番号は、選んでいる1つだけに出す。全部に出すと重なって読めない。
    // 番号の印を押しても、下に重なったものを選べるようにする
    if(on) REDDGROUP.addLayer(L.marker(pt, {
      icon: envBadge(reddName(r), speciesColor(r.species), 30, true), zIndexOffset:1200,
    }).on('click', e=>{ L.DomEvent.stop(e); envTapAt(svUuid, 'rd', r.uuid, pt[0], pt[1]); }));
  });
}

/* 一覧の絞り込み。100件を超えると、ぜんぶ並べても目的のものを探せない */
let REDD_FILTER = {all:false, empty:false, reach:''};
function reddFilterToggle(what, svUuid){
  if(what==='all')   REDD_FILTER.all   = !REDD_FILTER.all;
  if(what==='empty'){ REDD_FILTER.empty = !REDD_FILTER.empty; REDD_FILTER.all = true; }
  reddChipSync(svUuid);
}
function reddFilterReach(v, svUuid){ REDD_FILTER.reach = v || ''; reddChipSync(svUuid); }
/* いま一覧に並べるもの */
function reddListFor(svUuid){
  let list = reddsSorted(svUuid);
  if(REDD_FILTER.reach) list = list.filter(r=>(r.reach_uuid||'') === REDD_FILTER.reach);
  if(REDD_FILTER.empty) list = list.filter(reddEmpty);
  // ふだんは新しいほうの20件だけ。古いものは「すべて表示」で出す
  if(!REDD_FILTER.all && list.length > REDD_CHIP_MAX) list = list.slice(-REDD_CHIP_MAX);
  return list;
}
function reddChipsHtml(svUuid){
  const list = reddListFor(svUuid);
  if(!list.length) return '<div class="tiny muted">この条件に合うものはありません。</div>';
  return list.map(r=>{
    const on = envFocus()==='rd' && r.uuid === REDD_SEL;
    // まだ入れていないものには「…」を付ける（終わっていないラインと同じ印）
    return `<button type="button" data-u="${r.uuid}" class="${on?'on':''}"
      onclick="reddPick('${r.uuid}','${svUuid}')">${esc(reddName(r))}${reddEmpty(r)?'…':''}</button>`;
  }).join('');
}
function reddHeadHtml(svUuid){
  const all = DB.reddsOf(svUuid);
  const empty = all.filter(reddEmpty).length;
  const shown = reddListFor(svUuid).length;
  const reaches = DB.reachesOf(svUuid);
  const opt = (v, t)=>`<option value="${esc(v)}"${REDD_FILTER.reach===v?' selected':''}>${esc(t)}</option>`;
  return `
    <div class="row" style="margin-bottom:6px">
      <div class="grow">産卵床 ${all.length}件
        ${empty ? `　<b>まだ入れていない ${empty}件</b>`
                : (all.length ? '　ぜんぶ入りました' : '')}</div>
    </div>
    <div class="row">
      <button class="btn ghost small" style="width:auto;padding:4px 10px"
        onclick="reddFilterToggle('empty','${svUuid}')">${REDD_FILTER.empty?'絞り込みをやめる':`まだ入れていないものだけ（${empty}）`}</button>
      <button class="btn ghost small" style="width:auto;padding:4px 10px"
        onclick="reddFilterToggle('all','${svUuid}')">${REDD_FILTER.all?`新しい${REDD_CHIP_MAX}件に戻す`:`すべて表示（${all.length}）`}</button>
      ${reaches.length ? `<select style="width:auto"
        onchange="reddFilterReach(this.value,'${svUuid}')">
        ${opt('','区間：すべて')}${reaches.map(re=>opt(re.uuid, re.name||'')).join('')}
      </select>` : ''}
    </div>
    ${shown < all.length ? `<div class="tiny muted">${shown}件を表示しています。</div>` : ''}`;
}
/* 全体が入るように動かす。押したときだけ */
function envFitAll(svUuid){
  if(!ENVMAP) return;
  const pts = envAllPoints(svUuid);
  if(!pts.length){ toast('まだ何も置かれていません'); return; }
  try{ ENVMAP.fitBounds(L.latLngBounds(pts).pad(0.3), {animate:false}); }catch(e){}
  envRememberView(svUuid);
}
/* 指では、すでにある点とまったく同じ場所を狙えない。
   すぐ近く（指1本ぶん）に置いてあるものがあれば、そこへぴったり重ねる。
   もっと寄れば、この幅は実際の距離としては小さくなる */
const ENV_SNAP_PX = 18;
function envSnapTo(svUuid, lat, lon, except){
  if(!ENVMAP || typeof ENVMAP.latLngToContainerPoint !== 'function') return null;
  let here; try{ here = ENVMAP.latLngToContainerPoint([lat, lon]); }catch(e){ return null; }
  let near = null, dist = ENV_SNAP_PX;
  DB.unitsOf(svUuid).filter(x=>!isMesh(x)).forEach(x=>{
    if(except && x.uuid === except) return;
    const corners = [];
    if(isLine(x)){
      const a = linePt(x,'start'), b = linePt(x,'end');
      if(a) corners.push({pt:a, w:'始点'});
      if(b) corners.push({pt:b, w:'終点'});
    }else{
      const pt = ptOf(x.latitude, x.longitude);
      if(pt) corners.push({pt, w:''});
    }
    corners.forEach(c=>{
      let d;
      try{ d = here.distanceTo(ENVMAP.latLngToContainerPoint(c.pt)); }catch(e){ return; }
      if(d <= dist){ dist = d; near = {lat:c.pt[0], lon:c.pt[1], name:x.name||'', w:c.w}; }
    });
  });
  return near;
}
function envSnapTell(sn){
  if(!sn) return;
  toast(`${sn.name}${sn.w ? 'の'+sn.w : ''} に重ねました`);
}

/* ---------- 重なった印から1つ選ぶ ---------- */
/* 押した場所（lat, lon）の指1本ぶん（px）に置いてあるものを全部集める。
   産卵床・ポイント・ラインの始点と終点が対象。曲がりは選ぶ対象ではないので入れない。
   toPx は [lat,lon] → {x,y} の関数。地図が無くても確かめられるよう、外から渡す */
function envOverlapAt(svUuid, lat, lon, toPx, px, redds){
  const lim = px==null ? ENV_SNAP_PX : px;
  let here; try{ here = toPx([lat, lon]); }catch(e){ return []; }
  if(!here) return [];
  const out = [];
  const near = pt=>{
    let q; try{ q = toPx(pt); }catch(e){ return false; }
    if(!q) return false;
    return Math.hypot(q.x-here.x, q.y-here.y) <= lim;
  };
  // 産卵床の候補。渡されなければ全部（300件超のときは呼ぶ側が見えている範囲に絞って渡す）
  (redds || reddsSorted(svUuid)).forEach(r=>{
    const pt = ptOf(r.latitude, r.longitude);
    if(pt && near(pt)) out.push({kind:'rd', uuid:r.uuid, w:'', label:reddName(r) + (r.species ? '　'+r.species : '')});
  });
  DB.unitsOf(svUuid).filter(x=>!isMesh(x)).forEach(x=>{
    if(isLine(x)){
      const a = linePt(x,'start'), b = linePt(x,'end');
      if(a && near(a)) out.push({kind:'un', uuid:x.uuid, w:'始点', label:(x.name||'')+'の始点'});
      if(b && near(b)) out.push({kind:'un', uuid:x.uuid, w:'終点', label:(x.name||'')+'の終点'});
    }else{
      const pt = ptOf(x.latitude, x.longitude);
      if(pt && near(pt)) out.push({kind:'un', uuid:x.uuid, w:'', label:x.name||''});
    }
  });
  return out;
}
/* 地図の印を押したとき。同じ場所に2つ以上あれば、小窓を出して選んでもらう。
   1つだけなら、押したものをそのまま選ぶ。
   出しておかないと、上に乗った印しか押せず、下に隠れたものを永久に選べない */
let ENV_CHOOSER = null;    // 開いている小窓
/* 小窓を閉じた直後か。地図の空いた所を押すと Leaflet が先に小窓を閉じ、そのあとで
   地図の「押した」処理が走る。そこで「開いていない」と見て点を置いてしまわないための印 */
let ENV_CHOOSER_JUST = false;
function envChooserJustClosed(){ return ENV_CHOOSER_JUST; }
function envTapAt(svUuid, kind, uuid, lat, lon){
  // 直す待ち・消すもの選びの最中は、印を押しても「選ぶ」ではない。
  // 地図の空いた所を押したときと同じ扱いにする（印の上だけ別の動きになると事故になる）
  if(ENV_MOVE){ envMoveByTap(svUuid, lat, lon); return; }
  // 押した場所に重なっているもの（地図が無ければ、押したものだけ）
  let list = null;
  if(ENVMAP && typeof ENVMAP.latLngToContainerPoint === 'function'){
    // 産卵床が多いときは、地図に描いている（見えている範囲の）ものだけを候補にする
    let bounds = null;
    try{ bounds = ENVMAP.getBounds().pad(0.2); }catch(e){}
    list = envOverlapAt(svUuid, lat, lon, pt=>ENVMAP.latLngToContainerPoint(pt),
                        null, reddDrawList(svUuid, bounds));
    // 押したものが入っていなければ、重なりは調べられなかったものとして扱う
    if(!list.some(o=>o.kind===kind && o.uuid===uuid)) list = null;
  }
  if(envPickOn()){
    // 消すもの選びの最中。消せるのは物理環境だけなので、産卵床は候補から外す。
    // 同じラインの始点と終点は1つにまとめる（消すのはライン1本）
    const seen = new Set();
    const cands = (list || [{kind, uuid}])
      .filter(o=>o.kind==='un' && !seen.has(o.uuid) && seen.add(o.uuid))
      .map(o=>({kind:'un', uuid:o.uuid, label:(DB.liveUnit(o.uuid)||{}).name||''}));
    if(!cands.length){ toast('消せるのは物理環境だけです（産卵床はそれぞれの入力欄から消せます）'); return; }
    if(cands.length===1){ envPickToggle(cands[0].uuid); return; }
    envChooserOpen(cands, [lat, lon], o=>{ envChooserClose(); envPickToggle(o.uuid); },
                   `同じ場所に ${cands.length}つあります。どれを消しますか？`);
    return;
  }
  if(!envFlushOk()) return;   // 打ちかけを書けないなら、選び替えない
  // つぎに置くのが物理環境なら、印の上にも置けるようにする（産卵床の上にラインの
  // 始点を重ねる等）。印を押すと地図の「押した」処理には届かないので、ここで
  // 「ここに置く」も選べる小窓を出す。つぎが産卵床のときは、印に重ねない決まり
  // なので今まで通り「開く」だけ
  const nk = envNextKindLabel(svUuid);
  if(nk && envChooserCan()){
    const items = list || [{kind, uuid, w:'', label:envTapLabel(kind, uuid)}];
    const put = {kind:'put', uuid:'', w:'', label:`ここに${nk}を置く`};
    envChooserOpen([put, ...items], [lat, lon], o=>{
      if(o.kind==='put'){
        // 打ちかけを書けないなら、小窓を残したまま止まる（「開く」と同じ扱い）
        if(!envFlushOk()) return;
        envChooserClose(); envPlaceAt(svUuid, lat, lon, false);
      }
      else envTapPick(svUuid, o.kind, o.uuid);
    }, items.length > 1 ? `同じ場所に ${items.length}つあります。置きますか、開きますか？`
                        : '置きますか、開きますか？');
    return;
  }
  // 押したものが1つだけ（または重なりを調べられない）→ そのまま選ぶ
  if(!list || list.length <= 1){ envTapPick(svUuid, kind, uuid); return; }
  envChooserOpen(list, [lat, lon], o=>envTapPick(svUuid, o.kind, o.uuid),
                 `同じ場所に ${list.length}つあります。どれを開きますか？`);
}
/* 小窓を出せる作りか（地図が無い確かめ用の環境では出せない） */
function envChooserCan(){ return !!(ENVMAP && typeof L!=='undefined' && L.popup); }
/* つぎに置くものの名前。産卵床なら ''（印の上には置かない） */
function envNextKindLabel(svUuid){
  const k = ENV_NEXT.survey===svUuid ? ENV_NEXT.kind : 'P';
  return {P:'ポイント', LS:'ラインの始まり', LE:'ラインの終わり', V:'ラインの曲がり'}[k] || '';
}
/* 押した印の名前（重なりを調べられなかったときの小窓用） */
function envTapLabel(kind, uuid){
  if(kind==='rd'){ const r = DB.get(DB.key.rd, uuid); return r ? reddName(r) + (r.species ? '　'+r.species : '') : ''; }
  return (DB.liveUnit(uuid)||{}).name||'';
}
/* 地図の空いた所を押したとき */
function envMapClick(svUuid, lat, lon){
  // 選ぶ小窓が開いているときは、閉じるだけ。ここで置いてしまうと
  // 小窓を閉じたつもりの1押しで産卵床が1つ増える
  if(ENV_CHOOSER || envChooserJustClosed()){ envChooserClose(); return; }
  // 直す待ちのときは、新しく置かずに動かす
  if(ENV_MOVE){ envMoveByTap(svUuid, lat, lon); return; }
  if(envPickOn()){ toast('消すものを選んでいます。先に「やめる」を押してください'); return; }
  // 打ちかけを先に書いてから置く（書かずに次を置くと、画面を作り直したときに
  // 直前に打った値（自動保存の待ち0.6秒ぶん）が黙って消える）。近くの印には重ねる
  envPlaceAt(svUuid, lat, lon, true);
}
/* つぎのものを、この場所に置く。地図の空いた所を押したときと、印の上に置くときの共通の道。
   snap: 近くの印に重ねるか（印の上に置くときは、その印の場所そのものなので重ねない） */
function envPlaceAt(svUuid, lat, lon, snap){
  if(!envFlushOk()) return false;
  // 産卵床は、近くの印に重ねない。隣り合う産卵床は本当に別のものなので、
  // 重ねてしまうと2つを1つと数えることになる
  const snapping = snap && !(ENV_NEXT.survey===svUuid && ENV_NEXT.kind==='S');
  const sn = snapping ? envSnapTo(svUuid, lat, lon, null) : null;
  const la = sn ? sn.lat : lat, lo = sn ? sn.lon : lon;
  const added = envAddAt(svUuid, la, lo, '', '地図');
  if(!added) return false;
  envSnapTell(sn);
  // 産卵床は続けて100個以上置くので、作り直すと目に見えて遅くなる。
  // 地図はそのままに、印と一覧と入力欄だけを書き替える。
  // 物理環境は数が少ないので、そのまま作り直してよい
  if(!(envFocus()==='rd' && reddSyncUI(svUuid))) render();
  return true;
}
/* 小窓を出す。list の1つを押したら onPick(o) を呼ぶ。
   小窓を出せない作り（または出す途中で失敗）なら、「ここに置く」以外の先頭を選んだことにする。
   押していないのに物理環境が増えるのは事故なので、「置く」は必ず利用者が押したときだけ */
function envChooserOpen(list, pt, onPick, title){
  const fallback = ()=>onPick(list.find(o=>o.kind!=='put') || list[0]);
  if(!envChooserCan()){ fallback(); return; }
  const sel = o => (o.kind==='rd' ? (envFocus()==='rd' && o.uuid===REDD_SEL)
                  : o.kind==='un' ? (envFocus()==='un' && o.uuid===ENV_SEL) : false);
  // ボタンは DOM で組む。ID を文字列に埋め込むと、バックアップから来た
  // 変な ID（引用符入りなど）で壊れたり、余計なものが動いたりする
  const box = document.createElement('div'); box.className = 'chooser';
  const head = document.createElement('div'); head.className = 'tiny muted';
  head.textContent = title;
  box.appendChild(head);
  list.forEach(o=>{
    const b = document.createElement('button'); b.type = 'button';
    if(sel(o)) b.className = 'on';
    else if(o.kind==='put') b.className = 'put';
    b.textContent = o.label + (sel(o) ? '（いま開いている）' : '');
    b.addEventListener('click', ()=>onPick(o));
    box.appendChild(b);
  });
  try{
    envChooserClose();
    ENV_CHOOSER = L.popup({closeButton:true, autoPan:true, className:'chooser-pop', maxWidth:260})
      .setLatLng(pt).setContent(box).openOn(ENVMAP);
    ENVMAP.once('popupclose', ()=>{
      ENV_CHOOSER = null;
      ENV_CHOOSER_JUST = true; setTimeout(()=>{ ENV_CHOOSER_JUST = false; }, 0);
    });
  }catch(e){ ENV_CHOOSER = null; fallback(); }
}
function envChooserClose(){
  if(!ENV_CHOOSER) return;
  try{ ENVMAP.closePopup(ENV_CHOOSER); }catch(e){}
  ENV_CHOOSER = null;
}
/* 小窓の中で1つ選んだ（または1つしか無かった） */
function envTapPick(svUuid, kind, uuid){
  // 小窓を開いたあとに入力欄を触っていることがある。先に書けなければ何もしない
  // （書けないまま作り直すと、打った内容が消える）
  if(!envFlushOk()) return;
  envChooserClose();
  if(kind==='rd'){ if(!reddSelect(uuid, svUuid)) render(); }   // false = 画面に部品が無い
  else envSelect(uuid);
}
/* 直す待ちのとき、地図（または印）を押した場所へ動かす。地図の click と印の click で共通 */
function envMoveByTap(svUuid, lat, lon){
  if(ENV_MOVE.kind==='rd'){
    if(reddMoveTo(ENV_MOVE.uuid, lat, lon, '', '地図')) render();
    return;
  }
  const m = ENV_MOVE;
  // すぐ近くに置いてあるものがあれば、そこへ重ねる
  const sn = envSnapTo(svUuid, lat, lon, m.uuid);
  const la = sn ? sn.lat : lat, lo = sn ? sn.lon : lon;
  if(envMoveTo(m.uuid, m.which, la, lo, '', '地図')){ envSnapTell(sn); render(); }
}

/* いまの種類（点／ラインの始まり・終わり／曲がり）で1件足す。
   source は '地図' か 'GPS'（呼ぶ側が必ず渡す。中で推測すると、位置の「決め方」が化ける）。
   targetUuid は、現在地を待ちはじめる前に決めたつなぎ先。
   待っている間に人が別のラインを選んでも、そちらへ書かれないようにする */
function envAddAt(svUuid, lat, lon, acc, source, targetUuid){
  if(!DB.survey(svUuid)) return null;
  if(!envFlushOk()) return null;   // いま打っている分を、置く前に書いてしまう
  const la = +(+lat).toFixed(6), lo = +(+lon).toFixed(6);
  if(!validPt([la, lo])){ toast('位置がおかしいので追加できません'); return null; }
  const k = ENV_NEXT.survey===svUuid ? ENV_NEXT.kind : 'P';
  const accV = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);

  if(k === 'S') return reddAddAt(svUuid, la, lo, accV, source);
  if(k === 'V') return envAddBend(svUuid, la, lo, acc, targetUuid);

  if(k === 'LE'){
    // 始まりだけのラインにつなぐ。無ければ足さない（勝手に線を作らない）
    let x;
    if(targetUuid){
      const t = DB.liveUnit(targetUuid);
      x = (t && t.survey_uuid===svUuid && isLine(t)
           && linePt(t,'start') && !linePt(t,'end')) ? t : null;
      if(!x){ toast('現在地を取っている間に、つなぐ相手のラインが変わったので置いていません'); return null; }
    }else{
      x = envLineTarget(svUuid);
    }
    if(!x){
      const half = DB.unitsOf(svUuid).filter(y=>isLine(y)
        && linePt(y,'start') && !linePt(y,'end') && sameReach(y, envReachOf(svUuid)));
      toast(half.length > 1
        ? `終わっていないラインが${half.length}本あります。どれにつなぐか、下のボタンで先に選んでください`
        : 'つなぐラインがありません。先に「ラインの始まり」を置いてください');
      return null;
    }
    const prevTime = x.survey_time_end || '', prevEnded = x.ended_at || '';
    x.line_end_lat = la; x.line_end_lon = lo; x.line_end_acc = accV;
    if(!x.survey_time_end) x.survey_time_end = timeValue();
    x.ended_at = x.ended_at || nowISO();

    // つなげる：閉じた場所を、次のラインの始まりにする。
    // 「閉じる」と「次を始める」を別々に保存すると、片方だけ成功したときに
    // 閉じたのに次が始まっていない半端な状態が残る。1回の保存でまとめて書く
    const nx = envChain() ? Object.assign(newUnit(svUuid, 'ライン', x.reach_uuid||''), {
      line_direction: x.line_direction || '上流→下流',
      line_start_lat: la, line_start_lon: lo, line_start_acc: accV,
      chained_from: x.uuid,
    }) : null;

    let all;
    try{ all = DB.loadRaw(DB.key.un); }
    catch(e){ toast('保存された記録を読み取れないため、置けませんでした'); return null; }
    const i = all.findIndex(y=>y.uuid===x.uuid);
    if(i < 0){ toast('この区間が見つかりません'); return null; }
    x.updated_at = nowISO();
    all[i] = x;
    if(nx){ nx.created_at = nowISO(); nx.updated_at = nx.created_at; all.push(nx); }
    if(!DB.save(DB.key.un, all)) return null;   // 保存できていないので、何も変えない

    envHistPush({type:'終わり', sv:svUuid, uuid:x.uuid, name:x.name,
      next: nx ? nx.uuid : '', prevTime, prevEnded});
    envMarkPlaced();
    envAdvance('LE');
    let more = '';
    if(nx){
      // 交互にするかどうかは、人が決めたままにする（勝手に戻さない）
      ENV_NEXT = {kind:'LE', auto:ENV_NEXT.auto, line:nx.uuid, survey:svUuid};
      more = `　つづけて ${nx.name} が始まりました`;
    }
    ENV_SEL = x.uuid;          // いま閉じたものを選ぶ（前の記録に書き込ませない）
    envSetFocus('un');
    toast(`${x.name} の終わりを置きました（${fmtDist(lineDist(x))}）${more}`);
    return x;
  }

  const rec = newUnit(svUuid, k==='LS' ? 'ライン' : '点');
  if(k === 'LS'){
    rec.line_start_lat = la; rec.line_start_lon = lo; rec.line_start_acc = accV;
  }else{
    rec.latitude = la; rec.longitude = lo; rec.gps_accuracy = accV;
    rec.position_source = source || '地図';
    rec.survey_time_end = rec.survey_time_start;   // 点は幅を持たない
    rec.ended_at = nowISO();
  }
  if(!DB.put(DB.key.un, rec)){ toast('置けませんでした（端末の空き容量をご確認ください）'); return null; }
  envHistPush({type:'置いた', sv:svUuid, uuid:rec.uuid, name:rec.name});
  envMarkPlaced();
  envAdvance(k, rec.uuid);
  // 置いたものをそのまま選ぶ。選ばないと、前の記録の入力欄が出たままになり、
  // 新しい点のつもりで前の記録に書き込んでしまう
  ENV_SEL = rec.uuid;
  envSetFocus('un');
  toast(`${rec.name} を置きました`);
  return rec;
}
/* 地図で産卵床を1つ置く。中身は地図の下の入力欄であとから入れる。
   置いた瞬間に保存してしまう（書きかけのまま持たない）。
   こうしておくと「詳しく」で記録画面へ渡すときも、打ちかけが二重にならない */
function reddAddAt(svUuid, lat, lon, acc, source){
  if(!DB.survey(svUuid)) return null;
  const la = +(+lat).toFixed(6), lo = +(+lon).toFixed(6);
  if(!validPt([la, lo])){ toast('位置がおかしいので追加できません'); return null; }
  const rec = newRedd(svUuid, {
    // 区間中なら自動で付く。始めていなければ空のまま
    reach_uuid: envReachOf(svUuid),
    // 緯度経度は数で持つ（保存のときも parsePos で数に直す。物理環境と同じ）
    latitude: la, longitude: lo,
    gps_accuracy: (acc===''||acc==null) ? '' : Math.round(acc),
    position_source: source || '地図',
    // 直前の記録の「場の条件」を引き継ぐ（別の調査のものは使わない）
    carry: (SCREENS._carry && SCREENS._carry.survey_uuid===svUuid) ? SCREENS._carry : {},
  });
  if(!DB.upsert(DB.key.rd, rec)){
    toast('置けませんでした（端末の空き容量をご確認ください）');
    return null;
  }
  envHistPush({type:'産卵床', sv:svUuid, uuid:rec.uuid, name:reddName(rec)});
  envMarkPlaced();
  // 置いたものをそのまま選ぶ（前の記録に書き込ませない）
  REDD_SEL = rec.uuid;
  envSetFocus('rd');
  toast(`${reddName(rec)} を置きました`);
  return rec;
}
/* いまいる場所に足す */
function envAddHere(svUuid){
  if(!envFlushOk()) return;
  toast('現在地を取っています…');
  // どのラインに足すかは、いま決めておく。待っている間に選び直されても、
  // 返ってきた座標が別のラインへ行かないようにする
  const t = ENV_NEXT.kind === 'LE' ? envLineTarget(svUuid)
          : ENV_NEXT.kind === 'V'  ? envBendTarget(svUuid) : null;
  const tu = t ? t.uuid : '';
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした。地図をタップしても置けます'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので置いていません。地図をタップしてください`);
      return;
    }
    if(envAddAt(svUuid, f.lat, f.lon, f.acc, 'GPS', tu)) render();
  });
}
function envSelect(u){
  if(ENV_SEL === u && envFocus() === 'un') return;
  if(!envFlushOk()) return;   // 打ちかけを書けないなら、切り替えない
  ENV_SEL = u;
  envSetFocus('un');
  envMarkSelected();     // 人が選んだ。曲がりの行き先は、これを先に見る
  render();
}
function envDelete(u){
  const rec = DB.get(DB.key.un, u); if(!rec) return;
  if(!confirm(`${rec.name||''} を消します。よろしいですか？`)) return;
  // 消す前に、打ちかけを先に書く。書けないなら消さない
  // （600ミリ秒待ちの最中に消すと、直前の入力が失われる）
  if(!envFlushOk()) return;
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  if(DB.softDelete(DB.key.un, u)){
    if(ENV_SEL === u) ENV_SEL = null;
    if(ENV_NEXT.line === u){
      ENV_NEXT = {kind:ENV_NEXT.kind, auto:ENV_NEXT.auto, line:'', survey:ENV_NEXT.survey};
    }
    ENV_FORM = ''; ENV_DIRTY = false;
    toast('ゴミ箱へ入れました'); render();
  }
}
/* 位置を書き替える。which は '点' / '始点' / '終点' */
function envMoveTo(u, which, la, lo, acc, source, undoing){
  // 動かし始めたあとに打った分も、先に書いてしまう。
  // 書けないまま動かすと、このあとの画面の作り直しで入力が消える
  if(!envFlushOk()) return false;
  const rec = DB.liveUnit(u); if(!rec) return false;
  const a = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);
  // 動かす前の場所を控える（1つ戻すため）
  const prev = which === '始点'
      ? {lat:rec.line_start_lat, lon:rec.line_start_lon, acc:rec.line_start_acc, src:''}
    : which === '終点'
      ? {lat:rec.line_end_lat, lon:rec.line_end_lon, acc:rec.line_end_acc, src:''}
      : {lat:rec.latitude, lon:rec.longitude, acc:rec.gps_accuracy, src:rec.position_source||''};
  if(which === '始点'){
    rec.line_start_lat = la; rec.line_start_lon = lo; rec.line_start_acc = a;
  }else if(which === '終点'){
    rec.line_end_lat = la; rec.line_end_lon = lo; rec.line_end_acc = a;
    if(!rec.survey_time_end) rec.survey_time_end = timeValue();
  }else{
    rec.latitude = la; rec.longitude = lo; rec.gps_accuracy = a;
    // 位置を動かす処理の中で決め方を推測しない。呼ぶ側が渡したものだけ書く
    if(source) rec.position_source = source;
  }
  if(!DB.put(DB.key.un, rec)){
    toast('直せませんでした（端末の空き容量をご確認ください）');
    return false;
  }
  ENV_MOVE = null;
  if(!undoing) envHistPush({type:'動かした', sv:rec.survey_uuid, uuid:u, which, name:rec.name, prev});
  return true;
}
function envMoveStart(u, which){
  if(!envFlushOk()) return;
  if(envMoveOn(u, which)){ ENV_MOVE = null; toast('直すのをやめました'); render(); return; }
  ENV_MOVE = {uuid:u, which:which};
  toast(`地図をタップすると、${which}をそこへ動かします（もう一度押すとやめます）`);
  render();
}
/* いまいる場所へ直す */
function envGrabHere(u, which){
  if(!envFlushOk()) return;
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした。地図で直すこともできます'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので直していません。地図で直してください`);
      return;
    }
    if(envMoveTo(u, which, f.lat, f.lon, f.acc, 'GPS')) render();
  });
}

/* ---------- 産卵床（S）を選ぶ・動かす ---------- */
/* 産卵床を選び替える。地図は作り直さない
   （作り直すと、選ぶたびに地図がちらつき、100件を超えると目に見えて遅くなる）。
   書き替えられなければ false を返すので、呼んだ側が画面を作り直す */
function reddSelect(u, svUuid){
  if(REDD_SEL === u && envFocus() === 'rd') return true;
  if(!envFlushOk()) return false;   // 打ちかけを書けないなら、切り替えない
  REDD_SEL = u;
  envSetFocus('rd');
  envMarkSelected();
  return reddSyncUI(svUuid);
}
/* 入力欄・一覧・地図の印だけを、その場で書き替える。
   画面に出ていなければ false（呼んだ側が画面を作り直す） */
function reddSyncUI(svUuid){
  const box = $('#reddFormBox'); if(!box) return false;
  const r = REDD_SEL ? DB.get(DB.key.rd, REDD_SEL) : null;
  const live = (r && !r.deleted_at) ? r : null;
  const sv = svUuid || (live ? live.survey_uuid : '');
  const s = sv ? DB.survey(sv) : null;
  if(!s) return false;
  box.innerHTML = reddItemFormHtml(live, s);
  reddItemFormWire(live);           // 入力欄の持ち主を付け替える
  reddChipSync(sv);
  reddDrawAll(sv);
  return true;
}
/* 一覧の見た目だけを書き替える（画面は作り直さない）。
   一覧は折り返して並ぶ（横にはスクロールしない）ので、選んだものを scrollIntoView で
   見せる必要はない。以前はそれが縦に効いて、自動保存のたびに（魚種を押すたびに）
   入力欄の上へ引き戻していた。
   代わりに、上の部分の高さが変わったぶんだけ画面をずらして、入力欄を同じ場所に留める */
function reddChipSync(svUuid){
  const top = reddFormTopY();
  const list = $('#reddChips');
  if(list) list.innerHTML = reddChipsHtml(svUuid);
  const head = $('#reddHead');
  if(head) head.innerHTML = reddHeadHtml(svUuid);
  reddKeepFormPlace(top);
}
/* 入力欄の先頭が画面のどこにあるか（測れなければ null） */
function reddFormTopY(){
  try{
    const el = $('#envFormTop');
    if(!el || typeof el.getBoundingClientRect !== 'function') return null;
    return el.getBoundingClientRect().top;
  }catch(e){ return null; }
}
/* 入力欄の先頭が画面の上に隠れているとき（＝入力欄の中で作業しているとき）だけ、
   上の部分の伸び縮みを打ち消す。見えているときは、そのまま見せる */
function reddKeepFormPlace(before){
  if(before === null || before >= 0) return;
  const after = reddFormTopY();
  if(after === null) return;
  const d = after - before;
  if(Math.abs(d) < 1 || typeof window.scrollBy !== 'function') return;
  try{ window.scrollBy(0, d); }catch(e){}
}
/* 一覧から選ぶ。地図もそこへ寄せる（ズームは変えない。寄って作業しているのを崩さない） */
function reddPick(u, svUuid){
  // 打ちかけを書けないなら、ここで止める。
  // 先に進むと、下の render() が画面を作り直して、
  // 「直してください」と出したそばから打った内容を消してしまう
  if(!envFlushOk()) return;
  if(!reddSelect(u, svUuid)){ render(); return; }
  const r = DB.get(DB.key.rd, u);
  const pt = r ? ptOf(r.latitude, r.longitude) : null;
  if(pt && ENVMAP){ try{ ENVMAP.panTo(pt, {animate:false}); }catch(e){} }
}
function reddMoveOn(u){ return !!(ENV_MOVE && ENV_MOVE.kind==='rd' && ENV_MOVE.uuid===u); }
function reddMoveStart(u){
  if(!envFlushOk()) return;
  if(reddMoveOn(u)){ ENV_MOVE = null; toast('直すのをやめました'); render(); return; }
  ENV_MOVE = {uuid:u, which:'点', kind:'rd'};
  toast('地図をタップすると、産卵床をそこへ動かします（もう一度押すとやめます）');
  render();
}
/* 産卵床の位置を書き替える */
function reddMoveTo(u, la, lo, acc, source){
  if(!envFlushOk()) return false;
  const rec = DB.get(DB.key.rd, u);
  if(!rec || rec.deleted_at) return false;
  rec.latitude = +(+la).toFixed(6); rec.longitude = +(+lo).toFixed(6);
  rec.gps_accuracy = (acc===''||acc==null) ? '' : Math.round(acc);
  // 位置の決め方は、呼んだ側が渡したものだけ書く（中で推測しない）
  if(source) rec.position_source = source;
  // 位置が直ったので「位置が読めない」の理由は消す。ほかの理由と人の印は残る
  reddReviewApply(rec, reddReviewKeep(rec));
  if(!DB.put(DB.key.rd, rec)){
    toast('直せませんでした（端末の空き容量をご確認ください）');
    return false;
  }
  ENV_MOVE = null;
  toast(`${reddName(rec)} の位置を直しました`);
  return true;
}
/* いまいる場所へ直す */
function reddGrabHere(u){
  if(!envFlushOk()) return;
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした。地図で直すこともできます'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので直していません。地図で直してください`);
      return;
    }
    if(reddMoveTo(u, f.lat, f.lon, f.acc, 'GPS')) render();
  });
}

/* ---------- 物理環境の地図（主戦場・魚類調査アプリと同じ作り） ---------- */
SCREENS.envMap = (argStr)=>{

      </div>

        <div class="row" style="margin-bottom:6px">
          <div class="grow">物理環境 ${list.length}件</div>
        </div>
        ${list.length
          ? `<div class="seg" data-seg="envsel">${list.map(chip).join('')}</div>
             ${envPickOn() ? `

      if(DB.reddsOf(svUuid).length > REDD_DRAW_MAX){

/* ---------- 測点を続けて打つ ---------- */
function strVal(sel){ const el=$(sel); return el ? String(el.value).trim() : ''; }
/* 1点ずつ打って、押すたびに足していく。欄は空になり、そのまま次の点を打てる */
function addEnvPoint(u){
  if(!DB.liveUnit(u)) return;
  const d = numVal('#p_d'), v = numVal('#p_v');
  if(d==='' && v===''){ toast('水深か流速のどちらかは入れてください'); return; }
  const err = rangeCheck([['水深', strVal('#p_d'), 0, 2000], ['流速', strVal('#p_v'), 0, 10]]);
  if(err){ toast(err); return; }

  const pt = {depth_cm:d, velocity_ms:v, substrate:segVal('p_sub'), note:strVal('#p_note')};
  // いま立っている場所を添える。
  // 古い測位や粗すぎる位置は付けない（前の測点の場所が付くほうが困る）
  const fix = freshFix(20000);
  let msg = '';
  if(fix && fix.acc<=GPS_MAX_ACC){
    pt.latitude = +fix.lat.toFixed(6);
    pt.longitude = +fix.lon.toFixed(6);
    pt.gps_accuracy = Math.round(fix.acc);
    pt.position_source = 'GPS';
  }else{
    msg = fix ? '（位置は粗すぎるので付けていません）' : '（位置が取れていません）';
  }
  const rec = DB.liveUnit(u); if(!rec) return;
  const pts = envPoints(rec).slice();
  pts.push(pt);
  rec.env_points = pts;
  if(!DB.put(DB.key.un, rec)) return;      // 保存できていないので欄も消さない
  toast(`${pts.length}点目${msg}`);
  render();
}
function delEnvPoint(u, i){
  const rec = DB.liveUnit(u); if(!rec) return;
  const pts = envPoints(rec).slice();
  if(i<0 || i>=pts.length) return;
  if(!confirm(`${i+1}点目を消します。よろしいですか？`)) return;
  const rec2 = DB.liveUnit(u); if(!rec2) return;
  const pts2 = envPoints(rec2).slice();
  pts2.splice(i,1);
  rec2.env_points = pts2;
  if(DB.put(DB.key.un, rec2)){ toast('消しました'); render(); }
}

// 「なし」も実在する選択肢として受け取る（カバーの「なし」を空欄と取り違えないため）

/* 物理環境の地図から、メッシュの範囲を作る */
function meshCreate(svUuid){
  if(!DB.survey(svUuid)) return null;
  // 打ちかけを書けないうちは作らない。作ってから画面だけ止まると、
  // 押すたびに空の範囲が増えていく
  if(!envFlushOk()) return null;
  const rec = newUnit(svUuid, 'メッシュ');
  const pr = prefs();
  if(pr.mesh_row_m!==undefined) rec.mesh_row_m = pr.mesh_row_m;
  if(pr.mesh_col_m!==undefined) rec.mesh_col_m = pr.mesh_col_m;
  if(!DB.put(DB.key.un, rec)){ toast('作れませんでした（端末の空き容量をご確認ください）'); return null; }
  toast(`${rec.name} を作りました。四隅を押さえてください`);
  nav('meshSetup', rec.uuid);
  return rec;
}
