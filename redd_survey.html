<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>産卵床調査記録</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="stylesheet" href="./leaflet.css">
<style>
  :root{
    --bg:#0a0e14; --panel:#121a22; --panel2:#1a242e; --line:#2a3844;
    --fg:#e6eef5; --muted:#8496a6; --accent:#4aa3dd; --accent2:#2f6f9e;
    --warn:#e0a030; --danger:#d05555; --chip:#1c2a36;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:16px; line-height:1.5; overscroll-behavior:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{margin:0 0 .4em;}
  a{color:var(--accent);}
  /* 地図の上に置く記号ボタン（魚類調査アプリと同じ） */
  .mapicons a{display:flex!important;align-items:center;justify-content:center;
    width:36px;height:36px;color:#1b2531}
  .mapicons a.on{background:var(--accent);color:#04121f}
  .mapicons a.on svg{stroke:#04121f}
  button{font-family:inherit; font-size:16px;}
  .app{max-width:900px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ヘッダー */
  header{position:sticky; top:0; z-index:500; background:var(--panel);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;}
  .hbar{display:flex; align-items:center; gap:10px;}
  .htitle{font-weight:700; font-size:18px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .back{background:none; border:none; color:var(--accent); font-size:16px; padding:6px 4px; cursor:pointer;}
  .hsub{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted);}
  .hsub .pill{background:var(--chip); border:1px solid var(--line); border-radius:20px; padding:2px 10px;}
  .pill.ok{color:var(--accent);} .pill.warn{color:var(--warn);} .pill.off{color:var(--muted);}

  main{flex:1; padding:14px; padding-bottom:90px;}

  /* カード・リスト */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .card.tap{cursor:pointer;} .card.tap:active{background:var(--panel2);}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1;}
  .muted{color:var(--muted);} .small{font-size:13px;} .tiny{font-size:12px;}
  .badge{display:inline-block; border-radius:20px; padding:2px 10px; font-size:12px; background:var(--chip); border:1px solid var(--line);}
  .badge.status-未開始{color:var(--muted);}
  .badge.status-調査中{color:var(--accent); border-color:var(--accent2);}
  .badge.status-終了{color:var(--muted);}
  .badge.warn{color:var(--warn);}
  .pctwarn{color:var(--danger); font-weight:700;}
  .sp{height:8px;}
  .empty{text-align:center; color:var(--muted); padding:34px 10px; font-size:15px;}

  /* ボタン */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; cursor:pointer; width:100%; text-align:center;}
  .btn:active{background:var(--panel);}
  .btn[disabled]{opacity:.45; cursor:default; pointer-events:none;}
  .btn.primary{background:var(--accent2); border-color:var(--accent); color:#fff; font-weight:700;}
  .btn.ghost{background:none;}
  .btn.danger{color:var(--danger); border-color:#5a2e2e;}
  .btn.big{font-size:18px; padding:18px; font-weight:700;}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-grid.one{grid-template-columns:1fr;}

  /* フォーム */
  label.field{display:block; margin-bottom:14px;}
  label.field > .lab{display:block; font-size:13px; color:var(--muted); margin-bottom:5px;}
  input,select,textarea{width:100%; background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px;}
  textarea{min-height:70px; resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  .req{color:var(--accent);}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:8px 14px; cursor:pointer;}
  .seg button.on{background:var(--accent2); border-color:var(--accent); color:#fff;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sect{font-size:13px; color:var(--muted); font-weight:700; letter-spacing:.04em;
    margin:20px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line);}

  /* 集計テーブル */
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:600;}
  td.num,th.num{text-align:right;}
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 12px;}

  /* 地図 */
  #map{height:calc(100vh - 300px); min-height:320px; border-radius:var(--radius); border:1px solid var(--line);}
  #pickMap,#unitMap,#omap{height:320px; border-radius:var(--radius); border:1px solid var(--line);}
  .seg.basemap{margin-bottom:8px;}
  .seg.basemap button{padding:6px 12px; font-size:14px;}
  .leaflet-container{background:#0d1218;}
  .locate-btn{padding:8px 12px; font-size:14px; font-weight:700; line-height:1;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; cursor:pointer; box-shadow:0 1px 5px rgba(0,0,0,.4);}
  .locate-btn:active{background:var(--panel2);}
  .leaflet-popup-content{color:#111;}
  .chooser-pop .leaflet-popup-content{margin:10px 12px;}
  .chooser{display:flex; flex-direction:column; gap:6px; min-width:180px;}
  .chooser button{padding:10px 12px; font-size:15px; font-weight:700; text-align:left;
    background:#f2f4f6; color:#111; border:1px solid #c8ced4; border-radius:8px; cursor:pointer;}
  .chooser button.on{background:#e0a030; border-color:#e0a030; color:#fff;}
  .chooser button.put{background:#2a6fbf; border-color:#2a6fbf; color:#fff;}

  /* 写真 */
  .mediagrid{margin-top:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .mediathumb{position:relative; width:100%; aspect-ratio:1/1; background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .mediathumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .mediadel{position:absolute; top:4px; right:4px; width:26px; height:26px; line-height:1;
    background:rgba(0,0,0,.65); color:#fff; border:none; border-radius:50%; font-size:15px; cursor:pointer;}

  /* トースト */
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#000; color:#fff; padding:11px 18px; border-radius:24px; font-size:14px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:2000; max-width:90%;}
  #toast.show{opacity:.94;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hbar">
      <button class="back" id="backBtn" onclick="goBack()" style="display:none">‹ 戻る</button>
      <div class="htitle" id="title">産卵床調査記録</div>
    </div>
    <div class="hsub" id="sub"></div>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="./leaflet.js"></script>
<!-- 地図を指2本でひねって回すための部品（魚類調査アプリと同じもの） -->
<script src="./vendor/leaflet-rotate.js"></script>
<!-- ============================================================
     この中の script は3つに分かれている（読みやすさのため。動きは1つのときと同じ）
       1. 土台     … 小道具・保存層・写真・選択肢・画面遷移・GPS
       2. 記録する … ホーム／調査／区間／産卵床／メモ／物理環境／集計
       3. 見せる   … 地図・書き出し・ゴミ箱・起動
     外部ファイルには分けない。同梱ファイルが増えるとオフラインで起動しない
     事故が増え、動作確認の仕組み（tests/harness.js）も作り直しになるため。
     ============================================================ -->
<script>
/* ============================================================
   産卵床調査記録アプリ
   サケ科魚類の産卵床（レッド）調査を現場のスマホだけで記録する。
   保存は端末内のみ（localStorage / IndexedDB）。外部へ自動送信しない。
   ============================================================ */
const APP_VERSION = 'v30';   // sw.js の CACHE 名と揃える（deploy.sh が照合する）
// いつの版か・何を直したか。画面に出して「自分の端末がどれか」を分かるようにする。
// 版を上げるときは、この2つも一緒に直す
const APP_DATE = '2026-09-09';
const APP_NOTE = 'PC（QGIS）で位置合わせしたドローン写真を取り込んで、地図に重ねられます'
  + '（ホームの「ドローン写真」から。地図の上のボタンで出す／消す）';

/* ---------- 小道具 ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function uuid(){
  if(crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}
function nowISO(){ return new Date().toISOString(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function localDatetimeValue(d){ d=d||new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function dateValue(d){ d=d||new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fmtDate(s){ if(!s) return '—'; return String(s).slice(0,10); }
function fmtTime(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—';
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }
// 数値入力の取り出し。空欄は '' のまま返す（0 と未入力を区別するため）
function numVal(sel){ const el=$(sel); if(!el) return ''; const v=String(el.value).trim();
  if(v==='') return ''; const n=parseFloat(v); return isNaN(n)?'':n; }

/* 数の取り出し（値から）。空欄は '' のまま返す。0 を未入力と取り違えないため。
   水深0（干出）・流速0（淀み）・ホッチャレ0尾 は「測った0」で、未入力ではない。
   parseFloat は '12abc' を 12 として通してしまうので、全体が数のときだけ受ける */
function numOf(v){
  if(v===null || v===undefined) return '';
  const s=String(v).trim(); if(s==='') return '';
  if(!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return '';
  const n=parseFloat(s);
  return isFinite(n) ? n : '';
}
/* 個数の受け取り。空欄は ''、0以上の整数だけ数として返す。
   それ以外（負の数・小数・'12abc'）は null を返して「おかしい」と伝える */
function countOf(v){
  if(v===null || v===undefined) return '';
  const s=String(v).trim(); if(s==='') return '';
  if(!/^\d+$/.test(s)) return null;
  const n=parseInt(s,10);
  return Number.isSafeInteger(n) ? n : null;
}
/* 空欄を落とさずに数だけ集める。filter(v=>v) と書くと 0 が消える */
function nums(arr){ return (arr||[]).map(numOf).filter(v=>v!==''); }
/* 数の範囲を見る。おかしいものがあれば、その説明を返す。無ければ空文字。
   負の距離や100を超える割合が入ると、面積や河床材料の割合が静かに壊れる */
function rangeCheck(list){ return rangeCheckAll(list)[0] || ''; }
/* 同じ検査で、おかしいものを全部並べて返す（要確認の理由に使う）。
   最初の1件だけだと、直したらまた別の理由が出て、何度も往復させてしまう */
function rangeCheckAll(list){
  const out=[];
  for(const it of list){
    const label=it[0], v=it[1], lo=it[2], hi=it[3], whole=it[4];   // whole: 整数だけ（個体数）
    if(v===null || v===undefined || String(v).trim()==='') continue;   // 空白だけも空欄
    const n=numOf(v);
    if(n==='' || !isFinite(n)) out.push(`${label}は数で入れてください`);
    else if(n<lo || n>hi) out.push(`${label}は ${lo}〜${hi} の間で入れてください（いま ${n}）`);
    else if(whole && !Number.isInteger(n)) out.push(`${label}は整数で入れてください（いま ${n}）`);
  }
  return out;
}
/* 産卵床の数の欄の、受け入れる範囲。検査と集計で同じ表を見る。
   ここを2か所に持つと「検査は通るのに集計から外れる」ちぐはぐが起きる */
const REDD_RANGE = {
  length_cm:[0,2000], width_cm:[0,2000], area_m2:[0,400],
  water_temp_c:[-5,45], intragravel_temp_c:[-5,45], temp_depth_cm:[0,500],
  female_n:[0,9999], male_n:[0,9999], carcass_n:[0,9999] };
const ENV_RANGE = { depth_cm:[0,2000], velocity_ms:[0,10] };
// 個体数は整数だけ。1.5尾を「要確認」にし、集計にも入れない
const REDD_WHOLE = { female_n:true, male_n:true, carcass_n:true };
function reddRangeItem(k, v){ return [REDD_LABEL[k], v, REDD_RANGE[k][0], REDD_RANGE[k][1], !!REDD_WHOLE[k]]; }
const REDD_LABEL = {
  length_cm:'長さ', width_cm:'幅', area_m2:'面積', water_temp_c:'河川水温', intragravel_temp_c:'河床内水温',
  temp_depth_cm:'河床内を測った深さ', female_n:'雌', male_n:'雄', carcass_n:'ホッチャレ' };
function inRange(n, rg){ return !rg || (n>=rg[0] && n<=rg[1]); }
/* 画面ごとの覚えごと（色分けの基準・折りたたみの開閉など） */
function prefs(){ try{ return JSON.parse(localStorage.getItem('rd_prefs')||'{}')||{}; }catch(e){ return {}; } }
function prefSet(k,v){ const p=prefs(); p[k]=v; try{ localStorage.setItem('rd_prefs', JSON.stringify(p)); }catch(e){} }
function foldOpen(key, defOpen){ const v=(prefs().folds||{})[key]; return v===undefined ? !!defOpen : !!v; }
function foldSet(key, open){ const f=Object.assign({}, prefs().folds||{}); f[key]=!!open; prefSet('folds', f); }
function foldHtml(key, title, head, inner, defOpen){
  return `<details class="fold card" data-fold="${esc(key)}" ${foldOpen(key,defOpen)?'open':''}
      ontoggle="foldSet('${esc(key)}', this.open)">
    <summary><span class="ftitle">${esc(title)}</span>${head||''}</summary>
    <div class="fbody">${inner}</div>
  </details>`;
}

/* ============================================================
   保存層（localStorage）
   キーの頭は rd_ 。同じ場所に別アプリ（鳥類調査等）があってもデータが混ざらないようにする。
   削除は deleted_at を立てる論理削除のみ。完全消去はゴミ箱から明示的に行う。
   ============================================================ */
const DB = {
  key:{ sv:'rd_surveys', re:'rd_reaches', rd:'rd_redds', nt:'rd_notes', un:'rd_units',
        mc:'rd_meshcells' },
  load(k){ try{ const a=JSON.parse(localStorage.getItem(k)||'[]'); return Array.isArray(a)?a:[]; }
           catch(e){ return []; } },
  // バックアップ・整合性確認用。壊れていたら例外にして「空」と誤認させない
  loadRaw(k){ const a=JSON.parse(localStorage.getItem(k)||'[]');
    if(!Array.isArray(a)) throw new Error('broken: '+k); return a; },
  save(k,a){
    try{ localStorage.setItem(k, JSON.stringify(a)); return true; }
    catch(e){ toast('端末の保存容量がいっぱいです。書き出してから古い調査を消してください'); return false; }
  },
  upsert(k,obj){
    const a=this.load(k); const i=a.findIndex(x=>x.uuid===obj.uuid);
    obj.updated_at=nowISO();
    if(i>=0){ a[i]=Object.assign({},a[i],obj); } else { obj.created_at=obj.created_at||nowISO(); a.push(obj); }
    return this.save(k,a) ? obj : null;
  },
  // 丸ごと置き換える保存。upsert は「併合」なので、項目を消したいとき
  // （カバーを3枠から1枠に減らす・つなぎ先を外す）に古い値が残ってしまう。
  // 物理環境の処理はこちらを使う
  put(k,obj){
    const a=this.load(k); const i=a.findIndex(x=>x.uuid===obj.uuid);
    obj.updated_at=nowISO();
    if(i>=0){ obj.created_at=obj.created_at||a[i].created_at||nowISO(); a[i]=obj; }
    else { obj.created_at=obj.created_at||nowISO(); a.push(obj); }
    return this.save(k,a) ? obj : null;
  },
  get(k,u){ return this.load(k).find(x=>x.uuid===u) || null; },
  // 保存に失敗したら false を返す。呼び出し側で「できたことにしない」ため
  softDelete(k,u,by){ const a=this.load(k); const o=a.find(x=>x.uuid===u);
    if(!o) return true;
    o.deleted_at=nowISO(); o.updated_at=nowISO();
    if(by) o.deleted_by=by; else delete o.deleted_by;   // 親と一緒に消したかを覚えておく
    return this.save(k,a); },
  restore(k,u){ const a=this.load(k); const o=a.find(x=>x.uuid===u);
    if(!o) return true;
    delete o.deleted_at; delete o.deleted_by; o.updated_at=nowISO();
    return this.save(k,a); },
  hardDelete(k,u){ return this.save(k, this.load(k).filter(x=>x.uuid!==u)); },

  alive(k){ return this.load(k).filter(x=>!x.deleted_at); },
  deleted(k){ return this.load(k).filter(x=>x.deleted_at); },

  surveys(){ return this.alive(this.key.sv).sort((a,b)=>
    String(b.survey_date||'').localeCompare(String(a.survey_date||'')) ||
    String(b.created_at||'').localeCompare(String(a.created_at||''))); },
  survey(u){ const s=this.get(this.key.sv,u); return (s&&!s.deleted_at)?s:null; },
  reachesOf(sv){ return this.alive(this.key.re).filter(x=>x.survey_uuid===sv)
    .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||''))); },
  reddsOf(sv){ return this.alive(this.key.rd).filter(x=>x.survey_uuid===sv)
    .sort((a,b)=>String(b.observed_at||'').localeCompare(String(a.observed_at||''))); },
  notesOf(sv){ return this.alive(this.key.nt).filter(x=>x.survey_uuid===sv)
    .sort((a,b)=>String(b.recorded_at||'').localeCompare(String(a.recorded_at||''))); },
  unitsOf(sv){ return this.alive(this.key.un).filter(x=>x.survey_uuid===sv)
    .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||''))); },
  // 物理環境の記録が生きているか（親の調査ごと消えていないか）
  liveUnit(u){ const x=this.get(this.key.un,u); if(!x||x.deleted_at) return null;
    return this.survey(x.survey_uuid) ? x : null; },
  // メッシュのマス。親が消えていれば空を返すので、削除を親子に広げなくてよい
  meshCellsOf(u){ if(!this.liveUnit(u)) return [];
    return this.alive(this.key.mc).filter(x=>x.unit_uuid===u)
      .sort((a,b)=> (a.row-b.row) || (a.col-b.col)); },
  meshCellsOfSurvey(sv){ const live=new Set(this.unitsOf(sv).map(x=>x.uuid));
    return this.alive(this.key.mc).filter(x=>live.has(x.unit_uuid))
      .sort((a,b)=> (a.row-b.row) || (a.col-b.col)); },
};

/* ============================================================
   写真の保存（IndexedDB）
   写真そのものは localStorage に入らないので IndexedDB に置き、
   記録側には「どの写真か」を示す小さな情報だけを持たせる。
   ============================================================ */
// 版2（v30）: kind のインデックスを足した（ドローン写真だけを、写真の実体を読まずに列挙するため）
const MEDIA_DB_NAME='redd_survey_media', MEDIA_DB_VER=2, MEDIA_STORE='photo';
let _mediaDB=null, _mediaDBOpening=null;
/* 接続は1本だけ。起動時は写真の掃除とドローン写真の読み込みが同時にここへ来るので、
   開いている途中の約束（Promise）も持ち、同時の呼び出しには同じものを返す
   （別々に開くと接続が2本になり、片方が閉じても次の版への更新が blocked のままになる） */
function openMediaDB(){
  if(_mediaDB) return Promise.resolve(_mediaDB);
  if(_mediaDBOpening) return _mediaDBOpening;
  // この要求の約束を自分で持ち、共有の _mediaDBOpening を片付けるのは「いま自分のものであるとき」だけ。
  // blocked のあと再試行が始まっているのに、古い要求の onerror が新しい約束まで消してはいけない
  let mine = null;
  const release = ()=>{ if(_mediaDBOpening === mine) _mediaDBOpening = null; };
  mine = new Promise((res,rej)=>{
    const q=indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VER);
    let abandoned = false;   // blocked で諦めたあとに開けても、その接続は使わずに閉じる
    q.onupgradeneeded=()=>{ const db=q.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE,{keyPath:'id'});
      // 既存の写真は kind を持たないのでインデックスに入らない（そのままでよい）
      try{
        const st=q.transaction.objectStore(MEDIA_STORE);
        if(!st.indexNames.contains('kind')) st.createIndex('kind','kind',{unique:false});
      }catch(e){ console.error(e); }
    };
    q.onsuccess=()=>{
      const db=q.result;
      if(abandoned){ try{ db.close(); }catch(e){} return; }
      // 別のタブが新しい版で開こうとしたら、自分の接続を閉じて道を空ける（閉じないと相手が永久に待つ）
      db.onversionchange=()=>{ try{ db.close(); }catch(e){} if(_mediaDB===db) _mediaDB=null; };
      _mediaDB=db; release();
      res(db);
    };
    // 古い版で開いているタブが閉じてくれないときは、待ち続けずに失敗にする（次に呼んだときにもう一度開く）
    q.onblocked=()=>{ abandoned=true; release(); rej(new Error('blocked')); };
    q.onerror=()=>{ release(); rej(q.error); };
  });
  _mediaDBOpening = mine;
  return mine;
}
// 書き込みは tx.oncomplete まで待つ。ここで待たないと「保存したのに無い」が起きる
function idbDo(mode, fn){
  return openMediaDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(MEDIA_STORE, mode);
    let out;
    const r=fn(tx.objectStore(MEDIA_STORE));
    if(r && typeof r.then==='function'){ /* 使わない */ }
    else if(r){ r.onsuccess=()=>{ out=r.result; }; }
    tx.oncomplete=()=>res(out);
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error);
  }));
}
const PhotoDB = {
  put(rec){ return idbDo('readwrite', st=>st.put(rec)); },
  get(id){ return idbDo('readonly', st=>st.get(id)); },
  del(id){ return idbDo('readwrite', st=>st.delete(id)); },
  allIds(){ return idbDo('readonly', st=>st.getAllKeys()); },
  // 種類（kind）で絞って読む。インデックスが無ければ（版の更新が通っていないとき）全部読んで絞る
  byKind(kind){
    return idbDo('readonly', st=>st.index('kind').getAll(kind))
      .catch(e=>{
        // 代替に回すのは「インデックスが無い」ときだけ（例外の name で見る。文言では見ない）。
        // blocked などはそのまま失敗にする（開き直しを重ねない）
        if(!(e && e.name === 'NotFoundError')) throw e;
        return idbDo('readonly', st=>st.getAll()).then(all=>(all||[]).filter(r=>r && r.kind===kind));
      });
  },
  // どこからも参照されていない写真を消す。
  // 参照元が1つでも読めなければ何もしない（消しすぎ防止）
  async gc(){
    let refs;
    try{
      refs = new Set();
      // 写真を持ちうるコレクションを取りこぼすと、その写真が起動時に消える。
      // 個別列挙ではなく、保存しているキーを全部見る
      Object.keys(DB.key).forEach(kk=>{
        DB.loadRaw(DB.key[kk]).forEach(x=>(x.photos||[]).forEach(p=>p&&p.id&&refs.add(p.id)));
      });
      // メモの控えから使っている写真も、使用中とみなす。
      // 数えないと、開き直したときに写真の実体だけ消えて戻せなくなる。
      // ここは読めなかったら例外にする。読めないのを「参照なし」と取り違えると、
      // 使っている写真を消してしまう（消したものは戻せない）
      const d = editDraftsStrict();
      Object.keys(d).forEach(k=>{
        const x = d[k]; if(!x) return;
        (x.photos||[]).forEach(pp=>pp&&pp.id&&refs.add(pp.id));
      });
    }catch(e){ return; }
    const ids = await this.allIds();
    for(const id of ids){
      if(refs.has(id)) continue;
      // ドローン写真（kind:'ortho'）は同じ置き場にあるが、記録から参照されない。
      // 消すのは人が「削除」を押したときだけ（掃除では触らない）。
      // 読めなかったら（一時的な失敗でも）掃除そのものをやめる。
      // 読めないのを「ドローン写真ではない」と取り違えると、正本を消してしまう
      let rec = null; try{ rec = await this.get(id); }catch(e){ return; }
      if(rec && rec.kind === 'ortho') continue;
      await this.del(id);
    }
  }
};

// 現場写真はそのままだと1枚数MBあり端末を圧迫するので、長辺1600pxのJPEGに縮める
async function shrinkImage(file){
  if(!/^image\//.test(file.type||'')) return file;
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
    if(scale>=1 && file.size < 1.5*1024*1024){ if(bmp.close) bmp.close(); return file; }
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return (blob && blob.size < file.size) ? blob : file;
  }catch(e){ return file; }   // 変換できない端末では元のまま保存する
}

/* 写真パネル（産卵床・メモで共用。SCREENS._photos が今開いている記録の写真一覧） */
async function pickPhotos(input){
  const files = Array.from(input.files||[]);
  input.value='';
  if(!files.length) return;
  // 縮小には時間がかかる。始めたときの持ち主を覚えておき、
  // 戻ってきたときに別の記録へ移っていたら、そちらの写真の並びには触らない
  // （触ると、Aで撮った写真がBに付いてしまう）
  const mark = envFormMark();
  const owner = mark.uuid;
  toast('写真を取り込んでいます…');
  // 途中で画面に足すと、2枚目の縮小中に切り替えたとき
  // 1枚目だけがどこにも付かず迷子になる。全部そろってから一度に足す
  const done = [];
  let ok=0, ng=0;
  const moved = ()=>{ toast('別の記録へ移ったので、写真は付けませんでした'); };
  for(const f of files){
    try{
      const blob = await shrinkImage(f);
      // もう別の記録へ移っていれば、書き込みもしない
      if(!envFormSame(mark)){ moved(); return; }
      const ext = blobExt(blob);
      const id = uuid();
      await PhotoDB.put({ id, blob, ext, size:blob.size, added_at:nowISO() });
      // 実体は残るが参照は付けない。使われなければ gc が片付ける
      if(!envFormSame(mark)){ moved(); return; }
      done.push({ id, ext, size:blob.size });
      ok++;
    }catch(e){ console.error(e); ng++; }
  }
  if(!envFormSame(mark)){ moved(); return; }
  if(!done.length){ if(ng) alert('写真を保存できませんでした（端末の空き容量を確認してください）'); return; }
  SCREENS._photos = (SCREENS._photos||[]).concat(done);
  renderPhotoPanel();
  // 縮小に時間がかかっても取りこぼさないよう、ここで記録に付ける
  envPhotoTouch(owner);
  if(ng) alert(`写真 ${ok}枚を追加しました。${ng}枚は保存できませんでした（端末の空き容量を確認してください）`);
  else toast(ok+'枚を追加しました');
}
// 実際の中身に合った拡張子を付ける。中身がPNGなのに .jpg だと開けないソフトがある
function blobExt(blob){
  const t=(blob&&blob.type)||'';
  if(t.includes('png')) return 'png';
  if(t.includes('webp')) return 'webp';
  if(t.includes('heic')||t.includes('heif')) return 'heic';
  return 'jpg';
}
// 写真そのものはここでは消さない。保存せずに戻った場合に、記録が
// 「無い写真」を指してしまうため。実体は使われなくなった時点で gc() が片付ける
function delPhoto(id){
  if(!confirm('この写真を外しますか？（保存すると反映されます）')) return;
  SCREENS._photos = (SCREENS._photos||[]).filter(p=>p.id!==id);
  renderPhotoPanel();
  envPhotoTouch();   // 物理環境では、外したことも その場で記録に反映する
}
function revokePhotoUrls(){
  (SCREENS._photoUrls||[]).forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
  SCREENS._photoUrls=[];
}
// 写真を記録に付けられなかった相手。付くまで画面を先へ進めない
// （進めてしまうと、足した写真の在りかも、外したことも失われる）
let ENV_PHOTO_PENDING = '';
// 物理環境の入力欄では、写真を足した／外したその場で保存する。
// 産卵床やメモの画面（ENV_FORM が空）では何もしない
function envPhotoTouch(owner){
  const target = owner || (typeof ENV_FORM!=='undefined' ? ENV_FORM : '');
  if(!target) return true;
  // 持ち主のいない画面（メモなど）では何もしない。抜けないと、他人の記録を
  // 探しに行って見つからず、画面から出られなくなる
  if(!owner && typeof ENV_FORM_KIND!=='undefined'
     && ENV_FORM_KIND !== 'un' && ENV_FORM_KIND !== 'rd') return true;
  let ok = false;
  try{ ok = envSavePhotosNow(target); }catch(e){ ok = false; }
  if(ok){
    if(ENV_PHOTO_PENDING === target) ENV_PHOTO_PENDING = '';
    return true;
  }
  ENV_PHOTO_PENDING = target;
  toast('写真を記録に付けられませんでした。端末の空き容量をご確認ください'
    + '（いま足した写真を外して元の状態に戻せば、先へ進めます）');
  return false;
}
async function renderPhotoPanel(){
  const box=$('#photoGrid'); if(!box) return;
  revokePhotoUrls();
  const list = SCREENS._photos||[];
  if(!list.length){ box.innerHTML=''; return; }
  const parts=[];
  for(const p of list){
    let rec=null; try{ rec=await PhotoDB.get(p.id); }catch(e){}
    if(!rec||!rec.blob){ continue; }
    const url=URL.createObjectURL(rec.blob);
    SCREENS._photoUrls=(SCREENS._photoUrls||[]).concat([url]);
    parts.push(`<div class="mediathumb"><img src="${url}" alt="写真">
      <button class="mediadel" onclick="delPhoto('${p.id}')" title="削除">×</button></div>`);
  }
  box.innerHTML = parts.join('');
}
function photoPanelHtml(){
  return `<input type="file" id="fPhotoIn" accept="image/*" capture="environment" multiple
            style="display:none" onchange="pickPhotos(this)">
    <button class="btn" onclick="document.getElementById('fPhotoIn').click()">写真を追加（カメラ／端末から）</button>
    <div class="mediagrid" id="photoGrid"></div>`;
}

/* ============================================================
   ドローン写真（オルソ画像）。PC（QGIS）で位置合わせした画像を、地図に重ねる。
   アプリは取り込み・表示・透過・出す/消す・削除だけをする（位置合わせはしない）。
   正本は IndexedDB（写真と同じ photo ストア）の1レコード。実体（blob）と情報（名前・境界・画素数）を
   同じレコードに持ち、kind:'ortho' で写真と見分ける。localStorage の台帳は持たない
   （実体と台帳が別々だと、壊れ・2つのタブ・写真の掃除との競合で片方だけが消える）。
   画面用には、起動時と取り込み・削除のたびに読み直した写し ORTHO_LIST を使う。
   バックアップには入れない（PC に元がある。大きい）。
   ============================================================ */
const ORTHO_MAX_PX = 4096;        // 長辺。これより大きい画像は縮める（縮められなければ断る）
const ORTHO_SAFE_PX = 16777216;   // 縮めるために端末で展開してよい総画素数（4096×4096。iOS の canvas の上限と同じ）
const ORTHO_MAX_KM = 30;          // 1枚の一辺の上限。これを超えるのは座標系の取り違えとみなす
const ORTHO_JP = {s:20, n:46, w:122, e:154};   // 日本の箱。外なら座標系の取り違え
const ORTHO_OPACITY = {'濃い':1, '半分':0.5, '薄い':0.25};
const ORTHO_WORLD_EXT = /\.(pgw|jgw|wld)$/i;
let ORTHO_LIST = [];                     // 画面用の写し（正本は IndexedDB）
let ORTHO_URLS = {}, ORTHO_GONE = {};    // id → 表示用URL／消した id（読み込み中に消したとき URL を作らないため）
function orthoList(){ return ORTHO_LIST.slice(); }
/* レコードが揃っているか。揃っていなければ「壊れている」として地図に出さず、削除だけできるようにする */
function orthoBlobOk(b){
  // 表示用URLを作れるものだけ。Blob が無い環境（動作確認）では、オブジェクトであれば可とする
  if(typeof Blob !== 'undefined') return b instanceof Blob;
  return !!b && typeof b === 'object';
}
function orthoValid(o){
  return !!(o && typeof o.id === 'string' && o.id && o.bounds && orthoBoundsCheck(o.bounds) === ''
    && numOf(o.w) !== '' && o.w > 0 && numOf(o.h) !== '' && o.h > 0 && orthoBlobOk(o.blob));
}
function orthoMeta(rec){
  if(!rec || rec.kind !== 'ortho' || typeof rec.id !== 'string' || !rec.id) return null;
  const broken = !orthoValid(rec);
  return { id:rec.id, broken, name:rec.name||'', bounds:rec.bounds||null, w:rec.w, h:rec.h,
           size:rec.size||0, type:rec.type||'', shrunk:!!rec.shrunk, added_at:rec.added_at||'' };
}
/* 正本から読み直す。読めなければ前の写しを残す（空と取り違えて「無い」と見せない） */
async function orthoReload(){
  const recs = (await PhotoDB.byKind('ortho')) || [];   // 現場写真の実体は読まない
  const list = recs.map(orthoMeta).filter(Boolean)
    .sort((x,y)=> String(x.added_at).localeCompare(String(y.added_at)));
  ORTHO_LIST = list;
  return { list, recs };
}
/* ワールドファイル（6行: A D B E C F）。回転（D・B）があれば null。
   BOM・CRLF・末尾の空行は許す。A は正、E は負（北が上） */
function parseWorldFile(text){
  const v = String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(s=>s.trim()).filter(s=>s!=='');
  if(v.length !== 6) return null;
  const n = v.map(Number);
  if(n.some(x=>!isFinite(x))) return null;
  const [a,d,b,e,c,f] = n;
  if(!(a>0) || !(e<0)) return null;
  const tol = Math.abs(a)*1e-6;
  if(Math.abs(d) > tol || Math.abs(b) > tol) return null;
  return {a,d,b,e,c,f};
}
/* 緯度経度（EPSG:4326）のままの画像は受けない。四隅は合っても、Leaflet はメルカトルの長方形に
   線形に引き伸ばすので、画像の中ほどが行ごとにずれる。EPSG:3857 で書き出してもらう */
function orthoIsDegrees(wf){ return !!wf && Math.abs(wf.c) <= 180 && Math.abs(wf.f) <= 90; }
/* Webメルカトル（EPSG:3857 のメートル）→ 緯度経度 */
const MERC_R = 6378137;
function merc2ll(x, y){
  const lon = x / MERC_R * 180 / Math.PI;
  const lat = (2*Math.atan(Math.exp(y/MERC_R)) - Math.PI/2) * 180 / Math.PI;
  return [lat, lon];
}
/* 画像の境界（緯度経度）。ワールドファイルの C・F は「左上ピクセルの中心」なので半ピクセル戻す。
   メートル（3857）だけを受ける。度のものは null */
function orthoBoundsOf(wf, w, h){
  if(!wf || !(w>0) || !(h>0) || orthoIsDegrees(wf)) return null;
  const west = wf.c - wf.a/2, north = wf.f - wf.e/2;
  const east = west + wf.a*w, south = north + wf.e*h;
  const nw = merc2ll(west, north), se = merc2ll(east, south);
  return {s:se[0], w:nw[1], n:nw[0], e:se[1]};
}
/* 境界が使えるか。使えなければ理由（空なら使える）。
   平面直角座標や UTM を 3857 と取り違えると、日本の外の「もっともらしい」場所に置かれて気づけない */
function orthoBoundsCheck(b){
  if(!b || [b.s,b.w,b.n,b.e].some(x=>typeof x!=='number' || !isFinite(x))) return '位置を読み取れませんでした';
  if(!(b.s < b.n && b.w < b.e)) return '位置を読み取れませんでした';
  if(b.s < ORTHO_JP.s || b.n > ORTHO_JP.n || b.w < ORTHO_JP.w || b.e > ORTHO_JP.e)
    return '位置が日本の外になります。QGIS で EPSG:3857 に直して書き出してください';
  const km = Math.max(distMeters([b.s,b.w],[b.s,b.e]), distMeters([b.s,b.w],[b.n,b.w])) / 1000;
  if(km > ORTHO_MAX_KM) return `1枚が ${ORTHO_MAX_KM}km 四方を超えています。座標系を確かめてください`;
  return '';
}
function orthoIsImage(f){ return /^image\//.test((f && f.type)||'') || /\.(png|jpe?g)$/i.test((f && f.name)||''); }
function orthoBaseName(name){ return String(name||'').replace(/^.*[\\/]/,'').replace(/\.[^.]+$/,'').toLowerCase(); }
/* PNG／JPEG の先頭から幅と高さを読む（展開しない。大きな画像を丸ごと展開するとメモリで落ちる） */
function orthoHeaderSize(u8){
  if(!u8 || u8.length < 24) return null;
  const be32 = i => ((u8[i]<<24) | (u8[i+1]<<16) | (u8[i+2]<<8) | u8[i+3]) >>> 0;
  // PNG: 8バイトの署名 → 最初の区画は必ず IHDR（幅・高さは 16〜23 バイト目）
  const PNG_SIG = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A];
  if(PNG_SIG.every((v,i)=>u8[i]===v)){
    const ihdr = u8[12]===0x49 && u8[13]===0x48 && u8[14]===0x44 && u8[15]===0x52;
    if(!ihdr || be32(8) !== 13) return null;
    const w = be32(16), h = be32(20);
    return (w>0 && h>0) ? {w, h, type:'png'} : null;
  }
  // JPEG: FFD8 のあと、区画をたどって SOF（FFC0〜FFCF。C4・C8・CC は除く）を探す
  if(u8[0]===0xFF && u8[1]===0xD8){
    let i = 2;
    while(i + 9 < u8.length){
      if(u8[i] !== 0xFF){ i++; continue; }
      const m = u8[i+1];
      if(m === 0xFF){ i++; continue; }                                   // 詰め物
      if(m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)){ i += 2; continue; }   // 長さの無い区画
      if(m === 0xD9 || m === 0xDA) return null;                          // 画像データに入った（SOF が無い）
      const len = (u8[i+2]<<8) | u8[i+3];
      if(m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC){
        const h = (u8[i+5]<<8) | u8[i+6], w = (u8[i+7]<<8) | u8[i+8];
        return (w>0 && h>0) ? {w, h, type:'jpg'} : null;
      }
      if(len < 2) return null;
      i += 2 + len;
    }
    return null;
  }
  return null;
}
/* 展開できるか。createImageBitmap があればそれで（すぐ閉じる）、無ければ Image で */
async function orthoCanDecode(file){
  if(typeof createImageBitmap === 'function'){
    try{ const bm = await createImageBitmap(file); if(bm && bm.close) bm.close(); return !!bm; }catch(e){ return false; }
  }
  try{ await orthoLoadImage(file); return true; }catch(e){ return false; }
}
function orthoLoadImage(file){
  return new Promise((res, rej)=>{
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(u); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error('画像を読めませんでした')); };
    img.src = u;
  });
}
/* 画素数は先頭だけ読んで調べ、長辺が上限以下ならそのまま（再圧縮しない。透明な PNG を壊さない）。
   超えていれば、最初から縮小の指定つきで展開する。指定が効かない端末では、
   安全な総画素数のときだけ普通に展開して縮め、それより大きければ断る。境界は元の画素数で計算する */
async function orthoPrepare(file){
  const head = new Uint8Array(await file.slice(0, 1024*1024).arrayBuffer());
  const dim = orthoHeaderSize(head);
  if(!dim) throw new Error('画像の大きさを読めませんでした（PNG か JPEG を選んでください）');
  const w = dim.w, h = dim.h;
  if(Math.max(w,h) <= ORTHO_MAX_PX){
    // そのまま保存する前に、展開できる画像であることを確かめる（先頭だけ残った壊れた画像を弾く）。
    // 長辺が上限以下なら総画素数も安全な範囲なので、ここで展開してよい
    if(!(await orthoCanDecode(file))) throw new Error('画像が壊れているか、この端末では開けません');
    return {blob:file, w, h, shrunk:false};
  }
  const k = ORTHO_MAX_PX / Math.max(w,h);
  const tw = Math.max(1, Math.round(w*k)), th = Math.max(1, Math.round(h*k));
  const type = dim.type === 'png' ? 'image/png' : 'image/jpeg';
  const tooBig = new Error(`この端末では縮小できませんでした。PC で長辺 ${ORTHO_MAX_PX}px 以下にして書き出してください`);
  let srcImg = null;
  if(typeof createImageBitmap === 'function'){
    try{ srcImg = await createImageBitmap(file, {resizeWidth:tw, resizeHeight:th, resizeQuality:'high'}); }
    catch(e){ srcImg = null; }
    // 縮小の指定を黙って無視する端末がある。返った大きさで見る
    if(srcImg && srcImg.width !== tw){ if(srcImg.close) srcImg.close(); srcImg = null; }
  }
  if(!srcImg){
    if(w*h > ORTHO_SAFE_PX) throw tooBig;     // 丸ごと展開すると落ちる大きさ
    srcImg = await orthoLoadImage(file);
  }
  const cv = document.createElement('canvas'); cv.width = tw; cv.height = th;
  let blob = null;
  try{
    cv.getContext('2d').drawImage(srcImg, 0, 0, tw, th);
    blob = await new Promise(res=>cv.toBlob(res, type, 0.85));
  }catch(e){ blob = null; }
  if(srcImg && srcImg.close) srcImg.close();
  if(!blob) throw tooBig;
  return {blob, w, h, shrunk:true};
}
/* 取り込み。画像1つ＋ワールドファイル1つを同時に選ぶ（同じ名前のもの）。
   file input に accept を付けない（iPhone では .pgw が選べなくなる）ので、中身で仕分ける。
   書くのは正本の1レコードだけ（途中で失敗しても、半端なものは残らない） */
async function orthoImport(input){
  const files = Array.from((input && input.files) || []);
  if(input) input.value = '';
  const imgs = files.filter(orthoIsImage), others = files.filter(f=>!orthoIsImage(f));
  if(imgs.length !== 1 || others.length !== 1){
    alert('画像（PNG/JPG）とワールドファイル（.pgw/.jgw/.wld）の2つを一緒に選んでください'); return false;
  }
  const img = imgs[0], wfile = others[0];
  if(!ORTHO_WORLD_EXT.test(wfile.name||'')){
    alert(`ワールドファイルは .pgw / .jgw / .wld です（選んだのは「${wfile.name||''}」）`); return false;
  }
  if(orthoBaseName(img.name) !== orthoBaseName(wfile.name)){
    alert(`画像とワールドファイルの名前が違います（「${img.name||''}」と「${wfile.name||''}」）。`
      + 'a.png と a.pgw のように、同じ名前の組を選んでください'); return false;
  }
  let wf = null;
  try{ wf = parseWorldFile(await wfile.text()); }catch(e){ wf = null; }
  if(!wf){ alert('ワールドファイルを読めませんでした。北が上（回転なし）の6行の数字であることを確かめてください'); return false; }
  if(orthoIsDegrees(wf)){
    alert('緯度経度（EPSG:4326）のままの画像は使えません。QGIS で EPSG:3857（Webメルカトル）に直して書き出してください'); return false;
  }
  toast('読み込んでいます…');
  let prep = null;
  try{ prep = await orthoPrepare(img); }
  catch(e){ alert(e && e.message ? e.message : '画像を読めませんでした'); return false; }
  const bounds = orthoBoundsOf(wf, prep.w, prep.h);
  const why = orthoBoundsCheck(bounds);
  if(why){ alert(why); return false; }
  const id = uuid();
  const ext = prep.blob.type === 'image/png' || /\.png$/i.test(img.name||'') ? 'png' : 'jpg';
  const rec = { id, kind:'ortho', blob:prep.blob, ext, size:prep.blob.size, type:prep.blob.type||'',
                name:String(img.name||'').replace(/\.[^.]+$/,''), bounds, w:prep.w, h:prep.h,
                shrunk:!!prep.shrunk, added_at:nowISO() };
  try{ await PhotoDB.put(rec); }
  catch(e){ alert('保存できませんでした（端末の空き容量を確かめてください）'); return false; }
  if(!ORTHO_URLS[id]){ try{ ORTHO_URLS[id] = URL.createObjectURL(prep.blob); }catch(e){ console.error(e); } }
  try{ await orthoReload(); }catch(e){ console.error(e); }
  orthoNotify();
  allMaps().forEach(applyOrthos);
  toast(prep.shrunk ? '取り込みました（大きかったので縮めました）' : '取り込みました');
  render();
  return true;
}
function orthoShown(){ return prefs().ortho_show !== false; }
function orthoOpacityName(){ const n = prefs().ortho_opacity; return ORTHO_OPACITY[n] ? n : '濃い'; }
function orthoOpacity(){ return ORTHO_OPACITY[orthoOpacityName()]; }
/* 地図に重ねる。地図を作るたび（applyBaseMap）に呼ばれるので、地図×画像ごとに「まだ無いものだけ」足す。
   専用パネルをタイルと同じ親（回る地図では回転パネル）に作り、タイル(200)と線(400)の間に置く */
function applyOrthos(map){
  if(!map || typeof L === 'undefined' || !L.imageOverlay) return;
  if(!orthoShown()) return;
  let pane = null;
  try{ pane = map.getPane('ortho'); }catch(e){ pane = null; }
  if(!pane){
    const tiles = map.getPane('tilePane');
    pane = map.createPane('ortho', tiles && tiles.parentNode ? tiles.parentNode : undefined);
    pane.style.zIndex = '250';
    pane.style.pointerEvents = 'none';
  }
  map._orthoLayers = map._orthoLayers || {};
  ORTHO_LIST.forEach(o=>{
    if(!o || o.broken || !o.bounds) return;
    const url = ORTHO_URLS[o.id];
    if(!url || map._orthoLayers[o.id]) return;
    try{
      map._orthoLayers[o.id] = L.imageOverlay(url, [[o.bounds.s, o.bounds.w],[o.bounds.n, o.bounds.e]],
        {pane:'ortho', opacity:orthoOpacity(), interactive:false}).addTo(map);
    }catch(e){ console.error(e); }
  });
}
function orthoRemoveFrom(map, id){
  if(!map || !map._orthoLayers || !map._orthoLayers[id]) return;
  try{ map.removeLayer(map._orthoLayers[id]); }catch(e){}
  delete map._orthoLayers[id];
}
function orthoRemoveAll(map){
  if(!map || !map._orthoLayers) return;
  Object.keys(map._orthoLayers).forEach(id=>orthoRemoveFrom(map, id));
}
function orthoDropUrl(id){
  if(ORTHO_URLS[id]){ try{ URL.revokeObjectURL(ORTHO_URLS[id]); }catch(e){} }
  delete ORTHO_URLS[id];
}
/* 正本を読み直し、表示用URLをそろえる（起動時・別のタブが足した／消したとき）。
   URL は削除するまで持ち続ける（地図は画面ごとに作り直すため）。
   読んでいる間に消されたもの（ORTHO_GONE）には URL を作らない */
async function orthoPreload(){
  let r = null;
  try{ r = await orthoReload(); }catch(e){ console.error(e); return; }
  r.recs.forEach(rec=>{
    if(ORTHO_GONE[rec.id] || ORTHO_URLS[rec.id] || !orthoValid(rec)) return;
    // 1件が作れなくても、残りの読み込み・片付け・同期は続ける
    try{ ORTHO_URLS[rec.id] = URL.createObjectURL(rec.blob); }catch(e){ console.error(e); }
  });
  const alive = new Set(ORTHO_LIST.filter(o=>!o.broken).map(o=>o.id));
  Object.keys(ORTHO_URLS).forEach(id=>{ if(!alive.has(id)) orthoDropUrl(id); });
  allMaps().forEach(m=>{
    Object.keys(m._orthoLayers||{}).forEach(id=>{ if(!alive.has(id)) orthoRemoveFrom(m, id); });
    applyOrthos(m);
  });
  orthoSyncButtons();
  orthoRefreshScreen();
}
/* 開いている地図の「ドローン写真」ボタンを写しにそろえる（別のタブで最初の1枚が増えた・最後の1枚が消えたとき）。
   地図の画面を丸ごと描き直すと入力中の内容を壊すので、ボタンだけ足す・外す */
function orthoSyncButtons(){
  const has = ORTHO_LIST.some(o=>!o.broken);
  $$('.seg.basemap').forEach(seg=>{
    const btn = seg.querySelector('button[data-ortho]');
    if(has && !btn){ try{ seg.insertAdjacentHTML('beforeend', orthoButtonHtml()); }catch(e){} }
    else if(!has && btn){ try{ btn.remove(); }catch(e){} }
  });
  $$('button[data-ortho]').forEach(b=>b.classList.toggle('on', orthoShown()));
}
function orthoButtonHtml(){
  return `<button type="button" data-ortho="1" class="${orthoShown()?'on':''}" onclick="orthoToggle()">ドローン写真</button>`;
}
/* 一覧を出している画面だけ描き直す（入力中の画面は触らない） */
function orthoRefreshScreen(){
  const cur = STACK[STACK.length-1];
  if(cur && (cur.name === 'orthos' || cur.name === 'home')) render();
}
/* 別のタブに知らせる／別のタブからの知らせで読み直す */
let ORTHO_BC = null;
function orthoChannel(){
  if(ORTHO_BC !== null) return ORTHO_BC;
  try{
    ORTHO_BC = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('redd-ortho') : false;
    if(ORTHO_BC) ORTHO_BC.onmessage = ()=>{ orthoPreload().catch(e=>console.error(e)); };
  }catch(e){ ORTHO_BC = false; }
  return ORTHO_BC;
}
function orthoNotify(){ const c = orthoChannel(); if(c){ try{ c.postMessage({t:'ortho'}); }catch(e){} } }
function orthoToggle(){
  prefSet('ortho_show', !orthoShown());
  allMaps().forEach(m=>{ if(orthoShown()) applyOrthos(m); else orthoRemoveAll(m); });
  $$('button[data-ortho]').forEach(b=>b.classList.toggle('on', orthoShown()));
}
function orthoSetOpacity(name){
  if(!ORTHO_OPACITY[name]) return;
  prefSet('ortho_opacity', name);
  allMaps().forEach(m=>Object.keys(m._orthoLayers||{}).forEach(id=>{
    try{ m._orthoLayers[id].setOpacity(ORTHO_OPACITY[name]); }catch(e){}
  }));
}
/* 削除。先に「消した」印を立ててから正本を消す（読み込み中でも URL を作らせない）。
   正本を消せなければ、印を戻して何も変えない */
async function orthoDelete(id){
  const o = ORTHO_LIST.find(x=>x && x.id===id); if(!o) return false;
  if(!confirm(`「${o.name||'ドローン写真'}」を消します。よろしいですか？`)) return false;
  ORTHO_GONE[id] = true;
  try{ await PhotoDB.del(id); }
  catch(e){ delete ORTHO_GONE[id]; toast('消せませんでした'); return false; }
  allMaps().forEach(m=>orthoRemoveFrom(m, id));
  orthoDropUrl(id);
  try{ await orthoReload(); }catch(e){ console.error(e); }
  orthoNotify();
  render();
  return true;
}

let STACK = [{name:'home', arg:null}];

// 時間のかかる処理は、始めた時の番号を覚えておき、終わった時に変わっていたら
// 何もしない。そうしないと、待っている間に別の記録を開いたとき、
// その記録に前の画面の結果が書き込まれてしまう
let SCREEN_SEQ = 0;
function screenGen(){ return SCREEN_SEQ; }
function screenStale(gen){ return gen !== SCREEN_SEQ; }
const SCREENS = {};

// 600ミリ秒待ちの分を持ったまま画面を離れると、打った値が消える。
// どの入口からでも、先に書いてしまう
function nav(name, arg){ if(!envFlushOk()) return; stashEditDraft(); STACK.push({name,arg}); render(); }
function goBack(){ if(STACK.length>1){ if(!envFlushOk()) return; stashEditDraft(); STACK.pop(); render(); } }
function reset(name,arg){ if(!envFlushOk()) return; STACK=[{name:name||'home',arg:arg||null}]; render(); }

function render(){
  SCREEN_SEQ++;
  destroyMap();          // 前の画面の地図を残さない（画面の中身を入れ替えるため）
  closeEnvMap();
  closeOfflineMap();
  revokePhotoUrls();     // 前の画面の写真の一時URLを解放する
  const cur = STACK[STACK.length-1];
  const scr = SCREENS[cur.name] || SCREENS.home;
  let v;
  try{ v = scr(cur.arg); }
  catch(e){ console.error(e); toast('画面を開けませんでした'); v = SCREENS.home(); }
  if(!v){ STACK=[{name:'home',arg:null}]; v = SCREENS.home(); }
  $('#title').textContent = v.title || '産卵床調査記録';
  $('#backBtn').style.display = STACK.length>1 ? '' : 'none';

    `<span class="pill ${s.cls||''}"${s.id?` id="${s.id}"`:''}>${esc(s.text)}</span>`).join('');

  window.scrollTo(0,0);
  if(v.onMount) try{ v.onMount(); }catch(e){ console.error(e); }
}

/* ============================================================
   調査の作成・編集
   ============================================================ */
const DRAFT_KEY = 'rd_draft_survey';

/* 入力途中の下書き。
   記録・物理環境・メモの入力画面は項目が多く、誤って戻ると全部消えてしまうため、
   画面を離れるときに書きかけを保存し、次に同じ画面を開いたら戻す。
   保存した時点で下書きは消す。 */
const EDIT_DRAFT_KEY = 'rd_draft_edit';
function editDrafts(){ try{ return editDraftsStrict(); }catch(e){ return {}; } }
/* 控えを読む。壊れていたら例外にする。「読めない」を「無い」と取り違えてはいけない
   場面（写真の掃除・起動時の取り込み）で使う */
function editDraftsStrict(){
  const raw = localStorage.getItem(EDIT_DRAFT_KEY);
  if(raw == null) return {};
  const d = JSON.parse(raw);
  if(!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('draft broken');
  return d;
}
/* 控えを書く。書けたら true。メモの画面だけが使う
   （産卵床は打つそばから記録そのものに書くので、控えを持たない）。
   書きっぱなしにせず読み戻して確かめる。
   ほかの控えを捨てて書き直すようなことはしない（他人の入力を消してしまう） */
function editDraftSave(uuid, obj){
  if(!uuid) return false;
  if(obj && obj._new && !draftHasContent(obj._kind, obj)){ editDraftClear(uuid); return true; }
  const d = editDrafts(); d[uuid] = obj;
  const keys = Object.keys(d);
  if(keys.length > 20) delete d[keys[0]];   // 溜め込みすぎない
  try{
    localStorage.setItem(EDIT_DRAFT_KEY, JSON.stringify(d));
    return !!editDrafts()[uuid];
  }catch(e){ return false; }
}
function editDraftGet(uuid){ return editDrafts()[uuid] || null; }
// まだ一度も保存していない書きかけを探す（いまはメモの画面だけが使う）。
// 新規作成のたびに新しいIDが振られるため、IDでは見つけられない
function findNewDraft(kind, sv){
  const d = editDrafts();
  const id = Object.keys(d).find(k=>{
    const x=d[k];
    if(!x || x._kind!==kind || !x._new || x._sv!==sv) return false;
    if(DB.get(DB.key.nt, k)) return false;    // その後に保存されていたら書きかけではない
    return draftHasContent(kind, x);          // 空の書きかけで新規入力を邪魔しない
  });
  return id ? {uuid:id, draft:d[id]} : null;
}
// 何か入力されているか。空なら控える意味がない
function draftHasContent(kind, x){
  const arr = v => Array.isArray(v) && v.length>0;
  return !!(x.content || arr(x.photos));
}
/* 控えを消す。消えたら true（消せたか確かめる）。
   消せていないのに消えたことにすると、取り込み済みの記録に
   古い控えが重なって、あとで直した内容が巻き戻る */
function editDraftClear(uuid){
  const d = editDrafts();
  if(!(uuid in d)) return true;
  delete d[uuid];
  try{
    localStorage.setItem(EDIT_DRAFT_KEY, JSON.stringify(d));
    return !(uuid in editDrafts());
  }catch(e){ return false; }
}
/* 取り込んだ控えを消す。消す直前に読み直し、取り込んだときと同じ中身（sig）のときだけ消す。
   取り込みの途中で（旧版の画面が）控えを書き換えていたら消さない（次の起動で重ね直す）。
   読めなければ消さない */
function editDraftClearIfSig(uuid, sig){
  let d;
  try{ d = editDraftsStrict(); }catch(e){ return false; }
  if(!(uuid in d)) return true;
  if(draftSig(d[uuid]) !== sig) return false;
  delete d[uuid];
  try{
    localStorage.setItem(EDIT_DRAFT_KEY, JSON.stringify(d));
    return !(uuid in editDrafts());
  }catch(e){ return false; }
}
// 画面を離れる直前に呼ぶ。いま開いている入力画面の書きかけを控える

  // 記録中の軌跡が消した調査に書き込み続けないよう、先に止める

/* ============================================================
   位置（GPS）と区間の軌跡
   調査中は位置を取り続け、区間を記録中ならその軌跡に足していく。
   ============================================================ */
let gpsWatchId = null;
let lastFix = null;    // {lat, lon, acc, t}
let TRACK = null;      // {reach_uuid, pts:[[lat,lon],...], lastSave}

const GPS_MAX_ACC   = 50;      // これより粗い位置は軌跡に使わない（m）
const TRACK_MIN_MOVE= 3;       // これ未満しか動いていなければ軌跡に足さない（m）
const TRACK_SAVE_MS = 15000;   // 軌跡を保存する間隔（書き込みすぎを防ぐ）

function validPt(p){ return Array.isArray(p) && p.length===2 && isFinite(p[0]) && isFinite(p[1])
  && Math.abs(p[0])<=90 && Math.abs(p[1])<=180; }
// 短い距離なので、緯度による経度の縮みだけ補正した平面近似で足りる
function distMeters(a,b){
  const R=6378137, rad=Math.PI/180;
  const y=(b[0]-a[0])*rad;
  const x=(b[1]-a[1])*rad*Math.cos((a[0]+b[0])/2*rad);
  return Math.sqrt(x*x+y*y)*R;
}
function pathLength(path){
  const p=(path||[]).filter(validPt); let d=0;
  for(let i=1;i<p.length;i++) d+=distMeters(p[i-1],p[i]);
  return d;
}
// 空欄は '—'。0m（測って0）とは区別する
function fmtDist(d){
  if(d==='' || d===null || d===undefined || !isFinite(+d)) return '—';
  d=+d; return d>=1000 ? (d/1000).toFixed(2)+'km' : Math.round(d)+'m';
}
function fmtDur(ms){ const s=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h ? `${h}時間${m}分` : `${m}分`; }

function startGps(){
  if(gpsWatchId!=null || !navigator.geolocation) return;
  gpsWatchId = navigator.geolocation.watchPosition(
    p=>{ lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
         trackAppend(); updateGpsPill(); },
    ()=>{ updateGpsPill(); },
    {enableHighAccuracy:true, maximumAge:2000, timeout:20000});
}
function stopGps(){
  if(gpsWatchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatchId);
  gpsWatchId=null;
}
function gpsText(){
  if(!lastFix) return 'GPS 取得中';
  const age=(Date.now()-lastFix.t)/1000;
  if(age>60) return 'GPS 途切れ';
  return 'GPS 約'+Math.round(lastFix.acc)+'m';
}
function updateGpsPill(){ const el=$('#gpsPill'); if(el) el.textContent=gpsText(); }

function trackAppend(){
  if(!TRACK || !lastFix) return;
  if(lastFix.acc > GPS_MAX_ACC) return;            // 精度が悪い点は距離を狂わせるので使わない
  const pt=[lastFix.lat, lastFix.lon];
  const last=TRACK.pts[TRACK.pts.length-1];
  if(last && distMeters(last, pt) < TRACK_MIN_MOVE) return;   // 立ち止まり中の揺れで距離が伸びるのを防ぐ
  TRACK.pts.push(pt);
  if(Date.now()-TRACK.lastSave > TRACK_SAVE_MS) trackSave();
  const el=$('#reachLen'); if(el) el.textContent=fmtDist(pathLength(TRACK.pts));
}
function trackSave(){
  if(!TRACK) return;
  // 記録中の区間が消えている・終了済みになっている場合は書き込まない
  // （バックアップ取り込み等で、手元のTRACKより先に区間が終了することがある）
  const r = DB.get(DB.key.re, TRACK.reach_uuid);
  if(!r || r.deleted_at || r.ended_at){ TRACK=null; return; }
  TRACK.lastSave=Date.now();
  DB.upsert(DB.key.re, { uuid:TRACK.reach_uuid, track:TRACK.pts.slice(),
    length_m_auto: Math.round(pathLength(TRACK.pts)) });
}

/* ---------- 区間 ---------- */
function activeReach(sv){ return DB.reachesOf(sv).find(r=>!r.ended_at) || null; }
function reachLength(r){
  // 手入力があればそちらを優先する（GPSが乱れた区間を後から直せるように）
  if(r.length_m_manual!=='' && r.length_m_manual!=null) return +r.length_m_manual;
  return +r.length_m_auto || 0;
}
function reachName(sv, u){ const r=DB.get(DB.key.re,u); return r?r.name:''; }
function startReach(sv){
  if(activeReach(sv)){ toast('すでに区間を記録中です'); return; }
  const r = { uuid:uuid(), survey_uuid:sv, name:'St.'+(DB.reachesOf(sv).length+1),
    started_at:nowISO(), ended_at:'',
    start_lat: lastFix?+lastFix.lat.toFixed(6):'', start_lon: lastFix?+lastFix.lon.toFixed(6):'',
    end_lat:'', end_lon:'',
    track: (lastFix && lastFix.acc<=GPS_MAX_ACC) ? [[lastFix.lat,lastFix.lon]] : [],
    length_m_auto:0, length_m_manual:'', river_width_m:'', memo:'' };
  if(!DB.upsert(DB.key.re, r)) return;
  TRACK = { reach_uuid:r.uuid, pts:(r.track||[]).slice(), lastSave:Date.now() };
  startGps();
  toast(r.name+' の記録を始めました');
  render();
}
function endReach(sv){
  const r = activeReach(sv); if(!r) return;
  // いま軌跡を取っているのが本当にこの区間かを確認する（複数調査が並行した場合の取り違え防止）
  const pts = (TRACK && TRACK.reach_uuid===r.uuid) ? TRACK.pts : (r.track||[]);
  const end = pts[pts.length-1] || [];
  if(TRACK && TRACK.reach_uuid!==r.uuid) toast('別の区間を記録中でした。この区間は保存済みの軌跡で終了します');
  DB.upsert(DB.key.re, { uuid:r.uuid, ended_at:nowISO(), track:pts.slice(),
    length_m_auto: Math.round(pathLength(pts)),
    end_lat: end[0]!=null?+end[0].toFixed(6):'', end_lon: end[1]!=null?+end[1].toFixed(6):'' });
  if(!TRACK || TRACK.reach_uuid===r.uuid) TRACK=null;
  toast(r.name+' を終了しました（'+fmtDist(pathLength(pts))+'）');
  render();
}
// 画面を閉じて開き直しても、記録中の区間があれば軌跡の記録を続ける
function resumeTracking(){
  const svs = DB.surveys().filter(s=>s.status==='調査中');
  if(!svs.length) return;
  startGps();
  if(TRACK) return;
  // 未終了の区間を「調査ごと」ではなく全部数える（復元データ等では同じ調査に複数残ることもある）。
  // 複数あるときは勝手に選ばない — 間違った区間に軌跡が混ざるのが最悪なので、ユーザーの操作を待つ
  const open = svs.flatMap(s=>DB.reachesOf(s.uuid).filter(r=>!r.ended_at));
  if(open.length > 1){ toast('記録中の区間が複数見つかりました。調査を開いて確認してください'); return; }
  if(open.length===1) TRACK = { reach_uuid:open[0].uuid, pts:(open[0].track||[]).slice(), lastSave:Date.now() };
}
// バックアップ取り込みや復元の後に呼ぶ。追記中の区間が終了・削除されていたら追記をやめ、
// 続けられる区間が1つに定まるなら付け直す
function resyncTrack(){
  if(TRACK){
    const r = DB.get(DB.key.re, TRACK.reach_uuid);
    if(!r || r.deleted_at || r.ended_at) TRACK = null;
  }
  resumeTracking();
}

/* ============================================================
   調査の画面（調査中の拠点）
   ============================================================ */
// 調査中の画面で常に見せる、今の集計。
// num() は集計セクションで定義しているが巻き上げで先に使える
function liveTally(sv){
  const all = DB.reddsOf(sv);
  const redds = all.filter(r=>hasTarget(r,'産卵床'));
  const withFish = all.filter(r=>hasTarget(r,'親魚'));
  const female = sumOf(withFish,'female_n');
  const male   = sumOf(withFish,'male_n');
  const carcass= sumOf(all.filter(r=>hasTarget(r,'ホッチャレ')),'carcass_n');
  // 魚種別の産卵床数（多い順・上位のみ文字で）
  const bySp = countBy(redds,'species','種不明');
  return { redd:redds.length, female, male, carcass, review:all.filter(r=>r.needs_review).length, bySp };
}
function liveTallyHtml(sv){
  const t = liveTally(sv);
  const cell = (label, val) => `<div style="text-align:center; flex:1; min-width:70px">
    <div style="font-size:22px; font-weight:700">${val}</div>
    <div class="tiny muted">${label}</div></div>`;
  const sp = t.bySp.length ? `<div class="tiny muted" style="margin-top:8px; text-align:center">
    ${esc(t.bySp.map(([k,n])=>`${k} ${n}`).join(' ／ '))}</div>` : '';
  return `<div class="card" style="background:var(--panel2)">
    <div class="row" style="flex-wrap:wrap; gap:6px">
      ${cell('産卵床', t.redd)}
      ${cell('雌', t.female)}
      ${cell('雄', t.male)}
      ${cell('ホッチャレ', t.carcass)}
      ${ t.review ? cell('要確認', t.review) : '' }
    </div>${sp}</div>`;
}

SCREENS.survey = (u)=>{
  const s = DB.survey(u); if(!s) return SCREENS.home();
  const redds = DB.reddsOf(u), reaches = DB.reachesOf(u), notes = DB.notesOf(u), units = DB.unitsOf(u);
  const started = s.status==='調査中', finished = s.status==='終了';
  const cur = activeReach(u);

  const cond = [
    s.weather, s.turbidity, s.water_level,
    (s.air_temp_c!==''&&s.air_temp_c!=null)?`気温${s.air_temp_c}℃`:'',
    (s.water_temp_c!==''&&s.water_temp_c!=null)?`水温${s.water_temp_c}℃`:''
  ].filter(Boolean).join(' ／ ') || '—';

  const sub = [{text:s.status||'未開始', cls: started?'ok':'off'}];
  if(started){
    sub.push({text:'経過 '+fmtDur(Date.now()-new Date(s.start_datetime||nowISO()).getTime())});
    sub.push({text:gpsText(), cls:'ok', id:'gpsPill'});
    sub.push({text: cur ? '記録中 '+cur.name : '区間 未開始', cls: cur?'ok':'warn'});
  }
  sub.push({text:`産卵床 ${redds.length}`});
  sub.push({text:`区間 ${reaches.length}`});

  return {
    title: s.name || '調査',
    sub,
    html:`
      <div class="card">

// 自分以外の「調査中」をすべて終了する。
// 調査中が2つあると軌跡がどちらの区間に入るか分からなくなるため、常に1つに保つ。
// 過去の不整合データで複数残っていても、ここでまとめて閉じる。
// 全部閉じ切れた場合だけ true（保存に失敗したら false を返し、呼び出し側は切り替えを中止する）
function endOtherSurveys(u){
  let ok = true;
  DB.surveys().filter(x=>x.uuid!==u && x.status==='調査中').forEach(o=>{
    // 復元データ等で未終了の区間が複数残っていても、全部閉じる
    DB.reachesOf(o.uuid).filter(r=>!r.ended_at).forEach(()=>{ if(activeReach(o.uuid)) endReach(o.uuid); });
    if(activeReach(o.uuid)) ok = false;
    if(!DB.upsert(DB.key.sv, {uuid:o.uuid, status:'終了', end_datetime:nowISO()})) ok = false;
  });
  return ok;
}
function otherRunningNames(u){
  return DB.surveys().filter(x=>x.uuid!==u && x.status==='調査中').map(o=>o.name);
}
function startSurvey(u){
  const s = DB.survey(u); if(!s) return;
  const others = otherRunningNames(u);
  if(others.length && !confirm(`「${others.join('」「')}」がまだ調査中です。
そちらを終了して、この調査を始めますか？`)) return;
  if(!endOtherSurveys(u)){ toast('前の調査を終了できませんでした。端末の空き容量を確認してください'); return; }
  DB.upsert(DB.key.sv, { uuid:u, status:'調査中', start_datetime: s.start_datetime || nowISO() });
  startGps();
  toast('調査を開始しました');
  render();
}
function finishSurvey(u){
  const cur = activeReach(u);
  const msg = cur ? `調査を終了しますか？\n記録中の ${cur.name} も終了します。（あとで再開できます）`
                  : '調査を終了しますか？（あとで再開できます）';
  if(!confirm(msg)) return;
  if(cur) endReach(u);
  DB.upsert(DB.key.sv, { uuid:u, status:'終了', end_datetime: nowISO() });
  stopGps();
  toast('調査を終了しました');
  render();
}
function reopenSurvey(u){
  const others = otherRunningNames(u);
  if(others.length && !confirm(`「${others.join('」「')}」がまだ調査中です。
そちらを終了して、この調査を再開しますか？`)) return;
  if(!endOtherSurveys(u)){ toast('前の調査を終了できませんでした。端末の空き容量を確認してください'); return; }
  DB.upsert(DB.key.sv, { uuid:u, status:'調査中', end_datetime:'' });
  startGps();
  toast('調査を再開しました');
  render();
}

/* ============================================================
   産卵床の記録
   ============================================================ */
/* ---------- まわりの環境の測点（水深・流速を何点でも） ---------- */
// 古い記録（水深・流速が1つだけ）は、1点の測点として読み替える
function envPoints(r){
  // env_points が配列なら、たとえ空でもそれが正本。
  // （空を「未設定」と見なすと、測点を全部消して保存しても古い値が復活してしまう）
  if(Array.isArray(r.env_points)) return r.env_points.slice();
  if(num(r.depth_cm)!=null || num(r.velocity_ms)!=null)
    return [{ depth_cm:r.depth_cm??'', velocity_ms:r.velocity_ms??'', note:'' }];
  return [];
}
// 範囲外の値（水深-10cm など）は集計に入れない。記録には残っていて「要確認」が付いている
function envValues(r, field){
  return envPoints(r).map(p=>numOf(p[field])).filter(v=>v!=='' && inRange(v, ENV_RANGE[field]));
}
function envMean(r, field){
  const v = envValues(r, field);
  return v.length ? +(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2) : '';
}
// 調査全体・複数記録ぶんの測点をまとめる
function allEnvValues(list, field){
  const out=[];
  list.forEach(r=>envValues(r, field).forEach(v=>out.push(v)));
  return out;
}
function statLine(vals, unit, digits){
  if(!vals.length) return '—';
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const av=vals.reduce((a,b)=>a+b,0)/vals.length;
  const d = digits==null?1:digits;
  return `平均 ${av.toFixed(d)}${unit}（${mn.toFixed(d)}〜${mx.toFixed(d)}${unit}・${vals.length}点）`;
}

/* 何を記録したか。
   record_targets を持たない古い記録は、中身から推定する（産卵床は必ず含める） */
function recordTargets(r){
  if(Array.isArray(r.record_targets) && r.record_targets.length) return r.record_targets.slice();
  const t = ['産卵床'];
  if(r.fish_present==='いる' || num(r.female_n) || num(r.male_n) || r.behavior) t.push('親魚');
  if(num(r.carcass_n)) t.push('ホッチャレ');
  return t;
}
function hasTarget(r, name){ return recordTargets(r).indexOf(name) >= 0; }
function targetLabel(r){ return recordTargets(r).join('＋'); }

/* この調査ぜんたいの通し番号（S1・S2…）。v21 から区間ごとではなくなった。
   消したものも数える。消した番号を使い回すと、先に書き出したCSVの S3 と
   あとから作った S3 が別物になる（物理環境の envAutoName と同じ考え方）。
   すでに保存されている番号は書き換えない。古い調査で区間ごとに1から振られた番号は、
   現場の野帳や書き出し済みのCSVと一致している値なので、そのまま残す */
function nextReddNo(sv){
  const list = DB.load(DB.key.rd).filter(x=>x.survey_uuid===sv);
  return list.reduce((m,x)=>Math.max(m, parseInt(x.redd_no,10)||0), 0) + 1;
}
/* 面積。長さ・幅がどちらも範囲内のときだけ出す。
   範囲外（負の長さなど）から面積を作ると、総面積が静かに狂う */
function reddArea(lenCm, widCm){
  const L=numOf(lenCm), W=numOf(widCm);
  if(L==='' || W==='') return '';
  if(!inRange(L, REDD_RANGE.length_cm) || !inRange(W, REDD_RANGE.width_cm)) return '';
  return +((L*W)/10000).toFixed(3);
}
/* 集計に使う面積。古い版は範囲外の長さ（3000cm など）からも面積を作っていたので、
   保存してある値を信じず、いまの長さ・幅から作り直す。
   長さ・幅がどちらも無い古い記録だけ、保存してある面積をそのまま使う */
// 長さ・幅がどちらも空欄か。「無い」は空欄のことで、数にならない文字（'abc'）は「ある」
function reddSizeBlank(r){
  const blank = v => v==null || String(v).trim()==='';
  return blank(r.length_cm) && blank(r.width_cm);
}
function reddAreaOf(r){
  // 長さ・幅に文字が残っていれば作り直せないので面積なし（保存値は使わない）
  return reddSizeBlank(r) ? r.area_m2 : reddArea(r.length_cm, r.width_cm);
}
/* 保存するときの面積。長さ・幅から作る。
   前も今も長さ・幅が空欄なら、保存してある面積（古い版で入れたもの）を引き継ぐ。
   ここで作り直すと、メモを直しただけで古い面積が消える */
function reddAreaNext(f, prev){
  if(reddSizeBlank(f) && reddSizeBlank(prev||{})) return (prev && prev.area_m2!=null) ? prev.area_m2 : '';
  return reddArea(f.length_cm, f.width_cm);
}
/* 要確認の理由のうち、入力の状況から付ける断り（値の範囲の理由とは別） */
const TARGET_NOTE = '記録の種類（産卵床・親魚・ホッチャレ）が選ばれていません';
const POS_NOTE = '（前の位置のままにしました）';
/* 要確認の印。人が付けた印（review_manual）と、自動で見つけた理由（review_reasons）を
   分けて持ち、needs_review はその合わせ。古い記録は needs_review しか無いので人の印とみなす */
function reviewManual(r){ return r.review_manual!==undefined ? !!r.review_manual : !!r.needs_review; }
function reviewReasons(r){ return Array.isArray(r.review_reasons) ? r.review_reasons.slice() : []; }
/* 産卵床の記録のひな形。ここ1か所に決める。
   記録画面から作るときも、地図で置くときも、同じものを作る。
   2か所に持つと、あとで欄を1つ足したとき片方だけ直す事故が起きる（v19で実際に起きた） */
function newRedd(sv, opt){
  const o = opt || {}, carry = o.carry || {};
  return {
    uuid: uuid(), survey_uuid: sv,
    reach_uuid: o.reach_uuid || '',
    redd_no: nextReddNo(sv), observed_at: nowISO(),
    latitude: o.latitude || '', longitude: o.longitude || '',
    gps_accuracy: (o.gps_accuracy===undefined || o.gps_accuracy===null) ? '' : o.gps_accuracy,
    position_source: o.position_source || '',
    // 置いた時点では「産卵床」。親魚だけ・ホッチャレだけに変えるのは入力画面の仕事
    record_targets: ['産卵床'],
    river_form: carry.river_form||'',
    // 魚種と判断根拠は引き継がない（見ていない魚種が入り、
    // 「まだ入れていない」の印も最初から消えてしまうため）
    species:'', species_basis:'', age_class:'', state:'',
    length_cm:'', width_cm:'', area_m2:'', env_points:[],
    substrate_main: carry.substrate_main||'', substrate_sub: carry.substrate_sub||'',
    embeddedness: carry.embeddedness||'', cover: carry.cover||'',
    water_temp_c:'', intragravel_temp_c:'', temp_depth_cm:'',
    female_n:'', male_n:'', behavior:'', carcass_n:'',
    note:'', needs_review:false, photos:[],
  };
}
/* 画面に出す名前。P1・L1 と並べても混ざらないよう S を付ける。
   地図の印も、一覧も、ゴミ箱も、すべてここを通す */
function reddName(r){
  const n = (r && r.redd_no!=='' && r.redd_no!=null) ? r.redd_no : '?';
  return 'S' + n;
}

/* ---------- 産卵床の入力欄。地図の下でも、記録の画面でも、ここ1か所で作る ----------
   2か所に持つと、欄を1つ足したとき片方だけ直す事故が起きる（v19で実際に起きた）。
   opt.fold … よく使うもの以外を「詳しく入れる」の折りたたみに入れる（地図の下）
   取り出しは collectReddForm() ひとつ。欄が1か所なので、取り出しも1か所で足りる */
function reddFormHtml(r, sv, opt){
  const o = opt || {};
  const reachOpts = ['<option value="">区間なし</option>'].concat(
    DB.reachesOf(sv).map(x=>`<option value="${x.uuid}" ${x.uuid===r.reach_uuid?'selected':''}>${esc(x.name)}${x.ended_at?'':'（記録中）'}</option>`)
  ).join('');

  // よく使うもの。ここは折りたたまず、いつも出す
  const head = `
      <div class="sect">この記録は何ですか（いくつでも選べます）</div>
      ${segMultiHtml('target', OPT.target, recordTargets(r), 'onTargetChange')}
      <div class="tiny muted" style="margin-top:6px">
        例：産卵床だけ見つけた＝「産卵床」／産卵床の上に親魚がいた＝「産卵床」＋「親魚」／
        産卵床は無いが親魚だけ見えた＝「親魚」／ホッチャレだけ＝「ホッチャレ」。
        選んだものに合わせて、下の入力欄が切り替わります。

/* ---------- 測点の入力欄（水深・流速） ---------- */
// 入力欄（要素）から数を取り出す。値から取り出す numOf(v) とは別物
function numOfEl(el){
  if(!el) return '';
  const v=String(el.value).trim();
  if(v==='') return '';
  const n=parseFloat(v); return isNaN(n)?'':n;
}
// 画面に入力されている内容を SCREENS._env に取り込む（並べ替え・追加の前に必ず呼ぶ）
function envSync(){
  SCREENS._env = $$('#envList .envrow').map(row=>({
    depth_cm: numOfEl(row.querySelector('.envd')),
    velocity_ms: numOfEl(row.querySelector('.envv')),
    note: ((row.querySelector('.envn')||{}).value||'').trim(),
  }));
}
function envAdd(){
  envSync();
  SCREENS._env = (SCREENS._env||[]).concat([{depth_cm:'', velocity_ms:'', note:''}]);
  renderEnvList();
  envPointsTouched();
}
function envRemove(i){
  envSync();
  (SCREENS._env||[]).splice(i,1);
  renderEnvList();
  envPointsTouched();
}
// 測点を足した・消したことは input も change も出さない。
// 地図の下の入力欄では、拾わないと自動保存に乗らず、消したはずの測点が戻る

    envAutoSave(ENV_FORM);

    <div class="card envrow" style="padding:10px">
