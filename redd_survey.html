        list.push([+ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6)]);
        drawMeshSetup(); showMeshPlan();
      });
      setTimeout(()=>{ if(ENVMAP) ENVMAP.invalidateSize(); }, 60);
    }
  };
};
/* いまいる場所を四隅の1つとして押さえる */
function grabMeshCorner(i){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので押さえていません`);
      return;
    }
    const list = MESH_CORNERS;
    while(list.length < i) list.push(null);
    list[i] = [+f.lat.toFixed(6), +f.lon.toFixed(6)];
    drawMeshSetup(); showMeshPlan();
    toast(`${i+1}つ目を押さえました`);
  });
}
/* 押さえた四隅を、最後の1つだけ取り消す。
   順番を飛ばして押さえた分の空きも一緒に片付ける
   （残すと、次の地図タップが1つ目ではなく2つ目として入ってしまう） */
function undoMeshCorner(){
  const list = MESH_CORNERS;
  let i = list.length - 1;
  while(i >= 0 && !list[i]) i--;
  if(i < 0){ toast('戻す四隅がありません'); return; }
  list.length = i;
  while(list.length && !list[list.length-1]) list.pop();
  drawMeshSetup(); showMeshPlan();
  toast(`${i+1}つ目を取り消しました`);
}
function clearMeshCorners(){
  if(!confirm('押さえた四隅を消します。よろしいですか？')) return;
  MESH_CORNERS = [];
  drawMeshSetup(); showMeshPlan();
}
/* いま画面にある値だけで作った、仮の記録 */
function tmpMeshUnit(){
  return { mesh_corners: MESH_CORNERS.filter(Boolean),
           mesh_row_m: strVal('#mesh_gap'), mesh_col_m: strVal('#mesh_colm') };
}
/* 四隅と格子を地図に描く */
function drawMeshSetup(){
  const list = MESH_CORNERS.filter(Boolean);
  // 押さえた分を画面の表に書き戻す（地図が無くても効かせる）
  [0,1,2,3].forEach(i=>{
    const el = $('#mc_'+i); if(!el) return;
    const pt = MESH_CORNERS[i];
    el.innerHTML = (pt && validPt(pt))
      ? esc(pt[0].toFixed(6)+', '+pt[1].toFixed(6))
      : '<span class="badge">まだ</span>';
  });
  if(!ENVMAP || typeof L==='undefined') return;
  try{ MESHLAYER.forEach(x=>ENVMAP.removeLayer(x)); }catch(e){}
  MESHLAYER = [];
  list.forEach((pt,i)=>{
    if(!validPt(pt)) return;
    MESHLAYER.push(L.marker(pt, {icon:meshDot('#4aa3dd',13)}).addTo(ENVMAP));
    MESHLAYER.push(L.marker(pt, {icon:L.divIcon({className:'',
      html:`<div style="color:#4aa3dd;font-weight:700;text-shadow:0 0 3px #000">${i+1}</div>`,
      iconSize:[16,16], iconAnchor:[-6,16]})}).addTo(ENVMAP));
  });
  const g = meshPlan(tmpMeshUnit());
  if(!g) return;
  MESHLAYER.push(L.polygon(g.corners, {color:'#4aa3dd', weight:2, fillOpacity:.06}).addTo(ENVMAP));
  // 細かすぎるとぼやけるので、線は最大30本ずつ。
  // ただし引く場所は本当の境目にする（間引いた本数で割ると、線が実際とずれる）
  const pick = (total)=>{
    const out = [], step = Math.max(1, Math.ceil((total-1)/30));
    for(let i=step;i<total;i+=step) out.push(i);
    return out;
  };
  pick(g.rows).forEach(r=>{
    const v = r/g.rows;
    const p1 = [g.corners[0][0]+(g.corners[3][0]-g.corners[0][0])*v,
                g.corners[0][1]+(g.corners[3][1]-g.corners[0][1])*v];
    const p2 = [g.corners[1][0]+(g.corners[2][0]-g.corners[1][0])*v,
                g.corners[1][1]+(g.corners[2][1]-g.corners[1][1])*v];
    MESHLAYER.push(L.polyline([p1,p2], {color:'#4aa3dd', weight:1, opacity:.5}).addTo(ENVMAP));
  });
  pick(g.cols).forEach(cc=>{
    const uu = cc/g.cols;
    const p1 = [g.corners[0][0]+(g.corners[1][0]-g.corners[0][0])*uu,
                g.corners[0][1]+(g.corners[1][1]-g.corners[0][1])*uu];
    const p2 = [g.corners[3][0]+(g.corners[2][0]-g.corners[3][0])*uu,
                g.corners[3][1]+(g.corners[2][1]-g.corners[3][1])*uu];
    MESHLAYER.push(L.polyline([p1,p2], {color:'#4aa3dd', weight:1, opacity:.5}).addTo(ENVMAP));
  });
  try{ ENVMAP.fitBounds(L.latLngBounds(g.corners).pad(0.25), {animate:false}); }catch(e){}
}
/* 何マスになるかを、決める前に見せる */
function showMeshPlan(){
  const box = $('#mesh_plan'); if(!box) return;
  const tmp = tmpMeshUnit();
  const list = MESH_CORNERS.filter(Boolean);
  const cerr = list.length===4 ? meshCornerError(list) : '';
  if(cerr){ box.textContent = cerr; drawMeshSetup(); return; }
  if(!meshCorners(tmp)){ box.textContent = '四隅を4つとも押さえると、マスの数が出ます。';
    drawMeshSetup(); return; }
  const g = meshPlan(tmp);
  if(!g){ box.textContent = `縦 ${fmtDist(meshLength(tmp))}／横 ${fmtDist(meshWidth(tmp))}。`
    + '縦の間隔と横の間隔を入れてください。'; drawMeshSetup(); return; }
  box.textContent = `縦 ${fmtDist(g.length)}（${g.rows}行）× 横 ${fmtDist(g.width)}（${g.cols}列）`
    + ` ＝ ${g.n}マス`
    + `（1マス およそ 縦${(g.length/g.rows).toFixed(1)}m × 横${(g.width/g.cols).toFixed(1)}m）`
    + (g.n > MESH_MAX_CELLS ? `　※${MESH_MAX_CELLS}マスを超えるので決められません` : '');
  drawMeshSetup();
}
/* 格子を決めて保存する */
function saveMesh(u){
  const rec = DB.liveUnit(u); if(!rec) return;
  const list = MESH_CORNERS.filter(Boolean);
  const cerr = meshCornerError(list);
  if(cerr){ toast(cerr); return; }
  const tmp = tmpMeshUnit();
  const err = rangeCheck([['縦の間隔', strVal('#mesh_gap'), 0.1, 1000],
                          ['横の間隔', strVal('#mesh_colm'), 0.1, 1000]]);
  if(err){ toast(err); return; }
  const g = meshPlan(tmp);
  if(!g){ toast('縦の間隔と横の間隔を入れてください'); return; }
  if(g.n > MESH_MAX_CELLS){
    toast(`${g.n}マスは多すぎます（${MESH_MAX_CELLS}マスまで）。間隔を広げるか、範囲を分けてください`);
    return;
  }
  const before = meshGridSig(rec);
  rec.env_method  = 'メッシュ';
  rec.mesh_corners = list;
  rec.mesh_row_m  = numOf(strVal('#mesh_gap'));
  rec.mesh_col_m  = numOf(strVal('#mesh_colm'));
  // 中身が変わったときだけ版を新しくする。
  // 版が変われば、前の格子で入れたマスは一覧にも集計にも混ざらない
  if(!rec.mesh_grid_id || meshGridSig(rec)!==before) rec.mesh_grid_id = uuid();
  if(!DB.put(DB.key.un, rec)) return;
  // 次に作るときの初期値として覚えておく（この端末だけ）
  prefSet('mesh_row_m', rec.mesh_row_m);
  prefSet('mesh_col_m', rec.mesh_col_m);
  toast(`${g.rows}行 × ${g.cols}列 ＝ ${g.n}マスにしました`);
  navReplace('mesh', u);
}

  return {

    sub:[{text:rec.name||''},{text:`${cells.length}マス`}]

    html:`
      ${g ? `<div class="card">

      ${old ? `<div class="warnbox">前の格子で入れたマスが <b>${old}件</b> あります。
        四隅か細かさを変えたためです。同じ行・列でも川の別の場所を指すので、
        下の表とまとめには混ぜていません。記録は消えていません。

      ${out ? `<div class="warnbox">いまの格子からはみ出したマスが ${out}件 あります。</div>` : ''}

      ${g ? `<div class="card">

        <div class="tiny muted">緑は入力済み。タップで開きます。左が左岸、上が上流です。</div>

        <div class="small">流速　${vel.n

      ${baseMapButtonsHtml()}

    onMount(){

};

function saveMeshCell(u, row, col, next){
  const unit = DB.liveUnit(u); if(!unit) return;
  const g = meshGeom(unit); if(!g) return;
  const checks = [['水深', strVal('#mx_d'), 0, 2000], ['流速', strVal('#mx_v'), 0, 10]];
  OPT.substrate.forEach(k=>checks.push([k+'の割合', strVal('#mxp_'+SUBSTRATE_NO[k]), 0, 100]));
  const err = rangeCheck(checks);
  if(err){ toast(err); return; }

  // いまの格子のマスだけを「同じマス」とみなす。
  // 前の格子の同じ行・列に上書きすると、別の場所の記録を書き換えてしまう
  const cur = meshCellMap(meshCurrentCells(unit))[row+'_'+col];
  const rec = cur ? (DB.get(DB.key.mc, cur.uuid) || {uuid:cur.uuid})
                  : {uuid:uuid(), survey_uuid:unit.survey_uuid, unit_uuid:u,
                     row, col, measured_at:nowISO()};
  rec.grid_id = meshGridId(unit);
  // 記録した時刻は最初の保存のときに付く。あとから直しても上書きしない
  if(!rec.measured_at) rec.measured_at = nowISO();
  rec.survey_uuid = rec.survey_uuid || unit.survey_uuid;
  rec.unit_uuid = rec.unit_uuid || u;
  rec.row = row; rec.col = col;
  const pos = meshCellCenter(g.corners, g.rows, g.cols, row, col);
  rec.latitude  = +pos[0].toFixed(6);
  rec.longitude = +pos[1].toFixed(6);
  rec.depth_cm     = numVal('#mx_d');
  rec.velocity_ms  = numVal('#mx_v');
  rec.substrate        = segVal('mx_sub');
  rec.habitat_type     = segVal('mx_hab');
  rec.gravel_condition = segVal('mx_gr');
  // カバーだけは正本の一覧に「なし」が実在するので、そのまま受ける
  rec.cover = segRaw('mx_cov');
  rec.note  = strVal('#mx_note');
  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#mxp_'+SUBSTRATE_NO[k]); });
  rec.substrate_pct = pct;
  // 何も入っていないマスは作らない（開いただけで増えないように）。
  // 0 は「測った0」なので、空欄かどうかで見る
  if(!cur && rec.depth_cm==='' && rec.velocity_ms==='' && !rec.substrate
     && !rec.habitat_type && !rec.gravel_condition && !rec.cover && !rec.note
     && !Object.keys(pct).some(k=>pct[k]!=='')){
    toast('何か入れてから保存してください');
    return;
  }
  if(!DB.put(DB.key.mc, rec)) return;
  toast('保存しました');
  if(next){
    // 右へ。行の終わりなら次の行の左へ。最後なら一覧へ戻る
    let r = row, c = col + 1;
    if(c >= g.cols){ c = 0; r += 1; }
    if(r >= g.rows){ navReplace('mesh', u); return; }
    navReplace('meshCell', JSON.stringify({u, row:r, col:c}));
  }else{
    navReplace('mesh', u);
  }
}
/* 1つ前のマス（左どなり。行の頭なら前の行の右端）の中身を写す */
function copyPrevMeshCell(u, row, col){
  const unit = DB.liveUnit(u); if(!unit) return;
  const g = meshGeom(unit); if(!g) return;
  let r = row, c = col - 1;
  if(c < 0){ r = row - 1; c = g.cols - 1; }
  if(r < 0){ toast('1つ前のマスがありません'); return; }
  const prev = meshCellMap(meshCurrentCells(unit))[r+'_'+c];
  if(!prev){ toast('1つ前のマスは、まだ入力されていません'); return; }
  const put = (sel, v)=>{ const el=$(sel); if(el) el.value = (v===undefined||v===null)?'':v; };
  put('#mx_d', prev.depth_cm); put('#mx_v', prev.velocity_ms); put('#mx_note', prev.note||'');
  setSegValue('mx_sub', prev.substrate||'なし');
  setSegValue('mx_hab', prev.habitat_type||'なし');
  setSegValue('mx_gr', prev.gravel_condition||'なし');
  setSegRaw('mx_cov', prev.cover);
  const pct = (prev.substrate_pct && typeof prev.substrate_pct==='object') ? prev.substrate_pct : {};
  OPT.substrate.forEach(k=>put('#mxp_'+SUBSTRATE_NO[k], pct[k]));
  toast(`${r+1}行 ${c+1}列 の中身を写しました`);
}
function delMeshCell(uu){
  if(!confirm('このマスの記録を消します。よろしいですか？')) return;
  const rec = DB.get(DB.key.mc, uu);
  if(DB.softDelete(DB.key.mc, uu)){
    toast('消しました');
    if(rec) navReplace('mesh', rec.unit_uuid); else goBack();
  }
}

/* 代表値・河床材料の割合・岸のカバーをまとめて保存する */
function saveEnv(u){
  const rec = DB.liveUnit(u); if(!rec) return;
  const checks = [['代表の水深', strVal('#e_drep'), 0, 2000],
                  ['代表の流速', strVal('#e_vrep'), 0, 10]];
  OPT.substrate.forEach(k=>checks.push([k+'の割合', strVal('#sp_'+SUBSTRATE_NO[k]), 0, 100]));
  ['left','right'].forEach(side=>{
    const label = side==='left' ? '左岸' : '右岸';
    [0,1,2].forEach(i=>checks.push([label+'のカバーの割合', strVal('#cv_'+side+'_'+i), 0, 100]));
    checks.push([label+'のカバーの長さ', strVal('#cv_'+side+'_len'), 0, 100000]);
  });
  const err = rangeCheck(checks);
  if(err){ toast(err); return; }
  rec.depth_rep_cm    = numVal('#e_drep');
  rec.velocity_rep_ms = numVal('#e_vrep');

  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#sp_'+SUBSTRATE_NO[k]); });
  rec.substrate_pct = pct;
  // 割合を入れたなら、多い順の1位2位を代表・2番目にする。
  // 先に空にしておく（割合を全部消したときに、古い2番目が残らないように）
  rec.substrate2 = '';
  const rank = substrateRank({substrate_pct:pct});
  if(rank.length){
    rec.substrate1 = rank[0].name;
    rec.substrate2 = rank[1] ? rank[1].name : '';
  }

  ['left','right'].forEach(side=>{
    const list = [];
    [0,1,2].forEach(i=>{
      const type = strVal('#cv_'+side+'_'+i+'_t');
      const p = numVal('#cv_'+side+'_'+i);
      if(type) list.push({type, pct:p});
    });
    rec['cover_'+side] = list;
    rec['cover_'+side+'_length_m'] = numVal('#cv_'+side+'_len');
  });

  if(DB.put(DB.key.un, rec)){ toast('保存しました'); goBack(); }
}

/* ============================================================
   集計
   ============================================================ */
// 空欄（空白だけも含む）と数でないものは null。空白を 0 にしない
function num(v){
  if(v==null) return null;
  const t=String(v).trim();
  return (t===''||isNaN(+t)) ? null : +t;
}
// 産卵床の欄は、範囲内の値だけを数える（範囲外は「要確認」で記録に残っている）
function saneNum(x, field){
  // 検査（rangeCheckAll）と同じ厳しい読み方（numOf）。'12abc' や空白は数にしない
  const n=numOf(field==='area_m2' ? reddAreaOf(x) : x[field]);
  if(n==='' || !inRange(n, REDD_RANGE[field])) return null;
  return (REDD_WHOLE[field] && !Number.isInteger(n)) ? null : n;   // 個体数の小数は数えない
}
function sumOf(list, field){
  return list.reduce((a,x)=>{ const v=saneNum(x,field); return v==null?a:a+v; }, 0);
}
function avgOf(list, field){
  const vs=list.map(x=>saneNum(x,field)).filter(v=>v!=null);
  return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
}
function rangeOf(list, field){
  const vs=list.map(x=>saneNum(x,field)).filter(v=>v!=null);
  return vs.length ? {min:Math.min(...vs), max:Math.max(...vs), n:vs.length} : null;
}
function countBy(list, field, fallback){
  const m=new Map();
  list.forEach(x=>{ const k=x[field]||fallback; m.set(k,(m.get(k)||0)+1); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
// 空欄は '—'。'' を渡すと (+'') が 0 になり、測っていないものが「0.0」と出てしまう
function fmtNum(v, d){
  if(v==='' || v===null || v===undefined || isNaN(+v)) return '—';
  return (+v).toFixed(d==null?1:d);
}

// 区間ごとの集計。区間長は手入力があればそちらを使う
// 産卵床の数は「産卵床」を含む記録だけを数える。
// 親魚だけ・ホッチャレだけの記録を床数に混ぜると密度が過大になるため
function reachStats(sv){
  const all = DB.reddsOf(sv);
  const build = (name, list, len)=>{
    const redds = list.filter(x=>hasTarget(x,'産卵床'));
    return { name, len, n:redds.length,
      density: len>0 ? redds.length/len*100 : null,
      area: sumOf(redds,'area_m2'),
      fishOnly: list.filter(x=>!hasTarget(x,'産卵床') && hasTarget(x,'親魚')).length,
      carcass: sumOf(list.filter(x=>hasTarget(x,'ホッチャレ')),'carcass_n'),
      species: countBy(redds,'species','種不明') };
  };
  const rows = DB.reachesOf(sv).map(r=>
    build(r.name, all.filter(x=>x.reach_uuid===r.uuid), reachLength(r)));
  const noReach = all.filter(x=>!x.reach_uuid);
  if(noReach.length) rows.push(build('区間なし', noReach, 0));
  return rows;
}

/* 集計画面が実際に使っている項目のうち、範囲外で外した値。
   産卵床の長さ・幅、親魚の雌雄、ホッチャレの数、全記録の水温と測点。
   （reddOddValues は全項目を見るので、集計に出していない項目まで数えてしまう） */
function summaryOddValues(r){
  const keys = ['water_temp_c','intragravel_temp_c'];
  if(hasTarget(r,'産卵床')){
    keys.push('length_cm','width_cm');
    // 長さ・幅が無く保存面積をそのまま使う古い記録は、面積そのものを検査する
    if(reddSizeBlank(r)) keys.push('area_m2');
  }
  if(hasTarget(r,'親魚')) keys.push('female_n','male_n');
  if(hasTarget(r,'ホッチャレ')) keys.push('carcass_n');
  const odd = rangeCheckAll(keys.map(k=>reddRangeItem(k, r[k])));
  envPoints(r).forEach((pt,i)=>{
    rangeCheckAll([[`測点${i+1}の水深`, pt.depth_cm, ENV_RANGE.depth_cm[0], ENV_RANGE.depth_cm[1]],
                   [`測点${i+1}の流速`, pt.velocity_ms, ENV_RANGE.velocity_ms[0], ENV_RANGE.velocity_ms[1]]])
      .forEach(e=>odd.push(e));
  });
  return odd;
}
SCREENS.summary = (sv)=>{
  const s = DB.survey(sv); if(!s) return SCREENS.home();
  const all = DB.reddsOf(sv);
  const redds = all.filter(r=>hasTarget(r,'産卵床'));       // 産卵床を含む記録
  const withFish = all.filter(r=>hasTarget(r,'親魚'));
  const fishOnly = withFish.filter(r=>!hasTarget(r,'産卵床'));
  const carcass = all.filter(r=>hasTarget(r,'ホッチャレ'));
  const units = DB.unitsOf(sv);
  const rows = reachStats(sv);
  const totalLen = DB.reachesOf(sv).reduce((a,r)=>a+reachLength(r),0);

  const wt = rangeOf(all,'water_temp_c'), igt = rangeOf(all,'intragravel_temp_c');
  // 集計から外した値。記録の数と値の数は別に数える（1件に外した値が2つあることがある）
  const oddPer = all.map(r=>summaryOddValues(r).length);
  const oddN = oddPer.filter(k=>k>0).length, oddValN = oddPer.reduce((a,b)=>a+b,0);
  const areaN = redds.filter(r=>saneNum(r,'area_m2')!=null).length;              // 面積のある産卵床
  const tempLine = (r,label)=> r ? `${label} ${fmtNum(r.min)}〜${fmtNum(r.max)}℃（${r.n}件）` : `${label} —`;

  const reachTable = rows.length ? `
    <div class="tablewrap"><table>
      <tr><th>区間</th><th class="num">区間長</th><th class="num">産卵床</th><th class="num">密度<br>(件/100m)</th><th class="num">親魚のみ</th><th class="num">ホッチャレ</th></tr>
      ${rows.map(r=>`<tr>
        <td>${esc(r.name)}</td>
        <td class="num">${r.len>0?fmtDist(r.len):'—'}</td>
        <td class="num">${r.n}</td>
        <td class="num">${r.density==null?'—':fmtNum(r.density)}</td>
        <td class="num">${r.fishOnly||'—'}</td>
        <td class="num">${r.carcass||'—'}</td>
      </tr>`).join('')}
    </table></div>
    <div class="tiny muted" style="margin-top:8px">密度は「床数 ÷ 区間長 × 100」。区間長が未入力の区間は密度を出せません。</div>`
    : `<div class="empty">区間がありません。</div>`;

  const listTable = (title, pairs)=>`
    <div class="sect">${title}</div>
    ${ pairs.length ? `<div class="tablewrap"><table>
      ${pairs.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v} 件</td></tr>`).join('')}
    </table></div>` : `<div class="small muted">—</div>` }`;

  return {
    title:'集計',
    sub:[{text:s.name},{text:`産卵床 ${redds.length}`}],
    html:`
      <div class="card">
        <div class="row"><div class="grow small muted">産卵床の合計</div>
          <div style="font-weight:700; font-size:20px">${redds.length} 件</div></div>
        <div class="small muted" style="margin-top:8px">
          記録の内訳（全 ${all.length} 件）：産卵床 ${redds.length}（うち親魚を伴う ${withFish.length-fishOnly.length}）
          ／ 親魚のみ ${fishOnly.length} ／ ホッチャレを含む ${carcass.length}
        </div>
        <div class="small muted" style="margin-top:8px">
          歩いた区間の合計 ${totalLen>0?fmtDist(totalLen):'—'}
          ${ totalLen>0 ? `／ 全体の密度 ${fmtNum(redds.length/totalLen*100)} 件/100m` : '' }
        </div>
        <div class="small muted" style="margin-top:4px">
          総面積 ${areaN?fmtNum(sumOf(redds,'area_m2'),2):'—'} m² ／ 平均 ${fmtNum(avgOf(redds,'area_m2'),2)} m²（面積のある ${areaN} 件）
        </div>
        <div class="small muted" style="margin-top:4px">
          平均の大きさ 長さ ${fmtNum(avgOf(redds,'length_cm'),0)} cm ／ 幅 ${fmtNum(avgOf(redds,'width_cm'),0)} cm
        </div>
      </div>

      <div class="sect">区間別</div>
      ${reachTable}

      ${listTable('記録の種類別', countBy(all.map(r=>({t:targetLabel(r)})),'t','—'))}
      ${listTable('河川形態別（産卵床）', countBy(redds,'river_form','未記入'))}
      ${listTable('魚種別（産卵床）', countBy(redds,'species','種不明'))}
      ${listTable('新旧別（産卵床）', countBy(redds,'age_class','未記入'))}
      ${listTable('状態別（産卵床）', countBy(redds,'state','未記入'))}

      <div class="sect">水深・流速</div>
      <div class="card">
        <div class="small">水深 ${statLine(allEnvValues(all,'depth_cm'),'cm',0)}</div>
        <div class="small" style="margin-top:6px">流速 ${statLine(allEnvValues(all,'velocity_ms'),'m/s',2)}</div>
        <div class="tiny muted" style="margin-top:6px">1つの記録に複数の測点がある場合、すべての測点をまとめた値です。</div>
      </div>

      ${ units.length ? `
      <div class="sect">物理環境（環境区分ごと）</div>
      <div class="tablewrap"><table>
        <tr><th>環境区分</th><th class="num">件数</th><th class="num">延長</th><th class="num">代表水深</th><th class="num">代表流速</th><th>主な河床材料</th></tr>
        ${OPT.habitat.map(f=>{
          // 環境区分は複数選べる。延長が二重に数えられないよう、いちばん先頭の区分だけで数える
          const list = units.filter(x=>habitatList(x.habitat_type)[0]===f);
          if(!list.length) return '';
          const lens = list.map(x=>unitLengths(x).used).filter(x=>x!=='' && isFinite(x));
          const len = lens.length ? lens.reduce((a,b)=>a+b,0) : '';
          const d = nums(list.map(x=>unitDepth(x).rep));
          const v = nums(list.map(x=>unitVelocity(x).rep));
          const mats = countBy(list.map(x=>({m:x.substrate1||'未記入'})),'m','未記入');
          return `<tr><td>${esc(f)}</td><td class="num">${list.length}</td>
            <td class="num">${esc(fmtDist(len))}</td>
            <td class="num">${d.length?fmtNum(d.reduce((a,b)=>a+b,0)/d.length,0)+'cm':'—'}</td>
            <td class="num">${v.length?fmtNum(v.reduce((a,b)=>a+b,0)/v.length,2)+'m/s':'—'}</td>
            <td>${esc(mats.map(([k,n])=>`${k}${n>1?`(${n})`:''}`).join('・'))}</td></tr>`;
        }).join('')}
        ${(()=>{
          const rest = units.filter(x=>!habitatList(x.habitat_type).length);
          return rest.length ? `<tr><td>未記入</td><td class="num">${rest.length}</td>
            <td class="num">—</td><td class="num">—</td><td class="num">—</td><td>—</td></tr>` : '';
        })()}
      </table></div>
      <div class="tiny muted" style="margin-top:8px">代表水深・代表流速は、各記録の代表値を平均したものです。
        環境区分を複数選んだ記録は、いちばん先頭の区分で数えています。</div>
      ` : '' }

      <div class="sect">水温</div>
      <div class="card">
        <div class="small">${tempLine(wt,'河川水温')}</div>
        <div class="small" style="margin-top:6px">${tempLine(igt,'河床内水温')}</div>
      </div>

      <div class="sect">親魚・ホッチャレ</div>
      <div class="card">
        <div class="small">雌 ${sumOf(withFish,'female_n')} 尾 ／ 雄 ${sumOf(withFish,'male_n')} 尾（親魚の記録 ${withFish.length} 件）</div>
        <div class="small" style="margin-top:6px">ホッチャレ ${sumOf(carcass,'carcass_n')} 尾（${carcass.length} 件）</div>
      </div>

      <div class="sect">確認が必要な記録</div>
      <div class="card"><div class="small">要確認 ${all.filter(r=>r.needs_review).length} 件 ／ 魚種が未記入 ${all.filter(r=>!r.species).length} 件</div>
        ${ oddN ? `<div class="small" style="margin-top:6px">集計から外した値がある記録 ${oddN} 件（外した値 ${oddValN} 個）
          <span class="tiny muted">（その値は上の集計に入れていません。記録を開いて直してください）</span></div>` : '' }</div>

      <div class="tiny muted" style="margin-top:14px">
        同じ産卵床を重ねて数えている可能性があります。合計の床数がそのまま産卵尾数を表すわけではありません。
      </div>`
  };
};

</script>

<!-- ============================================================
     3. 地図・書き出し・ゴミ箱・起動
     ============================================================ -->
<script>
/* ============================================================
   地図
   背景は国土地理院のタイル。既定は航空写真（瀬・淵や州の位置が見えるため）。
   一度表示した範囲はキャッシュされ、圏外でも同じ場所なら表示できる。
   ============================================================ */
const BASEMAPS = {
  '航空写真': { url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', max:18 },
  '地形図'  : { url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', max:18 },
  '淡色地図': { url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', max:18 },
};
const GSI_ATTR = '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>';
function baseMapName(){ const v=localStorage.getItem('rd_basemap'); return BASEMAPS[v]?v:'航空写真'; }

/* ============================================================
   オフライン地図の保存（範囲を囲って先に落としておく）
   スクロール任せだと「どこまで保存できたか」が分からないので、
   四角で範囲を決めて、その中のタイルをまとめて保存する。
   保存分は Service Worker の PACK_CACHE に入り、自動では消えない。
   ============================================================ */
const PACK_MAXZOOM = 16;     // これ以上は落とさない（枚数が急増するため）
const PACK_MINZOOM = 12;     // 全体像が分かる粗さから
const PACK_TILE_KB = { '航空写真':20, '地形図':12, '淡色地図':10 };   // 見積り用の1枚あたりKB
const PACK_WARN_TILES = 12000;   // これを超えたら強く警告

// 緯度経度 → タイル番号
function lon2tx(lon,z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2ty(lat,z){ const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
// タイル番号 → そのタイルの北西角の緯度経度（タイルの範囲を出すのに使う）
function tx2lon(x,z){ return x/Math.pow(2,z)*360-180; }
function ty2lat(y,z){ const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }

// 多角形の外周（緯度経度の点の配列）から、その形にかかるタイルだけを選ぶ。
// タイルの四隅か中心が多角形の内側にあれば「かかっている」とみなす。
function polyBounds(poly){
  let s=90,n=-90,w=180,e=-180;
  poly.forEach(p=>{ s=Math.min(s,p[0]); n=Math.max(n,p[0]); w=Math.min(w,p[1]); e=Math.max(e,p[1]); });
  return {s,n,w,e};
}
function pointInPoly(lat, lon, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function tileHitsPoly(x,y,z,poly){
  const latN=ty2lat(y,z), latS=ty2lat(y+1,z), lonW=tx2lon(x,z), lonE=tx2lon(x+1,z);
  // タイルの4隅・中心のどれかが多角形内なら採用
  const pts=[[latN,lonW],[latN,lonE],[latS,lonW],[latS,lonE],[(latN+latS)/2,(lonW+lonE)/2]];
  if(pts.some(p=>pointInPoly(p[0],p[1],poly))) return true;
  // 逆に、多角形の頂点がタイルの中に入る場合も採用（細い多角形の取りこぼし防止）
  return poly.some(p=>p[0]<=latN && p[0]>=latS && p[1]>=lonW && p[1]<=lonE);
}

function packStore(){ try{ return JSON.parse(localStorage.getItem('rd_map_packs')||'[]'); }catch(e){ return []; } }
function packSave(list){ try{ localStorage.setItem('rd_map_packs', JSON.stringify(list)); }catch(e){} }

// bbox={s,w,n,e}, zmax, layers=['航空写真',...] から、落とすタイルURLの一覧を作る
// 保存するタイルの (z,x,y) 一覧。poly があればその形にかかるマスだけ、
// 無ければ矩形 bbox の全マス（後方互換）。
function packTiles(area, zmax){
  const zTop = Math.min(zmax, PACK_MAXZOOM);
  const poly = (area && area.poly && area.poly.length>=3) ? area.poly : null;
  const bb = poly ? polyBounds(poly) : area;   // area 自体が {s,n,w,e} の場合も受ける
  const out=[];
  for(let z=PACK_MINZOOM; z<=zTop; z++){
    const x0=lon2tx(bb.w,z), x1=lon2tx(bb.e,z);
    const y0=lat2ty(bb.n,z), y1=lat2ty(bb.s,z);
    for(let x=Math.min(x0,x1); x<=Math.max(x0,x1); x++)
      for(let y=Math.min(y0,y1); y<=Math.max(y0,y1); y++)
        if(!poly || tileHitsPoly(x,y,z,poly)) out.push([z,x,y]);
  }
  return out;
}
function packTileUrls(area, zmax, layers){
  const tiles = packTiles(area, zmax);
  const urls=[];
  layers.forEach(name=>{
    const b=BASEMAPS[name]; if(!b) return;
    tiles.forEach(([z,x,y])=>urls.push(b.url.replace('{z}',z).replace('{x}',x).replace('{y}',y)));
  });
  return urls;
}
// 見積り（枚数と、種類ごとの重みで概算したMB）
function packEstimate(area, zmax, layers){
  const tiles = packTiles(area, zmax);
  const urls = packTileUrls(area, zmax, layers);
  // ズームごとの枚数に、種類ごとの重みをかけてMBを概算
  const perZoom={};
  tiles.forEach(([z])=>{ perZoom[z]=(perZoom[z]||0)+1; });
  let kb=0;
  layers.forEach(name=>{ const w=PACK_TILE_KB[name]||15;
    Object.keys(perZoom).forEach(z=>{ kb += perZoom[z]*w; }); });
  return { count:urls.length, mb: kb/1024, urls };
}

// Service Worker への依頼（保存・計測・削除）。返事を待つ
function swAsk(msg, transferUrls){
  return new Promise((res,rej)=>{
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(!sw){ rej(new Error('no-sw')); return; }
    const ch = new MessageChannel();
    ch.port1.onmessage = e => res(e.data);
    sw.postMessage(msg, [ch.port2]);
  });
}
let PACK_DL = null;   // ダウンロード中の状態（中断用）

// 背景地図の切り替え。
// Leaflet 標準の切替コントロールは画像アイコン（images/layers.png）を使うが、
// その画像を同梱していないため「？」に化けて何のボタンか分からなかった。
// 画像に頼らず、地図名をそのまま出す文字ボタンにする。
function baseMapButtonsHtml(){
  const cur = baseMapName();
  // ドローン写真があるときだけ、出す／消すのボタンを同じ列に足す
  const ortho = orthoList().some(o=>!o.broken) ? orthoButtonHtml() : '';
  return `<div class="seg basemap">` + Object.keys(BASEMAPS).map(n=>
    `<button type="button" class="${n===cur?'on':''}" onclick="switchBaseMap(this,'${n}')">${n}</button>`
  ).join('') + ortho + `</div>`;
}
// 画面に出ている地図をまとめて返す。ここを経由しないと、地図を増やしたときに切替が効かなくなる
function allMaps(){ return [MAP, ENVMAP, OMAP].filter(Boolean); }
function applyBaseMap(map, name){
  if(!map) return;
  const b = BASEMAPS[name] || BASEMAPS['航空写真'];
  if(map._baseLayer){ try{ map.removeLayer(map._baseLayer); }catch(e){} }
  // crossOrigin を付けないと画像が「中身を見ない」応答になり、Service Worker が
  // タイルをキャッシュできず、圏外で背景地図が出なくなる（地理院タイルはCORS対応済み）
  // 地理院タイルは18までしか無い。そこから先は引き伸ばして寄れるようにする
  map._baseLayer = L.tileLayer(b.url, {maxZoom:MAP_MAX_ZOOM, maxNativeZoom:b.max,
    crossOrigin:'anonymous', attribution:GSI_ATTR}).addTo(map);
  // タイルが無かったら、上の段のタイルを切り出して埋める
  map._baseLayer.on('tileerror', ev=>{
    try{ tileErrorFill(ev.tile, ev.coords, b.url, 1); }catch(e){}
  });
  if(map._baseLayer.bringToBack) map._baseLayer.bringToBack();
  applyOrthos(map);   // ドローン写真も重ねる（地図を作る場所はすべてここを通る）
}
function switchBaseMap(btn, name){
  if(!BASEMAPS[name]) return;
  localStorage.setItem('rd_basemap', name);
  // 同じ画面に地図が2つ出ることはないが、両方に効かせておく
  allMaps().forEach(m=>applyBaseMap(m, name));
  // 押したボタンだけでなく、画面内のすべての切替ボタンの表示を合わせる
  // （同じ列にあるドローン写真のボタンは、基図ではないので触らない）
  $$('.seg.basemap button:not([data-ortho])').forEach(b=>b.classList.toggle('on', b.textContent===name));
}
/* ============================================================
   地図の土台（魚類調査アプリと同じ作り）
   ・指2本でひねると回る。北の針と「自分の向きを上にする」ボタン
   ・地図の上に置く記号ボタン（画像を使わず、その場で描く図）
   ・現在地ボタン
   ・タイルが無い段は、上の段を切り出して埋める
   ============================================================ */
/* 地図を寄せられる上限。タイルは18までなので、その先は引き伸ばして見せる。
   小さい川では写真がぼやけても、マスの線や印はくっきり大きくなる */
const MAP_MAX_ZOOM = 24;
/* この端末で地図を回せるか。部品が読めていれば回せる */
function canRotate(){
  return !!(window.L && L.Map && L.Map.prototype
    && typeof L.Map.prototype.setBearing === 'function');
}
function makeMap(elId, center, zoom, bearing){
  const el = document.getElementById(elId);
  if(!el || !window.L) return null;
  const opt = {zoomControl:true, attributionControl:true, maxZoom:MAP_MAX_ZOOM};
  if(canRotate()){
    // 指2本でひねると回る。自前の向きボタンを出すので、部品のボタンは出さない
    opt.rotate = true; opt.rotateControl = false;
    opt.touchRotate = true; opt.shiftKeyRotate = true;
    opt.bearing = numOf(bearing)==='' ? 0 : numOf(bearing);
  }
  const m = L.map(el, opt).setView(center||[43.5,142.5], zoom||14);
  if(canRotate()) addCompassControls(m);
  return m;
}
/* 地図の向き（北から時計回りの度）。回せない端末では 0 */
function mapBearing(map){
  try{ return (map && typeof map.getBearing==='function') ? map.getBearing() : 0; }
  catch(e){ return 0; }
}
/* 方位。北の針（押すと北が上に戻る）と、自分の向きに合わせる印 */
let COMPASS_ON = false, COMPASS_HANDLER = null, COMPASS_EV = 'deviceorientation';
let COMPASS_GEN = 0;
function addCompassControls(map){
  const C = L.Control.extend({
    options:{position:'topright'},
    onAdd(){
      const d = L.DomUtil.create('div','leaflet-bar mapicons');
      // 北の針。地図が回れば、北もその分だけ回った先にある
      const n = L.DomUtil.create('a','',d);
      n.href='#'; n.title='北を上に戻す'; n.setAttribute('aria-label','北を上に戻す');
      n.innerHTML = iconSvg('north');
      const upd = ()=>{
        const g = n.querySelector('svg');
        if(g) g.style.transform = 'rotate(' + mapBearing(map) + 'deg)';
      };
      map.on('rotate', upd); upd();
      L.DomEvent.on(n,'click',ev=>{
        L.DomEvent.stop(ev);
        compassStop();
        try{ map.setBearing(0); }catch(e){}
        upd();
        toast('北を上に戻しました');
      });
      // 自分の向きを上にする
      const c = L.DomUtil.create('a','',d);
      c.href='#'; c.title='自分の向きを上にする';
      c.setAttribute('aria-label','自分の向きを上にする');
      c.dataset.k = 'compass';
      c.innerHTML = iconSvg('compass');
      if(COMPASS_ON) c.classList.add('on');
      L.DomEvent.on(c,'click',ev=>{ L.DomEvent.stop(ev); compassToggle(map); });
      L.DomEvent.disableClickPropagation(d);
      return d;
    }
  });
  const ctl = new C();
  ctl.addTo(map);
  return ctl;
}
function compassMark(on){
  document.querySelectorAll('.mapicons a[data-k="compass"]').forEach(a=>{
    a.classList.toggle('on', !!on);
  });
}
function compassStop(){
  if(COMPASS_HANDLER){
    try{ window.removeEventListener(COMPASS_EV, COMPASS_HANDLER); }catch(e){}
    COMPASS_HANDLER = null;
  }
  COMPASS_ON = false;
  COMPASS_GEN++;            // 待っている許可が、あとから効かないように
  compassMark(false);
}
/* 端末の向き（北から時計回りの度）を出す。
   水平に持ったときは「上端の向き」、立てて持ったときは「画面の裏＝見ている向き」を使う。
   どちらか一方だけだと、持ち方によって出せない・大きくずれる */
function headingOf(e){
  if(typeof e.webkitCompassHeading === 'number' && isFinite(e.webkitCompassHeading)){
    return e.webkitCompassHeading;
  }
  if(!(e.absolute === true || COMPASS_EV === 'deviceorientationabsolute')) return null;
  const a = e.alpha, b = e.beta, g = e.gamma;
  if(!isFinite(a)) return null;
  if(!isFinite(b) || !isFinite(g)) return (360 - a) % 360;
  const d = Math.PI/180;
  const cA=Math.cos(a*d), sA=Math.sin(a*d), cB=Math.cos(b*d), sB=Math.sin(b*d),
        cG=Math.cos(g*d), sG=Math.sin(g*d);
  const Ey = -sA*cB, Ny = cA*cB;                    // 端末の上端が向く方向
  if(Math.hypot(Ey, Ny) > 0.15) return (Math.atan2(Ey, Ny)/d + 360) % 360;
  const Ez = sG*cA + sB*cG*sA, Nz = sG*sA - sB*cG*cA;   // ほぼ立てて持っているとき
  return (Math.atan2(-Ez, -Nz)/d + 360) % 360;
}
function compassStart(map){
  const gen = ++COMPASS_GEN;
  COMPASS_EV = ('ondeviceorientationabsolute' in window)
    ? 'deviceorientationabsolute' : 'deviceorientation';
  let got = false, prev = null;
  COMPASS_HANDLER = (e)=>{
    if(gen !== COMPASS_GEN) return;
    const h = headingOf(e);
    if(h === null) return;
    if(!got){
      got = true;
      compassMark(true);
      toast('自分の向きが画面の上になります（もう一度押すと戻ります）');
    }
    // 2度未満の揺れは無視する（じっとしていても地図が震える）
    if(prev !== null && Math.abs(((h - prev + 540) % 360) - 180) < 2) return;
    prev = h;
    try{ map.setBearing(-h); }catch(err){}
  };
  window.addEventListener(COMPASS_EV, COMPASS_HANDLER);
  COMPASS_ON = true;
  compassMark(true);
  toast('方位を確かめています…');
  // 何も届かない端末（方位計が無い等）では、そのまま待たせない
  setTimeout(()=>{
    if(gen === COMPASS_GEN && COMPASS_ON && !got){
      compassStop();
      toast('この端末では方位を取れませんでした。指2本でひねると手で回せます');
    }
  }, 4000);
}
function compassToggle(map){
  if(COMPASS_ON || COMPASS_HANDLER){
    compassStop();
    toast('向きに合わせるのをやめました（地図の向きはそのまま）');
    return;
  }
  if(!canRotate()){ toast('この端末では地図を回せません'); return; }
  // iPhone は、押した流れの中でしか許可を聞けない
  const D = window.DeviceOrientationEvent;
  if(D && typeof D.requestPermission === 'function'){
    D.requestPermission().then(r=>{
      if(r === 'granted') compassStart(map);
      else toast('方位を使う許可が下りませんでした');
    }).catch(()=>toast('方位を使えませんでした'));
    return;
  }
  compassStart(map);
}

/* 上の段のどのタイルの、どの部分を切り出すか */
function tileParentInfo(z, x, y, up){
  const size = 256 >> up;                 // 切り出す幅（ピクセル）
  return { z: z - up, x: x >> up, y: y >> up,
    sx: (x - ((x >> up) << up)) * size,
    sy: (y - ((y >> up) << up)) * size,
    size };
}
/* 失敗したタイルの場所に、上の段のタイルを切り出して入れる。
   上の段も無ければ、さらに上を試す（4段まで）。
   航空写真は場所によって17段階までしか無く、そこへ寄ると真っ暗になっていた */
function tileErrorFill(img, coords, url, up){
  if(!img || !coords || up > 4) return;
  const c = { z: coords.z, x: coords.x, y: coords.y };
  const par = tileParentInfo(c.z, c.x, c.y, up);
  if(par.z < 5) return;
  const src = url.replace('{z}', par.z).replace('{x}', par.x).replace('{y}', par.y);
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = ()=>{
    try{
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(im, par.sx, par.sy, par.size, par.size, 0, 0, 256, 256);
      img.src = cv.toDataURL();
    }catch(e){ tileErrorFill(img, coords, url, up+1); }
  };
  im.onerror = ()=>tileErrorFill(img, coords, url, up+1);
  im.src = src;
}

/* いまいる場所の印 */
let MEMARK = [];
const ME_MAX_ACC = 500;      // これより粗い位置は、輪を描いても意味がない
function meIcon(){
  return L.divIcon({className:'', iconSize:[20,20], iconAnchor:[10,10],
    html:`<div style="width:14px;height:14px;border-radius:50%;background:#2f81f7;
      border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 1px 4px rgba(0,0,0,.6)"
      ></div>`});
}
/* いまいる場所を描き直す。
   取ったばかりの位置があれば、それを使う（取り直すと、飛んだ先と印がずれる） */
function drawMe(map, fix){
  if(!map) return false;
  try{ MEMARK.forEach(x=>map.removeLayer(x)); }catch(e){}
  MEMARK = [];
  const f = fix || freshFix(20000);
  if(!f) return false;
  const pt = [f.lat, f.lon];
  if(!validPt(pt)) return false;
  // どれくらい確かか。粗すぎるときは輪を出さない（画面が青一色になる）
  if(f.acc > 0 && f.acc <= ME_MAX_ACC){
    MEMARK.push(L.circle(pt, {radius:f.acc, color:'#2f81f7', weight:1,
      fillColor:'#2f81f7', fillOpacity:.08, interactive:false}).addTo(map));
  }
  MEMARK.push(L.marker(pt, {icon:meIcon(), interactive:false,
    zIndexOffset:2000}).addTo(map));
  return true;
}

        ${fmtDist(wm)} × ${fmtDist(hm)} ／ ${esc(o.w)}×${esc(o.h)}px${o.shrunk?'（縮めて保存）':''}
        ／ 約${((o.size||0)/1024/1024).toFixed(1)}MB ／ ${fmtDate(o.added_at)}取り込み</div>
      <div class="tiny muted">北西 ${fixCoord(b.n)}, ${fixCoord(b.w)} ／ 南東 ${fixCoord(b.s)}, ${fixCoord(b.e)}</div>`}
    </div>`; }).join('');
  return {
    title:'ドローン写真',
    sub:[{text:`${list.length}枚`}],
    html:`
      <div class="card"><div class="small">
        PC（QGIS）で位置合わせした写真を、地図に重ねます。<br>
        画像（PNG/JPG）と一緒に書き出されるワールドファイル（.pgw / .jgw / .wld）を、
        <b>画像と2つ同時に選んで</b>ください（a.png と a.pgw のように同じ名前の組）。<br>
        北が上で、EPSG:3857（Webメルカトル）で書き出したもの。大きさは長辺 ${ORTHO_MAX_PX}px まで。
        作り方は PC 側の手引き（docs/ドローン写真の用意.md）にあります。
      </div></div>
      <input type="file" id="fOrthoIn" multiple style="display:none" onchange="orthoImport(this)">
      <button class="btn primary" onclick="document.getElementById('fOrthoIn').click()">取り込む（画像＋ワールドファイル）</button>
      <div class="sect">地図での見え方</div>
      <label class="field"><span class="lab">透過</span>
        <div onclick="setTimeout(()=>orthoSetOpacity(segVal('orthoOpacity')),0)">${segHtml('orthoOpacity', Object.keys(ORTHO_OPACITY), orthoOpacityName())}</div></label>
      <div class="tiny muted">出す／消すは、地図の上の「ドローン写真」ボタンで切り替えます（いまは「${orthoShown()?'出す':'消す'}」）。</div>
      ${list.length ? `<div class="sect">取り込み済み（${list.length}）</div>${cards}` : '<div class="empty">まだありません。</div>'}
      <div class="tiny muted">バックアップには入りません（PC に元があるため）。端末を変えたら入れ直してください。</div>`
  };
};

function initOfflineMap(sv){
  closeOfflineMap();
  if(typeof L==='undefined' || !$('#omap')) return;
  OMAP = L.map('omap', { zoomControl:true });
  applyBaseMap(OMAP, baseMapName());
  // 記録済みの産卵床・区間を薄く出して、どこを保存すればいいか分かるように
  const group = L.featureGroup().addTo(OMAP);
  DB.reddsOf(sv).forEach(r=>{ const p=ptOf(r.latitude,r.longitude);
    if(p) L.circleMarker(p,{radius:4,color:'#9aa8b4',weight:1,fillOpacity:.4}).addTo(group); });
  DB.reachesOf(sv).forEach(r=>{ const pts=(r.track||[]).filter(validPt);
    if(pts.length>=2) L.polyline(pts,{color:'#4aa3dd',weight:3,opacity:.5}).addTo(group); });
  // 既に保存済みの範囲を形で見せる（多角形なら多角形、古い四角なら四角）
  packStore().forEach(p=>{
    if(p.poly && p.poly.length>=3)
      L.polygon(p.poly, {color:'#4ec38a',weight:1,fillOpacity:.05,dashArray:'4,4'}).addTo(OMAP);
    else if(p.bbox)
      L.rectangle([[p.bbox.s,p.bbox.w],[p.bbox.n,p.bbox.e]],
        {color:'#4ec38a',weight:1,fillOpacity:.05,dashArray:'4,4'}).addTo(OMAP);
  });

  let center=[43.5,142.5], zoom=9;
  if(group.getLayers().length){ try{ const b=group.getBounds(); center=b.getCenter(); zoom=13; }catch(e){} }
  else if(lastFix){ center=[lastFix.lat,lastFix.lon]; zoom=13; }
  OMAP.setView(center, zoom);
  OMAP.on('click', e=>offlineAddCorner(e.latlng.lat, e.latlng.lng));
  setTimeout(()=>{ if(OMAP) OMAP.invalidateSize(); }, 60);
}
function offlineAddCorner(lat, lon){
  OMAP_PTS.push([lat,lon]);
  offlineRedrawShape();
  if(OMAP_PTS.length>=3) offlineEstimate();
}
function offlineUndoCorner(){ OMAP_PTS.pop(); offlineRedrawShape();
  if(OMAP_PTS.length>=3) offlineEstimate(); else offlineClearEst(); }
// いま囲っている多角形（3点以上のとき）
function currentPoly(){ return OMAP_PTS.length>=3 ? OMAP_PTS.slice() : null; }
function offlineRedrawShape(){
  if(OMAP_SHAPE){ try{ OMAP.removeLayer(OMAP_SHAPE); }catch(e){} OMAP_SHAPE=null; }
  OMAP_DOTS.forEach(d=>{ try{ OMAP.removeLayer(d); }catch(e){} }); OMAP_DOTS=[];
  // 打った点を小さな丸で見せる（消したり戻したりが分かるように）
  OMAP_PTS.forEach((p,i)=>{ OMAP_DOTS.push(
    L.circleMarker(p,{radius:5,color:'#e0a030',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(OMAP)); });
  if(OMAP_PTS.length>=3)
    OMAP_SHAPE=L.polygon(OMAP_PTS,{color:'#e0a030',weight:2,fillOpacity:.12}).addTo(OMAP);
  else if(OMAP_PTS.length===2)
    OMAP_SHAPE=L.polyline(OMAP_PTS,{color:'#e0a030',weight:2,dashArray:'5,5'}).addTo(OMAP);
}
function offlineUseView(){
  if(!OMAP) return;
  const b=OMAP.getBounds();
  // 画面いっぱいの四角を、4点の多角形として置く
  OMAP_PTS=[[b.getNorth(),b.getWest()],[b.getNorth(),b.getEast()],
            [b.getSouth(),b.getEast()],[b.getSouth(),b.getWest()]];
  offlineRedrawShape(); offlineEstimate();
}
function offlineClearEst(){ const el=$('#omapEst');
  if(el) el.innerHTML='<div class="small muted">3点以上囲むと、枚数と容量の見積りが出ます。</div>'; }
function offlineClearRect(){ OMAP_PTS=[]; offlineRedrawShape(); offlineClearEst(); }
function offlineZoomMax(){ const v=segVal('omapZoom')||''; const m=v.match(/z(\d+)/); return m?+m[1]:PACK_MAXZOOM; }
function offlineLayers(){ const l=segMultiVal('omapLayers'); return l.length?l:[baseMapName()]; }
function offlineEstimate(){
  const el=$('#omapEst'); if(!el) return;
  const poly=currentPoly();
  if(!poly){ offlineClearEst(); return; }
  const est = packEstimate({poly}, offlineZoomMax(), offlineLayers());
  const min = Math.max(1, Math.round(est.count/300));   // 控えめ並行での概算（1枚≈0.2秒相当）
  const warn = est.count>PACK_WARN_TILES;
  el.innerHTML = `<div class="small"><b>約 ${est.count.toLocaleString()} 枚 ／ 約 ${est.mb.toFixed(0)} MB</b>
    <span class="muted">（ダウンロード目安 ${min}分前後）</span></div>
    ${ warn ? `<div class="small" style="color:var(--warn); margin-top:6px">
      範囲が広い／細かすぎます。四角を小さくするか、細かさを下げると軽くなります。</div>` : '' }
    <div class="tiny muted" style="margin-top:6px">${esc(offlineLayers().join('・'))}／z${PACK_MINZOOM}〜${offlineZoomMax()}</div>`;
}
async function offlineSave(sv){
  const poly=currentPoly();
  if(!poly){ toast('先に地図で3点以上囲んでください'); return; }
  if(!(navigator.serviceWorker && navigator.serviceWorker.controller)){
    toast('この環境では保存できません（公開URLをホーム画面に追加して使ってください）'); return; }
  const layers=offlineLayers(), zmax=offlineZoomMax();
  const area={poly};
  const est=packEstimate(area, zmax, layers);
  if(est.count > 40000){ alert('範囲が大きすぎます（約'+est.count.toLocaleString()+'枚）。四角を小さくするか、細かさを下げてください。'); return; }
  if(est.count > PACK_WARN_TILES && !confirm(`約 ${est.count.toLocaleString()} 枚（${est.mb.toFixed(0)}MB）を保存します。時間がかかり、端末の空きも使います。続けますか？`)) return;

  const btn=$('#omapSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  const prog=$('#omapProg');
  PACK_DL={ abort:false };
  const urls=est.urls, CH=60; let done=0, ok=0, fail=0;
  if(prog) prog.innerHTML=`<div class="card"><div class="small" id="omapProgTxt">準備中…</div>
    <button class="btn ghost small" style="margin-top:8px" onclick="offlineAbort()">中断</button></div>`;
  for(let i=0;i<urls.length && !PACK_DL.abort;i+=CH){
    const chunk=urls.slice(i,i+CH);
    try{ const r=await swAsk({type:'savePackTiles', urls:chunk}); ok+=r.ok||0; fail+=r.fail||0; }
    catch(e){ fail+=chunk.length; }
    done+=chunk.length;
    const t=$('#omapProgTxt');
    if(t) t.textContent=`${Math.min(done,urls.length).toLocaleString()} / ${urls.length.toLocaleString()} 枚`
      + (fail?`（取れなかった ${fail} 枚）`:'');
  }
  const aborted=PACK_DL.abort; PACK_DL=null;
  if(btn){ btn.disabled=false; btn.textContent='この範囲を保存'; }
  if(aborted){ toast('中断しました（そこまでの分は保存済みです）'); }
  else{
    // パックの記録を残す（一覧・削除・地図表示に使う）
    const list=packStore();
    list.unshift({ id:uuid(), name:(s=>s.river_name||s.name)(DB.survey(sv)||{}),
      poly, bbox:polyBounds(poly),
      zmin:PACK_MINZOOM, zmax, layers, count:est.count, mb:est.mb, saved_at:nowISO() });
    packSave(list);
    toast(`保存しました（${ok.toLocaleString()}枚${fail?`／取れなかった ${fail}枚`:''}）`);
  }
  render();
}
function offlineAbort(){ if(PACK_DL) PACK_DL.abort=true; }
async function deleteMapPack(id){
  const list=packStore(); const p=list.find(x=>x.id===id); if(!p) return;
  if(!confirm(`「${p.name||'保存範囲'}」の地図（約${p.mb.toFixed(0)}MB）を消しますか？`)) return;
  const area = (p.poly && p.poly.length>=3) ? {poly:p.poly} : p.bbox;
  try{ await swAsk({type:'deletePack', urls:packTileUrls(area, p.zmax, p.layers)}); }catch(e){}
  packSave(list.filter(x=>x.id!==id));
  toast('消しました');
  render();
}
async function offlineStats(){
  const el=$('#omapStats'); if(el) el.textContent='確認中…';
  try{ const r=await swAsk({type:'packStats'});
    if(el) el.textContent=`実際の保存量：${(r.count||0).toLocaleString()}枚 ／ ${((r.bytes||0)/1024/1024).toFixed(0)}MB`;
  }catch(e){ if(el) el.textContent='確認できませんでした'; }
}

function drawMap(sv){
  destroyMap();
  if(typeof L === 'undefined'){ toast('地図を読み込めませんでした'); return; }
  const redds = DB.reddsOf(sv).filter(r=>validPt([parseFloat(r.latitude), parseFloat(r.longitude)]));
  const reaches = DB.reachesOf(sv).filter(r=>(r.track||[]).filter(validPt).length>=2);
  const notes = DB.notesOf(sv).filter(n=>validPt([parseFloat(n.latitude), parseFloat(n.longitude)]));

  MAP = L.map('map', { zoomControl:true }).setView([43.5,142.5], 9);
  applyBaseMap(MAP, baseMapName());

  const group = L.featureGroup().addTo(MAP);

  reaches.forEach(r=>{
    const pts = (r.track||[]).filter(validPt);
    L.polyline(pts, { color:'#4aa3dd', weight:4, opacity:.8 }).addTo(group)
      .bindPopup(`<b>${esc(r.name)}</b><br>区間長 ${fmtDist(reachLength(r))}`);
  });

  // 物理環境を重ねる。点は丸、ラインは太い線、メッシュは四角。
  // 色は「色分け」で選んだ項目。選んでいなければ環境区分の色
  const envRange = envColorRange(sv);
  DB.unitsOf(sv).forEach(u=>{
    const col = envColorOf(u, envRange) || formColor(habitatList(u.habitat_type)[0]);
    const d = unitDepth(u), v = unitVelocity(u);
    const info = esc([d.rep!=='' ? `代表水深 ${fmtNum(d.rep,0)}cm` : '',
                      v.rep!=='' ? `代表流速 ${fmtNum(v.rep,2)}m/s` : '',
                      u.substrate1||''].filter(Boolean).join(' ／ '));
    const go = isMesh(u) ? `nav('mesh','${u.uuid}')`
             : `nav('envMap','${esc(JSON.stringify({sv, record:u.uuid}))}')`;
    const popup = `<b>${esc(u.name||'')}</b>（${esc(envMethod(u))}${
        u.habitat_type?'・'+esc(habitatShort(u.habitat_type)):''}）<br>
      ${isMesh(u) ? `マス ${meshCurrentCells(u).length}` : `区間長 ${esc(fmtDist(unitLengths(u).used))}`}<br>
      ${info}<br>
      <a href="#" onclick="${go}; return false;">この記録を開く</a>`;
    if(isMesh(u)){
      const g = meshGeom(u);
      if(!g) return;
      L.polygon(g.corners, { color:col, weight:2, fillOpacity:.15 }).addTo(group).bindPopup(popup);
    }else if(isLine(u)){
      const path = linePath(u);
      if(path.length < 2) return;
      L.polyline(path, { color:col, weight:7, opacity:.75 }).addTo(group).bindPopup(popup);
    }else{
      const a = ptOf(u.latitude, u.longitude);
      if(!a) return;
      L.circleMarker(a, { radius:7, color:'#fff', weight:2, fillColor:col, fillOpacity:.95 })
        .addTo(group).bindPopup(popup);
    }
  });

  redds.forEach(r=>{
    const col = speciesColor(r.species);
    const pos = [parseFloat(r.latitude), parseFloat(r.longitude)];
    const size = hasTarget(r,'産卵床') && r.length_cm!=='' && r.width_cm!=='' ? `${r.length_cm}×${r.width_cm}cm` : '';
    const popup = `<b>${esc(reddName(r))}</b>
      （${esc(r.reach_uuid?reachName(sv,r.reach_uuid):'区間なし')}）
      <br>${esc(targetLabel(r))}<br>
      ${esc([r.species||'種不明', hasTarget(r,'産卵床')?r.age_class:'', hasTarget(r,'産卵床')?r.state:'', size]
            .filter(Boolean).join(' ／ '))}<br>
      <a href="#" onclick="closeMapPopupAndEdit('${sv}','${r.uuid}'); return false;">この記録を開く</a>`;

    // 産卵床＝丸、親魚のみ＝四角、ホッチャレのみ＝×。種類が形で分かるようにする
    let layer;
    if(hasTarget(r,'産卵床')){
      layer = L.circleMarker(pos, { radius:8, color:col, weight:2, fillColor:col,
                                    fillOpacity:ageOpacity(r.age_class) });
    }else if(hasTarget(r,'親魚')){
      layer = L.marker(pos, { icon: L.divIcon({ className:'', iconSize:[18,18], iconAnchor:[9,9],
        html:`<div style="width:14px;height:14px;background:${col};border:2px solid #fff"></div>` }) });
    }else{
      layer = L.marker(pos, { icon: L.divIcon({ className:'', iconSize:[18,18], iconAnchor:[9,9],
        html:`<div style="color:#fff;font-weight:700;font-size:15px;line-height:14px;
          text-shadow:0 0 3px #000">✕</div>` }) });
    }
    layer.addTo(group).bindPopup(popup);
  });

  notes.forEach(n=>{
    L.marker([parseFloat(n.latitude), parseFloat(n.longitude)], {
      icon: L.divIcon({ className:'', iconSize:[16,16], iconAnchor:[8,8],
        html:`<div style="width:14px;height:14px;background:#e0a030;border:2px solid #fff;border-radius:3px"></div>` })
    }).addTo(group).bindPopup(`<b>${esc(n.category||'メモ')}</b><br>${esc((n.content||'').slice(0,80))}`);
  });

  if(group.getLayers().length){
    try{ MAP.fitBounds(group.getBounds().pad(0.2), {maxZoom:17}); }catch(e){}
  }
  addReddLocateControl();
  if(lastFix) showCurrentPos();
  renderLegend(sv);
}

// この地図は「見る」ための地図。記録を足すのは物理環境の地図にまとめた（v22）
function closeMapPopupAndEdit(sv, u){
  nav('envMap', JSON.stringify({sv, redd:u}));
}

function showCurrentPos(){
  if(!MAP || !lastFix) return;
  if(MAP_LOCATE){ try{ MAP.removeLayer(MAP_LOCATE); }catch(e){} }
  MAP_LOCATE = L.layerGroup([
    L.circle([lastFix.lat,lastFix.lon], { radius:Math.max(5,lastFix.acc), color:'#4aa3dd', weight:1, fillOpacity:.12 }),
    L.circleMarker([lastFix.lat,lastFix.lon], { radius:6, color:'#fff', weight:2, fillColor:'#4aa3dd', fillOpacity:1 })
  ]).addTo(MAP);
}
/* 産卵床の地図だけが使う「現在地」ボタン（文字のボタン）。
   物理環境・メッシュの地図が使う addLocateControl とは別物。
   同じ名前にすると、あとに書いたほうだけが生き残り、
   先に書いたほうを呼んでいる画面が動かなくなる（v19でこれが起きた） */
function addReddLocateControl(){
  const target = MAP;   // 画面を切り替えた後に古い地図を触らないよう、この時点の地図を覚えておく
  const C = L.Control.extend({
    options:{ position:'topleft' },
    onAdd(){
      // 絵文字は端末によって「？」に化けるので文字で出す
      const b = L.DomUtil.create('button','locate-btn');
      b.textContent='現在地'; b.title='現在地へ移動';
      L.DomEvent.on(b,'click', L.DomEvent.stop).on(b,'click',()=>{
        if(!navigator.geolocation){ toast('この端末では位置を取れません'); return; }
        toast('現在地を探しています…');
        navigator.geolocation.getCurrentPosition(p=>{
          lastFix={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
          if(MAP!==target) return;
          showCurrentPos();
          target.setView([lastFix.lat,lastFix.lon], Math.max(target.getZoom(),16));
        }, ()=>toast('現在地を取れませんでした'), {enableHighAccuracy:true, timeout:15000});
      });
      return b;
    }
  });
  MAP.addControl(new C());
}

function renderLegend(sv){
  const box=$('#legend'); if(!box) return;
  const used = [...new Set(DB.reddsOf(sv).map(r=>r.species||'種不明'))];
  const sp = used.map(n=>`<span class="badge" style="border-color:${speciesColor(n==='種不明'?'':n)}">
      <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${speciesColor(n==='種不明'?'':n)};margin-right:6px"></span>${esc(n)}</span>`).join(' ');
  const age = OPT.age.map(a=>`<span class="badge">
      <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#9aa8b4;opacity:${ageOpacity(a)};margin-right:6px"></span>${esc(a)}</span>`).join(' ');
  const kind = `<span class="badge">● 産卵床</span> <span class="badge">■ 親魚のみ</span> <span class="badge">✕ ホッチャレのみ</span>`;
  const forms = OPT.habitat.map(f=>`<span class="badge">
      <span style="display:inline-block;width:16px;height:5px;background:${formColor(f)};margin-right:6px;vertical-align:middle"></span>${esc(f)}</span>`).join(' ');
  // 色分けの基準を選んでいるときは、そちらの凡例を出す（地図の色と食い違わないように）
  const envLeg = envLegendHtml(sv);
  box.innerHTML = `<div class="small muted">記録の種類（形）</div><div style="margin:6px 0 10px">${kind}</div>
    <div class="small muted">物理環境（点＝丸／ライン＝太い線／メッシュ＝四角）</div>
    <div style="margin:6px 0 10px">${envLeg || forms}</div>
    <div class="small muted">魚種（色）</div><div style="margin:6px 0 10px">${sp||'—'}</div>
    <div class="small muted">新旧（塗りの濃さ・産卵床のみ）</div><div style="margin-top:6px">${age}</div>`;
}

/* ============================================================
   書き出し（CSV / GeoJSON / 写真ZIP / バックアップ）
   列の定義は1か所にまとめ、CSVもGeoJSONも同じものを見る（食い違いを防ぐため）。
   ============================================================ */
function download(filename, text, mime){
  downloadBlob(filename, new Blob([text], {type: mime||'text/plain;charset=utf-8'}));
}
function downloadBlob(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function csvCell(v){
  v = v==null ? '' : String(v);
  // Excelの数式として解釈されるのを防ぐ。ただし数値（マイナスの緯度経度など）はそのまま通す
  if(/^[=+\-@\t\r]/.test(v) && !/^[+-]?\d+(\.\d+)?$/.test(v)) v = "'"+v;
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCsv(cols, rows){
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\r\n');
}
function photoFilename(rec, i, p){ return `${rec.uuid}_${i+1}.${(p&&p.ext)||'jpg'}`; }
function exportBase(surveys){
  return surveys.length===1
    ? `ReddSurvey_${(surveys[0].survey_date||'').replace(/-/g,'')}_${(surveys[0].river_name||'').replace(/[\\/:*?"<>|\s]/g,'')}`
    : `ReddSurvey_${dateValue().replace(/-/g,'')}`;
}

function envPointRows(surveys){

    const reaches = DB.reachesOf(s.uuid);

      list.forEach((p,i)=>rows.push({ survey_id:s.uuid, survey_name:s.name,

function exportGeoJSON(surveys){
  const base = exportBase(surveys);
  // 座標は地図と同じ判定（ptOf）。parseFloat だと '43abc' が緯度43の点になってしまう
  const pts = reddRows(surveys)
    .map(r=>({ r, a: ptOf(r.latitude, r.longitude) }))
    .filter(x=>x.a && validPt(x.a))
    .map(({r,a})=>({ type:'Feature',
      geometry:{ type:'Point', coordinates:[a[1], a[0]] },
      properties: REDD_COLS.reduce((p,c)=>{ p[c]=r[c]; return p; }, {}) }));

  const lines=[];
  surveys.forEach(s=>{
    const redds = DB.reddsOf(s.uuid);
    DB.reachesOf(s.uuid).forEach(r=>{
      const pathPts=(r.track||[]).filter(validPt);
      if(pathPts.length<2) return;
      // 属性はCSVと同じ列定義を使う（片方だけ直して食い違うのを防ぐ）
      const row = reachRows([s]).find(x=>x.reach_id===r.uuid) || {};
      lines.push({ type:'Feature',
        geometry:{ type:'LineString', coordinates: pathPts.map(p=>[p[1],p[0]]) },   // GeoJSONは経度,緯度の順
        properties: REACH_COLS.reduce((p,c)=>{ p[c]=row[c]; return p; }, {}) });
    });
  });

  // 物理環境は取り方ごとに形が変わる。点＝Point、ライン＝曲がりを含む LineString、
  // メッシュ＝範囲の四角。属性はCSVと同じ列定義を使う
  const units=[];
  surveys.forEach(s=>{
    const rowOf = {};
    unitRows([s]).forEach(row=>{ rowOf[row.unit_id] = row; });
    DB.unitsOf(s.uuid).forEach(u=>{
      const row = rowOf[u.uuid]; if(!row) return;
      let geom = null;
      if(isMesh(u)){
        const g = meshGeom(u);
        if(g) geom = { type:'Polygon',
          coordinates:[ g.corners.map(p=>[p[1],p[0]]).concat([[g.corners[0][1],g.corners[0][0]]]) ] };
      }else if(isLine(u)){
        const path = linePath(u);
        if(path.length>=2) geom = { type:'LineString', coordinates: path.map(p=>[p[1],p[0]]) };
      }else{
        const a = ptOf(u.latitude, u.longitude);
        if(a) geom = { type:'Point', coordinates:[a[1],a[0]] };
      }
      if(!geom) return;
      units.push({ type:'Feature', geometry:geom,
        properties: unitCols().reduce((p,c)=>{ p[c]=row[c]; return p; }, {}) });
    });
  });
  if(units.length) download(`${base}_habitat_units.geojson`,
    JSON.stringify({type:'FeatureCollection', features:units}, null, 1), 'application/geo+json');

  // メッシュのマスは、中心の点として出す
  const meshFeats = meshRows(surveys)
    .filter(c=>ptOf(c.latitude, c.longitude))
    .map(c=>{ const p=ptOf(c.latitude, c.longitude);
      return { type:'Feature', geometry:{ type:'Point', coordinates:[p[1],p[0]] },
        properties: MESH_COLS.reduce((o,k)=>{ o[k]=c[k]; return o; }, {}) }; });
  if(meshFeats.length) download(`${base}_mesh_cells.geojson`,
    JSON.stringify({type:'FeatureCollection', features:meshFeats}, null, 1), 'application/geo+json');

  // 座標のついた測点も点として出す
  const ptFeats = envPointRows(surveys)
    .filter(p=>ptOf(p.latitude, p.longitude))
    .map(p=>{ const q=ptOf(p.latitude, p.longitude);
      return { type:'Feature', geometry:{ type:'Point', coordinates:[q[1],q[0]] },
        properties: ENVPOINT_COLS.reduce((o,k)=>{ o[k]=p[k]; return o; }, {}) }; });
  if(ptFeats.length) download(`${base}_env_points.geojson`,
    JSON.stringify({type:'FeatureCollection', features:ptFeats}, null, 1), 'application/geo+json');

  // 位置のついたメモも点として出す
  const noteFeats = noteRows(surveys)
    .filter(n=>ptOf(n.latitude, n.longitude))
    .map(n=>{ const p=ptOf(n.latitude, n.longitude);
      return { type:'Feature', geometry:{ type:'Point', coordinates:[p[1],p[0]] },
        properties: NOTE_COLS.reduce((o,c)=>{ o[c]=n[c]; return o; }, {}) }; });
  if(noteFeats.length) download(`${base}_notes.geojson`,
    JSON.stringify({type:'FeatureCollection', features:noteFeats}, null, 1), 'application/geo+json');

  if(!pts.length && !lines.length && !units.length && !noteFeats.length){ toast('位置のついた記録がありません'); return; }
  if(pts.length) download(`${base}_redds.geojson`,
    JSON.stringify({type:'FeatureCollection', features:pts}, null, 1), 'application/geo+json');
  if(lines.length) download(`${base}_reaches.geojson`,
    JSON.stringify({type:'FeatureCollection', features:lines}, null, 1), 'application/geo+json');
  toast('GeoJSONを書き出しました（座標系 EPSG:4326）');
}

/* ---------- 写真ZIP（無圧縮・追加ライブラリ不要） ---------- */
function crc32(u8){ let c=~0>>>0;
  for(let i=0;i<u8.length;i++){ c^=u8[i]; for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320 & -(c&1)); }
  return (~c)>>>0; }
function buildZip(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.u8, crc=crc32(data);
    const lh=[].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(lh), name, data);
    const ch=[].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset));
    central.push({head:new Uint8Array(ch), name});
    offset += lh.length + name.length + data.length;
  });
  const cdStart=offset; let cdSize=0;
  central.forEach(c=>{ parts.push(c.head, c.name); cdSize += c.head.length + c.name.length; });
  parts.push(new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
    u16(central.length), u16(central.length), u32(cdSize), u32(cdStart), u16(0))));
  return new Blob(parts, {type:'application/zip'});
}
async function exportPhotoZip(surveys){
  const items=[];
  surveys.forEach(s=>{
    DB.reddsOf(s.uuid).forEach(r=>(r.photos||[]).forEach((p,i)=>items.push({s, rec:r, p, i, kind:'産卵床'})));
    DB.notesOf(s.uuid).forEach(n=>(n.photos||[]).forEach((p,i)=>items.push({s, rec:n, p, i, kind:'メモ'})));
  });
  if(!items.length){ toast('書き出す写真がありません'); return; }
  const total = items.reduce((a,it)=>a+((it.p&&it.p.size)||0), 0);
  const GB=1024*1024*1024;
  if(total >= 1.5*GB){ toast('写真が多すぎてZIPを作れません（約'+(total/GB).toFixed(1)+'GB）。調査ごとに分けて書き出してください'); return; }
  if(total >= 0.5*GB && !confirm('約'+(total/GB).toFixed(1)+'GBあります。時間がかかり、端末によっては失敗します。続けますか？')) return;

  toast('写真をまとめています…');
  const files=[], idx=[];
  for(const it of items){
    let rec=null; try{ rec=await PhotoDB.get(it.p.id); }catch(e){}
    if(!rec||!rec.blob) continue;
    const name = photoFilename(it.rec, it.i, it.p);
    files.push({ name, u8:new Uint8Array(await rec.blob.arrayBuffer()) });
    idx.push({ file:name, type:it.kind, survey_name:it.s.name,
      redd_no:it.rec.redd_no??'', observed_at:it.rec.observed_at||it.rec.recorded_at||'',
      latitude:it.rec.latitude??'', longitude:it.rec.longitude??'' });
  }
  if(!files.length){ toast('写真の中身が見つかりませんでした'); return; }
  const cols=['file','type','survey_name','redd_no','observed_at','latitude','longitude'];
  files.push({ name:'index.csv', u8:new TextEncoder().encode('﻿'+toCsv(cols, idx)) });
  downloadBlob(`${exportBase(surveys)}_photos.zip`, buildZip(files));
  toast('写真ZIPを書き出しました');
}

/* ---------- バックアップと復元 ---------- */
const CORE_KEYS = ['sv','re','rd','nt','un','mc'];
function buildBackup(){
  const data={};
  CORE_KEYS.forEach(k=>{ data[DB.key[k]] = DB.loadRaw(DB.key[k]); });   // 消したものも含めて丸ごと
  return { app:'redd_survey', version:APP_VERSION, exported_at:nowISO(),
           species: speciesList(), data };
}
// バックアップの中身をユーザーに見せる文言（キーの並びに依存しないよう名前で作る）
const CORE_LABEL = { sv:'調査', re:'区間', rd:'記録', nt:'メモ', un:'物理環境', mc:'メッシュのマス' };
function backupCounts(b){
  return CORE_KEYS.map(k=>`${CORE_LABEL[k]} ${(b.data[DB.key[k]]||[]).length}`).join(' / ');
}
function exportBackup(){
  let b; try{ b=buildBackup(); }
  catch(e){ toast('保存データを読めませんでした。復元は行わないでください'); return; }
  download(`reddsurvey_backup_${dateValue().replace(/-/g,'')}.json`, JSON.stringify(b), 'application/json');
  toast('記録のバックアップを書き出しました（写真は含みません）');
}

/* 写真ごとのまるごとバックアップ。
   記録(backup.json)と写真の実体を1つのZIPに入れ、同じZIPから丸ごと戻せるようにする。
   機種変更のときはこれ1つあればよい。 */
async function exportFullBackup(){
  let b; try{ b=buildBackup(); }
  catch(e){ toast('保存データを読めませんでした。復元は行わないでください'); return; }

  // 参照されている写真だけを集める（消した記録のぶんも含めて、戻せるように）
  const ids=[];
  CORE_KEYS.forEach(k=>{
    (b.data[DB.key[k]]||[]).forEach(x=>(x.photos||[]).forEach(p=>{ if(p&&p.id) ids.push(p.id); }));
  });
  const uniq=[...new Set(ids)];
  toast('まとめています…');
  const files=[{ name:'backup.json', u8:new TextEncoder().encode(JSON.stringify(b)) }];
  const manifest=[];
  let total=0, missing=0;
  for(const id of uniq){
    let rec=null; try{ rec=await PhotoDB.get(id); }catch(e){}
    if(!rec||!rec.blob){ missing++; continue; }
    const name = `photos/${id}.${rec.ext||'jpg'}`;
    files.push({ name, u8:new Uint8Array(await rec.blob.arrayBuffer()) });
    manifest.push({ id, file:name, ext:rec.ext||'jpg', type:(rec.blob.type||'') });
    total += rec.blob.size||0;
  }
  const GB=1024*1024*1024;
  if(total >= 1.5*GB){ toast('写真が多すぎてまとめられません（約'+(total/GB).toFixed(1)+'GB）。調査ごとに書き出してください'); return; }
  files.push({ name:'photos.json', u8:new TextEncoder().encode(JSON.stringify(manifest)) });
  downloadBlob(`reddsurvey_full_${dateValue().replace(/-/g,'')}.zip`, buildZip(files));
  toast(`写真ごと書き出しました（写真 ${manifest.length} 枚${missing?`／見つからない ${missing} 枚`:''}）`);
}

// 記録の取り込み（JSONでもZIPの中のbackup.jsonでも同じ処理を通す）
function applyBackup(b){
  if(!b || b.app!=='redd_survey' || !b.data){ toast('このアプリのバックアップではありません'); return null; }
  let added=0, updated=0, ok=true;
  CORE_KEYS.forEach(k=>{
    const key=DB.key[k];
    const map=new Map(DB.load(key).map(x=>[x.uuid,x]));
    (b.data[key]||[]).forEach(x=>{
      if(!x || !x.uuid) return;
      const old=map.get(x.uuid);
      if(!old){ map.set(x.uuid,x); added++; }
      else if(String(x.updated_at||'') > String(old.updated_at||'')){ map.set(x.uuid,x); updated++; }
    });
    if(!DB.save(key, [...map.values()])) ok=false;
  });
  if(Array.isArray(b.species) && b.species.length) speciesSave(b.species);
  resyncTrack();   // 取り込みで区間の状態が変わっていたら、軌跡の追記先を付け直す
  return {added, updated, ok};
}
function importBackup(input){
  const f=(input.files||[])[0]; input.value='';
  if(!f) return;
  if(/\.zip$/i.test(f.name||'')){ importFullBackup(f); return; }
  const rd=new FileReader();
  rd.onload=()=>{
    let b; try{ b=JSON.parse(rd.result); }catch(e){ toast('ファイルを読めませんでした'); return; }
    if(!b || b.app!=='redd_survey' || !b.data){ toast('このアプリのバックアップではありません'); return; }
    if(!confirm(`取り込みますか？\n${backupCounts(b)}\n\n同じ記録は新しい方（更新日時が後）を残します。`)) return;
    const r = applyBackup(b);
    if(!r) return;
    if(!r.ok){ alert('取り込みの途中で保存できませんでした。端末の空き容量を確認してください。'); }
    toast(`取り込みました（新規 ${r.added} / 更新 ${r.updated}）`);
    reset('home');
  };
  rd.readAsText(f);
}
async function importFullBackup(file){
  let entries;
  try{ entries = parseStoredZip(await file.arrayBuffer()); }
  catch(e){ toast('ZIPを読めませんでした'); return; }
  const dec=new TextDecoder();
  const jsonEntry = entries.find(x=>x.name==='backup.json');
  if(!jsonEntry){ toast('このZIPにはバックアップが入っていません'); return; }
  let b; try{ b=JSON.parse(dec.decode(jsonEntry.data)); }catch(e){ toast('中身を読めませんでした'); return; }
  if(!b || b.app!=='redd_survey' || !b.data){ toast('このアプリのバックアップではありません'); return; }
  const photos = entries.filter(x=>x.name.indexOf('photos/')===0);
  if(!confirm(`取り込みますか？\n${backupCounts(b)}／写真 ${photos.length} 枚\n\n同じ記録は新しい方（更新日時が後）を残します。`)) return;

  toast('取り込んでいます…');
  let saved=0, failed=0;
  for(const e of photos){
    const id = e.name.replace(/^photos\//,'').replace(/\.[^.]+$/,'');
    const ext = (e.name.match(/\.([^.]+)$/)||[])[1] || 'jpg';
    try{
      const cur = await PhotoDB.get(id);
      if(cur && cur.blob){ saved++; continue; }   // すでにある写真はそのまま
      await PhotoDB.put({ id, blob:new Blob([e.data], {type: extMime(ext)}), ext,
                          size:e.data.length, added_at:nowISO() });
      saved++;
    }catch(err){ console.error(err); failed++; }
  }
  const r = applyBackup(b);
  if(!r) return;
  if(!r.ok || failed) alert(`取り込みに一部失敗しました（写真 ${failed} 枚）。端末の空き容量を確認してください。`);
  toast(`取り込みました（新規 ${r.added} / 更新 ${r.updated} / 写真 ${saved} 枚）`);
  reset('home');
}
function extMime(ext){
  return ext==='png' ? 'image/png' : ext==='webp' ? 'image/webp'
       : (ext==='heic'||ext==='heif') ? 'image/heic' : 'image/jpeg';
}
// 無圧縮ZIPを読み解く（buildZip で作ったものが対象）
function parseStoredZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), out=[]; let i=0;
  while(i < u8.length-3){
    if(dv.getUint32(i, true) !== 0x04034b50) break;
    const nameLen=dv.getUint16(i+26, true), extraLen=dv.getUint16(i+28, true);
    const size=dv.getUint32(i+18, true);
    const nameStart=i+30;
    const name=new TextDecoder().decode(u8.subarray(nameStart, nameStart+nameLen));
    const dataStart=nameStart+nameLen+extraLen;
    out.push({ name, data:u8.subarray(dataStart, dataStart+size) });
    i = dataStart + size;
  }
  return out;
}

/* ============================================================
   ゴミ箱
   ============================================================ */
const TRASH_GROUPS = [
  { key:'sv', label:'調査',   name:x=>x.name||'(名称未設定)' },
  { key:'re', label:'区間',   name:x=>x.name||'(区間)' },
  { key:'rd', label:'産卵床', name:x=>`${reddName(x)} ${x.species||'種不明'}` },
  { key:'nt', label:'メモ',   name:x=>(x.content||'').slice(0,30)||'(メモ)' },
  // メッシュのマスはここに並べない（100マスの範囲を消すとゴミ箱が100行になる）。
  // 親の物理環境を戻せば、中のマスもいっしょに戻る
  { key:'un', label:'物理環境',
    name:x=>`${x.name||'(記録)'} ${envMethod(x)}${x.habitat_type?' '+habitatShort(x.habitat_type):''}` },
];
SCREENS.trash = ()=>{
  const blocks = TRASH_GROUPS.map(g=>{
    const list = DB.deleted(DB.key[g.key]);
    if(!list.length) return '';
    return `<div class="sect">${g.label}（${list.length}）</div>` + list.map(x=>`
      <div class="card"><div class="row">
        <div class="grow"><div>${esc(g.name(x))}</div>
          <div class="tiny muted">削除 ${fmtDate(x.deleted_at)} ${fmtTime(x.deleted_at)}</div></div>
        <button class="btn ghost small" style="width:auto" onclick="restoreItem('${g.key}','${x.uuid}')">戻す</button>
      </div></div>`).join('');
  }).join('');
  const total = TRASH_GROUPS.reduce((a,g)=>a+DB.deleted(DB.key[g.key]).length, 0);
  return {
    title:'ゴミ箱',
    sub:[{text:`${total} 件`}],
    html: total ? `${blocks}<div class="sp"></div>
        <button class="btn danger big" onclick="purgeAll()">ゴミ箱を空にする（完全に消す）</button>
        <div class="tiny muted" style="margin-top:8px">空にすると元に戻せません。写真も一緒に消えます。</div>`
      : `<div class="empty">ゴミ箱は空です。</div>`
  };
};
function restoreItem(k, u){
  // 調査がゴミ箱にあるうちは、中の記録だけを戻さない。
  // 戻すと「調査から辿れない記録」ができ、ゴミ箱を空にしても消えずに残る
  if(k!=='sv'){
    const x = DB.get(DB.key[k], u);
    // どの調査のものか分からない記録も、単独では戻さない（戻しても辿れない）
    if(x && !x.survey_uuid){
      alert('この記録がどの調査のものか分からないため、戻せません。'
        + 'バックアップから戻すことをご検討ください。');
      return;
    }
    if(x && !DB.survey(x.survey_uuid)){
      alert('この記録が入っている調査も、ゴミ箱にあります。先に調査を戻してください。');
      return;
    }
  }
  if(!DB.restore(DB.key[k], u)){ alert('戻せませんでした。端末の空き容量を確認してください。'); return; }
  // 調査を戻すときは、一緒に消えた記録もまとめて戻す（空の調査が復活しないように）
  if(k==='sv'){
    let n=0;
    ['re','rd','nt','un'].forEach(ck=>{
      DB.deleted(DB.key[ck]).filter(x=>x.deleted_by===u).forEach(x=>{ if(DB.restore(DB.key[ck], x.uuid)) n++; });
    });
    // 「調査中」のまま戻すと調査中が2つになることがある。その場合は「終了」として戻す
    // （データは全部残る。調査画面の「調査を再開」でいつでも調査中に戻せる）
    const s = DB.survey(u);
    if(s && s.status==='調査中' && DB.surveys().some(x=>x.uuid!==u && x.status==='調査中')){
      DB.upsert(DB.key.sv, { uuid:u, status:'終了', end_datetime: s.end_datetime || nowISO() });
      toast('別の調査が調査中のため、「終了」の状態で戻しました（再開ボタンで戻せます）');
    }else toast(n ? `調査と記録 ${n} 件を戻しました` : '戻しました');
    resyncTrack();   // 戻した区間に軌跡の続きを付けられるなら付け直す
  }else toast('戻しました');
  render();
}
// 保存されている記録を全部読む。1つでも読めなければ null を返す
// （DB.load は壊れていても空配列を返すので、ここでは loadRaw を使う）
function readAllRaw(){
  const raw = {};
  try{ CORE_KEYS.forEach(k=>{ raw[k] = DB.loadRaw(DB.key[k]); }); }
  catch(e){ return null; }
  return raw;
}
function trashCountOf(raw){
  return TRASH_GROUPS.reduce((a,g)=>
    a + (raw[g.key]||[]).filter(x=>x && x.deleted_at).length, 0);
}
/* ゴミ箱を空にしたあとに残るもの＝「ゴミ箱に入っていない」かつ「親から辿れる」もの。
   どの調査のものか分からない記録は、辿れないので残さない */
function purgeKeep(raw){
  const keep = {};
  keep.sv = raw.sv.filter(x=>x && !x.deleted_at);
  const svAlive = new Set(keep.sv.map(x=>x.uuid));
  ['re','rd','nt','un'].forEach(k=>{
    keep[k] = raw[k].filter(x=>x && !x.deleted_at && x.survey_uuid && svAlive.has(x.survey_uuid));
  });
  const unAlive = new Set(keep.un.map(x=>x.uuid));
  // マスはゴミ箱に並べていないので、親の物理環境から辿れるかどうかで決める
  keep.mc = raw.mc.filter(x=>x && !x.deleted_at && x.unit_uuid && unAlive.has(x.unit_uuid));
  return keep;
}
/* 実際に消えるものの一覧。件数だけを見ると、
   確認しているあいだに「1件戻して別の1件を消す」が起きたときに見逃す。
   UUIDで見比べると、保存データが壊れて同じUUIDが2つあるときや
   UUIDの無いときに取りこぼすので、そのもの（同じ raw の中の参照）で見る */
function purgeTargets(raw){
  const keep = purgeKeep(raw);
  const out = [];
  CORE_KEYS.forEach(k=>{
    const kept = new Set(keep[k]);
    raw[k].forEach(x=>{
      if(x && kept.has(x)) return;
      // 区切り文字が中身とぶつからないように、JSONの形で並べる
      out.push(JSON.stringify([k, (x && x.uuid!==undefined) ? x.uuid : null,
                                  (x && x.deleted_at!==undefined) ? x.deleted_at : null]));
    });
  });
  return out.sort();
}
function purgeAll(){
  // 読めない保存データが1つでもあるうちは、何も消さない。
  // 読み取りに失敗したものを「空」と見なすと、無事な記録まで道連れにしてしまう
  const peek = readAllRaw();
  if(!peek){
    alert('保存された記録の一部を読み取れないため、ゴミ箱を空にしませんでした。\n'
      + '先にバックアップを書き出して、中身をご確認ください。');
    return;
  }
  const total = trashCountOf(peek);
  const before = purgeTargets(peek);      // 消える予定のものを、UUIDまで控える
  if(!confirm(`ゴミ箱の ${total} 件を完全に消します。元に戻せません。よろしいですか？`)) return;

  // 確認しているあいだに、別のタブが記録を足したり戻したりしていることがある。
  // 数えたときの写しで上書きすると、その分が消えてしまうので読み直す
  const raw = readAllRaw();
  if(!raw){
    alert('保存された記録の一部を読み取れないため、ゴミ箱を空にしませんでした。');
    return;
  }
  // 件数だけを見ると、「1件戻して別の1件を消す」で数が変わらないときに見逃す。
  // 消える予定のものを1つずつ突き合わせる
  const after = purgeTargets(raw);
  if(before.length !== after.length || before.some((x,i)=>x!==after[i])){
    alert('確認しているあいだに、ゴミ箱の中身が変わりました。\n'
      + '何も消していません。もう一度お試しください。');
    render();
    return;
  }

  const keep = purgeKeep(raw);
  let ok = true;
  CORE_KEYS.forEach(k=>{ if(!DB.save(DB.key[k], keep[k])) ok = false; });
  try{ PhotoDB.gc(); }catch(e){}   // 参照されなくなった写真も片付ける
  toast(ok ? 'ゴミ箱を空にしました'
           : '一部を消せませんでした（端末の空き容量をご確認ください）');
  render();
}

/* いま配信されている版を見に行く（読むだけ。何も消さない） */
function checkLatestVersion(){
  return fetch('./redd_survey.html', {cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error('取りに行けませんでした（'+r.status+'）');
      return r.text();
    })
    .then(t=>{
      const m = t.match(/const APP_VERSION = '([^']*)'/);
      if(!m) throw new Error('版が読み取れませんでした');
      const d = t.match(/const APP_DATE = '([^']*)'/);
      return {version:m[1], date: d ? d[1] : ''};
    });
}
/* 「新しい版があるか見る」。何も消さずに、比べた結果だけを画面に出す */
function checkUpdate(){
  const box = $('#updInfo');
  if(box) box.textContent = '調べています…';
  checkLatestVersion().then(x=>{
    const el = $('#updInfo'); if(!el) return;
    el.textContent = x.version === APP_VERSION
      ? `最新です（${APP_VERSION}）`
      : `新しい版があります：${x.version}`
        + (x.date ? `（${x.date}）` : '')
        + `　いまは ${APP_VERSION}。下のボタンで取り込めます`;
  }).catch(e=>{
    const el = $('#updInfo'); if(!el) return;
    el.textContent = '調べられませんでした：' + e.message
      + '（電波の届くところでお試しください）';
  });
}

// 「最新に更新」：このアプリのキャッシュだけ消して読み直す。他アプリのキャッシュは触らない。
// 消してよい保管場所は、自分のものだけに絞る。
// 圏外用に自分で囲って落とした地図（redd-map-pack-）は、更新と関係がないので消さない
function cachesToClear(keys){
  return (keys||[]).filter(k =>
    k.startsWith('redd-survey-') || k.startsWith('redd-map-tiles-'));
}
function forceUpdate(){
  // 圏外用の地図を出し入れしている最中なら、聞くまでもなく止める
  if(typeof packLocked==='function' && packLocked()){
    toast('圏外用の地図の出し入れが終わっていません。終わってからお試しください');
    return;
  }
  if(!confirm('アプリのプログラムだけを最新に読み込み直します。\n\n'
    + '・記録した調査・産卵床・物理環境はそのまま残ります\n'
    + '・圏外用に落とした地図もそのまま残ります\n'
    + '・電波の届くところで行ってください\n\nよろしいですか？')) return;

  // 先に取れるか確かめる。取れないまま消すと、圏外では二度と開けなくなる
  toast('新しい版があるか調べています…');
  checkLatestVersion().then(x=>{
    if(x.version === APP_VERSION
       && !confirm(`いま入っている ${APP_VERSION} が最新です。\nそれでも読み込み直しますか？`)){
      toast('やめました');
      return;
    }
    doForceUpdate();
  }).catch(e=>{
    toast('新しい版を取りに行けませんでした：' + e.message
      + '。電波の届くところでお試しください（何も消していません）');
  });
}
async function doForceUpdate(){
  toast('最新に読み込み直しています…');
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(cachesToClear(keys).map(k=>caches.delete(k)));
    }
  }catch(e){ console.error(e); }
  location.reload();
}

// アプリが裏に回る・閉じられるときにも、書きかけと軌跡を控えておく
// 閉じる・裏へ回るときは、自動保存の待ち0.6秒ぶんを先に書いてしまう。
// 書かないと、打った直後にアプリを閉じただけで消える
// 閉じる・裏へ回るときは、自動保存の待ち0.6秒ぶんを先に書いてしまう。
// 書けなかったぶん（値がおかしい・端末がいっぱい）は控えを残す
function onLeaveApp(){
  envFlush();          // 自動保存の待ち0.6秒ぶんを、先に書いてしまう
  stashEditDraft(); trackSave();
}
/* 保存できなかったことを、その場で伝える。
   閉じるときには何も出せないので、失敗した時点で気づいてもらうしかない */
function tellSaveFailed(){
  toast('保存できませんでした。端末の空き容量をご確認ください'
    + '（空きを作ってから、もう一度この記録を触ると保存されます）');
}
window.addEventListener('pagehide', onLeaveApp);
document.addEventListener && document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden') onLeaveApp();
});

/* v21 までは、産卵床の記録画面に「書きかけ」を控える仕組みがあった。
   v22 で記録画面をやめたので、そのままだと控えが開けないまま取り残される。
   一度だけ、まだ保存されていない書きかけを本物の記録に起こす */
/* v21 の書きかけに、人が打った中身があるか。
   自動で入るだけの位置（GPS）は数えない。数えると、開いてすぐ戻っただけの
   空の書きかけが記録になってしまう。
   記録の種類は、既定の「産卵床」から変えてあれば人が触った印（空にしたのも含む） */
function oldReddDraftHasContent(x){
  const f = v => v!=='' && v!=null;
  const arr = v => Array.isArray(v) && v.length>0;
  const t = x.record_targets;
  const targetsTouched = Array.isArray(t) && !(t.length===1 && t[0]==='産卵床');
  return !!(targetsTouched ||
    x.species || x.species_basis || x.age_class || x.state || x.river_form ||
    x.substrate_main || x.substrate_sub || x.embeddedness || x.cover || x.behavior ||
    x.note || x.needs_review ||
    f(x.length_cm) || f(x.width_cm) ||
    f(x.female_n) || f(x.male_n) || f(x.carcass_n) ||
    f(x.water_temp_c) || f(x.intragravel_temp_c) || f(x.temp_depth_cm) ||
    arr(x.env_points) || arr(x.photos) ||
    // 片方だけでも人が打った印。取り込み側で「前の位置のまま」にして理由を残す
    ((x.position_source==='地図' || x.position_source==='手入力') && (f(x.latitude) || f(x.longitude))));
}
/* v21 の控えを、記録の形に整える。base は「新しいひな形」か「すでにある記録」。
   保存のときと同じ考え方: 値がおかしくても残し、理由を付けて「要確認」にする */
function oldReddDraftToRecord(x, base){
  const rec = Object.assign({}, base, x, {
    uuid: base.uuid, survey_uuid: base.survey_uuid, redd_no: base.redd_no,
    created_at: base.created_at });
  delete rec._kind; delete rec._sv; delete rec._new;
  const reasons = [];
  if(!Array.isArray(rec.record_targets) || !rec.record_targets.length){
    rec.record_targets = recordTargets(base);
    reasons.push(TARGET_NOTE);
  }
  // 座標にならない文字は入れられない。位置は base のまま（由来・誤差も一緒に）
  const pos = parsePos(rec.latitude, rec.longitude);
  if(pos.ok){
    rec.latitude = pos.lat; rec.longitude = pos.lon;
    if(pos.empty){ rec.gps_accuracy = ''; rec.position_source = ''; }   // 位置が無いなら由来も誤差も無い
  }else{
    rec.latitude = base.latitude??''; rec.longitude = base.longitude??'';
    rec.gps_accuracy = base.gps_accuracy??''; rec.position_source = base.position_source??'';
    reasons.push(pos.why + POS_NOTE);
  }
  rec.env_points = envPoints(rec);
  rec.area_m2 = reddAreaNext(rec, base);
  rec.review_manual = !!x.needs_review;
  rec.review_reasons = reasons.concat(reddOddValues(rec, rec.env_points));
  rec.needs_review = rec.review_manual || rec.review_reasons.length>0;
  return rec;
}
/* v21 までは、産卵床の記録画面に「書きかけ」を控える仕組みがあった。
   v22 で記録画面をやめたので、そのままだと控えが開けないまま取り残される。
   新しい書きかけは記録に起こし、既存の記録の編集途中は記録に重ねる。
   取り込めなかったものは控えを消さず、次に開いたときもう一度試す */
/* 控えの中身の印。並びをそろえて文字にする。
   取り込んだ記録にこの印を残し、控えを片付けるときに「同じ中身か」を見る。
   片付けに失敗したあと（旧版の画面などで）控えが変わっていれば、変わった中身を重ね直す */
function draftSig(x){
  const norm = v => (v && typeof v==='object' && !Array.isArray(v))
    ? Object.keys(v).sort().reduce((o,k)=>{ o[k]=norm(v[k]); return o; }, {})
    : (Array.isArray(v) ? v.map(norm) : v);
  return JSON.stringify(norm(x));
}
function migrateOldReddDrafts(){
  // 「済み」の印で飛ばさない。印を付けたあとに控えが増える（旧版の画面が残っていた）と届かなくなる。
  // 控えが無ければ何もしないので、毎回見ても軽い
  // 書く前に、読めることを厳しく確かめる。壊れたデータを「空」と読み違えると、
  // 取り込んだ1件で既存の記録を丸ごと上書きしてしまう。読めなければ何もしない
  let d;
  try{ d = editDraftsStrict(); DB.loadRaw(DB.key.rd); DB.loadRaw(DB.key.sv); }
  catch(e){ console.error(e); return 0; }          // 「済み」にもしない
  let n = 0, left = 0;
  Object.keys(d).forEach(u=>{
    try{
      const x = d[u];
      if(!x || x._kind !== 'redd') return;
      const cur = DB.get(DB.key.rd, u);
      const sig = draftSig(x);
      if(cur){
        // すでに記録がある。
        //  - 取り込んだ印（draft_merged_sig）がこの控えと同じ → 取り込み済み。片付けるだけ
        //    （控えを消せずに残ったとき、次回の起動であとの直しを巻き戻さないため）
        //  - 印が違う → 片付けに失敗したあとで控えが変わった。変わった中身を重ね直す
        //  - 印が無い: 編集途中の控え（_new でない）なら重ねる。
        //    新しい控え（_new）なら v21 で保存し終えた記録の残りなので、記録のほうが新しい。重ねない
        const merged = cur.draft_merged_sig === sig;
        const apply = !merged && (cur.draft_merged_sig!=null || !x._new);
        if(apply){
          const rec = oldReddDraftToRecord(x, cur);
          rec.draft_merged_sig = sig; rec.draft_merged_at = nowISO();
          if(!DB.put(DB.key.rd, rec)){ left++; return; }
        }
        if(!editDraftClearIfSig(u, sig)){ left++; return; }   // 途中で変わっていたら消さない
        if(apply) n++;                                        // 片付くまでは「取り込んだ」と数えない
        return;
      }
      if(!DB.survey(x._sv)){ left++; return; }          // 調査が見つからない。消さずに残す
      if(!oldReddDraftHasContent(x)){                   // 中身が無いものだけ片付ける
        if(!editDraftClearIfSig(u, sig)) left++;
        return;
      }
      // 番号は必ず取り直す（newRedd が振る）。控えを作ったあとに同じ番号が
      // 使われていることがあり、そのまま持ち込むと同じ調査に S1 が2つできる
      const rec = oldReddDraftToRecord(x, Object.assign(newRedd(x._sv, {}), { uuid:u }));
      rec.draft_merged_sig = sig; rec.draft_merged_at = nowISO();   // どの控えから起こしたか
      if(!DB.put(DB.key.rd, rec)){ left++; return; }    // 書けなかった。控えは残す
      if(!editDraftClearIfSig(u, sig)){ left++; return; }   // 消せなかった・途中で変わった。次回もう一度
      n++;
    }catch(e){ console.error(e); left++; }
  });
  return n;
}

(function boot(){
  const moved = migrateOldReddDrafts();
  resumeTracking();   // 記録中の区間があれば、開き直しても軌跡の記録を続ける
  render();   // 先に画面を出す。この後の準備を待つと起動時に一瞬何も映らないため
  if(moved) setTimeout(()=>toast(`前の版の書きかけ ${moved}件を、記録として取り込みました`), 300);
  try{ PhotoDB.gc(); }catch(e){}   // どこからも使われなくなった写真を片付ける
  try{ orthoChannel(); orthoPreload().catch(e=>console.error(e)); }catch(e){}   // ドローン写真を読んで、地図に重ねられるようにする（別のタブの変更も受ける）
  // 保存領域を消されにくくする（写真やタイルを抱えるため）
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(e=>console.error(e)); });
  }
})();
</script>
